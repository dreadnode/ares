---
# Multi-Agent Red Team Production Configuration
# This configuration defines the operational parameters for multi-agent
# red team operations in a Kubernetes environment.

operation:
  name: "ares-multi-agent"
  namespace: "attack-simulation"
  # redis_url is derived from namespace (redis://redis.{namespace}.svc.cluster.local:6379)
  checkpoint_interval: 60  # seconds
  # Rate limiting - balance concurrency with 500k TPM budget
  # 3 concurrent tasks allows recon + cred access + exploit in parallel
  max_concurrent_tasks: 3
  task_dispatch_delay: 2.0
  rate_limit_backoff: 15.0
  rate_limit_threshold: 2

# Agent configurations
agents:
  orchestrator:
    model: "gpt-5.2"
    max_steps: 200
    pod_selector: "app.kubernetes.io/name=ares-orchestrator"
    # Tools: OrchestratorTools, RedTeamReportingTools
    # NOTE: Orchestrator NEVER executes tools directly - it dispatches to workers
    tools:
      # Dispatch to worker agents
      - dispatch_recon
      - dispatch_credential_access
      - dispatch_crack_hash
      - dispatch_acl_analysis
      - dispatch_lateral_movement
      - dispatch_privesc_exploit
      - start_coercion
      # Workflow triggers
      - trigger_credential_expansion
      - queue_vulnerability_for_exploitation
      # State queries
      - get_pending_tasks
      - get_all_credentials
      - get_all_hashes
      - get_exploitation_status
      - get_agent_status
      - get_operation_summary
      # Reporting
      - broadcast_credential
      - announce_domain_admin
      - complete_operation

  recon:
    model: "gpt-5.2"
    max_steps: 100
    pod_selector: "ares.dreadnode.io/role=recon"
    # Tools: NetworkEnumerationTools, BloodHoundTools, RedTeamReportingTools
    capabilities:
      # Network scanning
      - nmap
      # LDAP enumeration
      - ldapsearch
      # SMB enumeration
      - enum4linux
      - enum4linux-ng
      - rpcclient
      # DNS utilities
      - dig
      - nslookup
      - whois
      - adidnsdump
      # AD tools
      - netexec
      - bloodhound-python
      - certipy
      # Impacket (limited to enumeration)
      - impacket-getnpusers
      - impacket-getuserspns

  credential_access:
    model: "gpt-5.2"
    max_steps: 100
    pod_selector: "ares.dreadnode.io/role=credential_access"
    # Tools: NetworkEnumerationTools, CredentialDiscoveryTools, CredentialHarvestingTools, SharePilferingTools
    capabilities:
      # SMB access
      - smbclient
      - rpcclient
      # AD credential attacks
      - sprayhound
      - targetedkerberoast
      - lsassy
      - gMSADumper
      # Impacket
      - impacket-getnpusers
      - impacket-secretsdump

  cracker:
    model: "gpt-5.2"
    max_steps: 150
    pod_selector: "ares.dreadnode.io/role=cracker"
    # Tools: CrackingTools, CrackerCallbackTools
    capabilities:
      # Cracking tools
      - hashcat
      - john
      # Wordlists
      - rockyou
      - seclists

  acl:
    model: "gpt-5.2"
    max_steps: 150  # ACL analysis requires complex path finding
    pod_selector: "ares.dreadnode.io/role=acl"
    # Tools: ACLExploitTools
    capabilities:
      # ACL abuse tools
      - bloodyad
      - pywhisker
      - targetedkerberoast
      - rpcclient
      # Impacket
      - impacket-dacledit

  privesc:
    model: "gpt-5.2"
    max_steps: 100
    pod_selector: "ares.dreadnode.io/role=privesc"
    # Tools: CertipyTools, DelegationTools, MSSQLTools, CVEExploitTools, GoldenTicketTools, TrustAttackTools, LateralMovementTools
    capabilities:
      # ADCS exploitation
      - certipy
      # Credential extraction
      - lsassy
      # Kerberos attacks
      - nopac
      - krbrelayx
      - printerbug
      - addspn
      - dnstool
      # Impacket
      - impacket-findDelegation
      - impacket-getst
      - impacket-gettgt
      - impacket-rbcd
      - impacket-addcomputer
      - impacket-lookupsid
      - impacket-mssqlclient
      - impacket-raisechild
      - impacket-ticketer
      - impacket-secretsdump  # S4U → secretsdump chain must complete on same pod
      - impacket-psexec       # S4U → psexec chain must complete on same pod
      # Windows privesc binaries
      - printspoofer
      - godpotato
      - sweetpotato
      - krbrelayup
      - sharpgpoabuse
      - pygpoabuse
      - seatbelt
      - sharpup
      - runascs
      # Privesc scripts
      - powerup
      - powerupsql
      - winpeas
      - linpeas
      # CVE exploits
      - printnightmare
      - zerologon
      - scmuacbypass

  lateral:
    model: "gpt-5.2"
    max_steps: 300
    pod_selector: "ares.dreadnode.io/role=lateral"
    # Tools: LateralMovementTools, CredentialHarvestingTools, SharePilferingTools, PostureValidationTools, LateralCallbackTools
    capabilities:
      # Remote access
      - evil-winrm
      - xfreerdp
      - sshpass
      # SMB
      - smbclient
      # Pivoting
      - proxychains4
      # Pass-the-Hash
      - pth-toolkit
      # Impacket
      - impacket-psexec
      - impacket-wmiexec
      - impacket-smbexec
      - impacket-secretsdump

  coercion:
    model: "gpt-5.2"
    max_steps: 30
    pod_selector: "ares.dreadnode.io/role=coercion"
    # Tools: CoercionTools, CoercionNetworkTools
    capabilities:
      # Poisoning
      - responder
      - mitm6
      # Coercion tools
      - coercer
      - petitpotam
      - dfscoerce
      # Relay tools
      - krbrelayx
      - printerbug
      - addspn
      - dnstool
      # Impacket
      - impacket-ntlmrelayx

# Timeout configurations
timeouts:
  agent_heartbeat: 180  # seconds - agent considered offline after this
  task_timeout: 300  # seconds - default task timeout
  operation_timeout: 7200  # seconds - 2 hours max operation time
  lateral_movement: 180  # seconds
  hash_cracking: 600  # seconds - 10 minutes
  exploitation: 900  # seconds - ACL tasks can take 10+ minutes

# Recovery configuration
recovery:
  enabled: true
  max_retries: 3
  retry_delay: 10  # seconds
  checkpoint_on_credential: true
  checkpoint_on_vulnerability: true

# Phase detection thresholds (see PRIORITY.md for rationale)
# Used to determine operation phase for task prioritization
phase_detection:
  # Transition to lateral_movement phase when:
  lateral_movement_admin_creds: 3  # >= this many admin credentials
  lateral_movement_owned_hosts: 5  # >= this many owned hosts
  # Minimum slots per worker role (prevents starvation)
  min_slots_per_role: 1

# Context management settings
# Prevents context window exhaustion in long-running operations
context_management:
  # Trigger conversation summarization when orchestrator exceeds this token count
  # Set to ~85% of model context window to leave room for response
  max_context_tokens: 100000
  # Keep this many recent messages after summarization
  min_messages_to_keep: 10
  # Truncate task outputs to this size in broadcasts to orchestrator
  # Structured discoveries are preserved; only raw output is truncated
  max_output_chars: 2000

# Vulnerability priorities (lower = higher priority)
vulnerability_priorities:
  ADCS_ESC1: 1
  ADCS_ESC4: 2
  ADCS_ESC8: 3
  krbtgt_hash: 4
  domain_admin_hash: 5
  acl_abuse: 6
  unconstrained_delegation: 7
  constrained_delegation: 8
  rbcd: 9
  mssql_impersonation: 10
  mssql_linked: 11
  gpo_abuse: 12
  laps_abuse: 13
  dcsync: 14
  shadow_credentials: 15
  kerberoast: 20
  asreproast: 21
  password_spray: 50

# Logging configuration
logging:
  level: "INFO"
  format: "%(asctime)s | %(levelname)s | %(name)s | %(message)s"
  file: "/var/log/ares/operation.log"
  max_size_mb: 100
  backup_count: 5

# Resource limits
resources:
  max_concurrent_tasks: 10
  max_credentials_per_expansion: 100
  max_hosts_per_scan: 50
  credential_cache_ttl: 3600  # seconds

# Security settings
security:
  verify_ssl: true
  encrypted_state: false  # Enable for sensitive operations
  audit_logging: true
  rate_limiting:
    enabled: true
    max_requests_per_minute: 60

# Grafana integration (for alerting)
grafana:
  enabled: true
  base_url: "${GRAFANA_URL}"
  api_key: "${GRAFANA_API_KEY}"
  dashboard_uid: "ares-redteam"
