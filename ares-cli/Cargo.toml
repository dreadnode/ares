[package]
name = "ares-cli"
version = "0.2.0"
edition = "2021"
description = "Unified binary for the Ares red team orchestration system"

[[bin]]
name = "ares"
path = "src/main.rs"

[features]
default = ["blue"]
blue = ["ares-core/blue", "ares-llm/blue", "ares-tools/blue"]

[dependencies]
ares-core = { path = "../ares-core", features = ["telemetry"] }
ares-llm = { path = "../ares-llm" }
ares-tools = { path = "../ares-tools" }
serde = { workspace = true }
serde_json = { workspace = true }
serde_yaml = { workspace = true }
tokio = { workspace = true }
redis = { workspace = true }
async-nats = { workspace = true }
futures = { workspace = true }
bytes = { workspace = true }
chrono = { workspace = true }
tracing = { workspace = true }
tracing-subscriber = { workspace = true }
clap = { workspace = true }
anyhow = { workspace = true }
base64 = "0.23"
uuid = { workspace = true }
sqlx = { workspace = true }
regex = { workspace = true }
dotenvy = "0.15"
async-trait = "0.1"
rand = "0.10"
thiserror = { workspace = true }
hickory-resolver = { workspace = true }
local-ip-address = "0.6"
reqwest = { version = "0.13", default-features = false, features = ["rustls", "json"] }
rustix = { version = "1", features = ["fs"] }
flate2 = "1"

[build-dependencies]
serde = { version = "1", features = ["derive"] }
serde_yaml = "0.9"

[dev-dependencies]
tokio = { workspace = true }
rstest = "0.26"
tempfile = "3"
ares-core = { path = "../ares-core", features = ["test-utils", "blue", "telemetry"] }

[lints]
workspace = true
