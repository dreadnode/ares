    severity: high
    connection_types: [wmi]
    red_team_tool: wmiexec
    auto_pivot: true
    filter_stages:
      - ['wmi', 'win32_process', 'root\\cimv2']
      - ['wmiexec', 'impacket', 'cmd.*/q.*/c', '127\.0\.0\.1.*admin\$']

  detect_impacket_psexec:
    description: "Impacket psexec Service-Based Execution Detection"
    mitre_id: "T1569.002"
    tactic: execution
    severity: high
    connection_types: [psexec]
    red_team_tool: psexec
    auto_pivot: true
    filter_stages:
      - ['7045', 'service.*install', 'psexec', 'remcom']
      - ['admin\$', '\\\\.*\\admin', 'service.*creat', 'cmd\.exe']

  detect_impacket_smbexec:
