# Detection Configuration
#
# This file defines all detection templates, activity scopes, and event ID
# reference data. It is the single source of truth for the blue team detection
# system. The Rust code loads this at compile time via include_str!() and
# composes LogQL queries from the structured fields.
#
# To add a new detection:
#   1. Add an entry under `templates:` with the required fields
#   2. Use `event_ids` for Windows Event ID pre-filters
#   3. Use `patterns` for a single regex filter stage (OR within)
#   4. Use `filter_stages` for multiple chained regex filters (AND between stages)
#   5. Rebuild — the catalog and query builder pick it up automatically
#
# LogQL composition order:
#   {selector} + event_filter(event_ids) + pattern_filter(patterns) + pattern_filter(filter_stages[0]) + ...

# ═══════════════════════════════════════════════════════════════════════════════
# Event ID Reference
# ═══════════════════════════════════════════════════════════════════════════════
# Gives the agent context about what each Windows Security/System event means.
# Not used for query building — purely informational.

event_id_reference:
  "4624": "Successful logon"
  "4625": "Failed logon"
  "4648": "Logon with explicit credentials"
  "4656": "Handle to object requested"
  "4658": "Handle to object closed"
  "4662": "Operation performed on directory service object"
  "4663": "Attempt to access object"
  "4672": "Special privileges assigned to new logon"
  "4688": "New process created"
  "4697": "Service installed on system"
  "4698": "Scheduled task created"
  "4699": "Scheduled task deleted"
  "4700": "Scheduled task enabled"
  "4701": "Scheduled task disabled"
  "4768": "Kerberos TGT requested (AS-REQ)"
  "4769": "Kerberos service ticket requested (TGS-REQ)"
  "4771": "Kerberos pre-authentication failed"
  "4798": "User local group membership enumerated"
  "4799": "Security-enabled local group membership enumerated"
  "4876": "Certificate Services backup performed"
  "4886": "Certificate Services received certificate request"
  "4887": "Certificate Services approved and issued certificate"
  "5136": "Directory service object modified"
  "5140": "Network share accessed"
  "5145": "Network share object access checked"
  "7036": "Service state changed (System log)"
  "7045": "New service installed (System log)"

# ═══════════════════════════════════════════════════════════════════════════════
# Activity Scopes
# ═══════════════════════════════════════════════════════════════════════════════
# Event ID groups used by get_host_activity and get_user_activity to pre-filter
# the log stream to security-relevant events.

activity_scopes:
  host_attack_patterns:
    - "4625"
    - "4624"
    - "4662"
    - "4769"
    - "4768"
    - "5140"
    - "7045"
    - "4688"
  host_all_security:
    - "4624"
    - "4625"
    - "4648"
    - "4662"
    - "4663"
    - "4672"
    - "4688"
    - "4768"
    - "4769"
    - "5140"
    - "5145"
    - "7045"
    - "4697"
    - "4698"
  user_activity:
    - "4624"
    - "4625"
    - "4648"
    - "4662"
    - "4768"
    - "4769"
    - "4672"
    - "5140"
    - "5145"

# ═══════════════════════════════════════════════════════════════════════════════
# Lateral Movement Patterns
# ═══════════════════════════════════════════════════════════════════════════════
# Connection-type classifiers for the lateral movement analyzer. Each entry
# maps a connection type name to a list of case-insensitive regex patterns.
# If ANY pattern matches query result text, the connection is classified as
# that type. These are separate from detection templates — they classify
# observed evidence, not compose LogQL queries.

lateral_patterns:
  smb:
    - 'smb|445|admin\$|c\$|ipc\$'
    - 'tree.*connect|share.*access'
    - '5140|5145'
  rdp:
    - 'rdp|3389|remote.*desktop'
    - '4624.*logon.*type.*10'
    - 'termsrv|mstsc'
  wmi:
    - 'wmi|135|win32_process|root\\cimv2'
    - 'wmic|wmiprvse'
  psexec:
    - 'psexec|7045|service.*install'
    - 'psexesvc|remcom'
  winrm:
    - 'winrm|5985|5986|powershell.*session'
    - 'wsman|enter-pssession'
  ssh:
    - 'ssh|22/tcp|publickey|openssh'
  dcom:
    - 'dcom|135/tcp|mmc20|shellwindows'
    - 'dcomexec|ole32'
  scheduled_task:
    - '4698|schtasks|taskscheduler'
    - 'at.*exec|scheduled.*task'
  mssql:
    - 'openquery|openrowset|sp_linkedservers'
    - 'exec.{0,30}at.*\[|linked.server'
    - 'xp_cmdshell|sp_configure.{0,30}xp_cmdshell'
    - 'mssqlclient|execute.as|impersonate'
  constrained_delegation:
    - 'TransmittedServices'
    - 's4u2self|s4u2proxy|getST'
    - 'allowedtodelegateto|trustedfordelegation'
    - 'constrained.delegation|protocol.transition'
  ntlm_relay:
    - 'ntlmrelayx|smbrelay|responder'
    - 'signing.*not.*required|signing.*disabled'
    - 'ntlm.*relay|relay.*attack'
    - 'petitpotam|printerbug|coerce'

# ═══════════════════════════════════════════════════════════════════════════════
# Detection Templates
# ═══════════════════════════════════════════════════════════════════════════════
#
# Fields:
#   description      - Human-readable name (required)
#   mitre_id         - MITRE ATT&CK technique ID (required)
#   tactic           - ATT&CK tactic (required)
#   severity         - critical / high / medium / low (required)
#   aliases          - Alternative names for this template (optional)
#   red_team_tool    - Ares red team tool that triggers this (optional)
#   auto_pivot       - Whether blue agent should auto-investigate hits (default: false)
#   log_source       - "windows-security" (default) or "windows-system"
#   host_as_filter   - Also add hostname as |= line filter (default: false)
#   event_ids        - Windows Event IDs for pre-filtering (optional)
#   patterns         - Single-stage regex patterns, OR'd (optional)
#   filter_stages    - Multi-stage regex filters, AND'd between stages (optional)
#   connection_types - Lateral movement connection types this template covers (optional)
#                      Used by templates_for_connection_type() to filter templates.
#                      Values: smb, psexec, wmi, dcom, mssql, winrm, rdp, ssh,
#                              scheduled_task, constrained_delegation, ntlm_relay
#
# Use `patterns` OR `filter_stages`, not both. `patterns` is shorthand for a
# single filter stage.

templates:
  # ─── Reconnaissance & Discovery (TA0007) ──────────────────────────────────

  detect_port_scanning:
    description: "Network Port Scanning Detection"
    mitre_id: "T1046"
    tactic: discovery
    severity: medium
    red_team_tool: nmap_scan
    auto_pivot: false
    host_as_filter: true
    patterns:
      - 'nmap'
      - 'masscan'
      - 'syn.scan'
      - 'port.scan'
      - 'connection.refused'

  detect_user_enumeration:
    description: "AD User/Account Enumeration Detection"
    aliases: [detect_account_enumeration]
    mitre_id: "T1087.002"
    tactic: discovery
    severity: medium
    red_team_tool: enumerate_users
    event_ids: ["4662", "4798", "4799"]
    patterns:
      - 'samr'
      - 'lsarpc'
      - 'ldap'
      - 'net.user'
      - 'net.group'
      - 'enumerate'
      - 'crackmapexec'
      - 'netexec'
      - 'ldapsearch'

  detect_share_enumeration:
    description: "SMB Share Enumeration Detection"
    mitre_id: "T1135"
    tactic: discovery
    severity: medium
    connection_types: [smb]
    red_team_tool: enumerate_shares
    event_ids: ["5140", "5145"]
    patterns:
      - 'srvsvc'
      - 'netuse'
      - 'net.share'
      - 'net.view'
      - 'smbclient'
      - 'crackmapexec'
      - 'netexec'
      - 'enum.share'
      - 'share.enum'

  detect_smb_signing_disabled:
    description: "SMB Signing Disabled Exploitation Detection"
    mitre_id: "T1557.001"
    tactic: credential_access
    severity: high
    connection_types: [smb, ntlm_relay]
    red_team_tool: ntlmrelayx
    auto_pivot: true
    filter_stages:
      - ['smb', 'signing', '445']
      - ['signing.*not.*required', 'signing.*disabled', 'signing.*false', 'ntlmrelayx', 'smbrelay', 'relay.*attack']

  detect_mass_share_enumeration:
    description: "Mass SMB Share Enumeration Detection"
    mitre_id: "T1135"
    tactic: discovery
    severity: medium
    connection_types: [smb]
    red_team_tool: enumerate_shares
    auto_pivot: false
    event_ids: ["5140", "5145"]
    host_as_filter: false
    patterns:
      - 'ipc\$'
      - 'admin\$'
      - 'c\$'
      - 'sysvol'
      - 'netlogon'
      - 'shares'
      - 'srvsvc'
      - 'smbclient'
      - 'crackmapexec'
      - 'netexec'

  # ─── MSSQL Exploitation (TA0002/TA0008) ────────────────────────────────────

  detect_mssql_linked_server:
    description: "MSSQL Linked Server Exploitation Detection"
    mitre_id: "T1210"
    tactic: lateral_movement
    severity: critical
    connection_types: [mssql]
    red_team_tool: mssql_relay
    auto_pivot: true
    # Matches OPENQUERY/EXEC AT patterns from Grafana alert rules.
    patterns:
      - 'openquery'
      - 'openrowset'
      - 'exec.{0,30}at.*\['
      - 'sp_linkedservers'
      - 'sp_addlinkedserver'
      - 'linked.server'
      - 'rpc.*out'
      - 'oledb'
      - 'mssqlclient'

  detect_mssql_xp_cmdshell:
    description: "MSSQL xp_cmdshell Command Execution Detection"
    mitre_id: "T1059"
    tactic: execution
    severity: critical
    connection_types: [mssql]
    red_team_tool: mssql_relay
    auto_pivot: true
    # Matches xp_cmdshell patterns from Grafana alert rules.
    patterns:
      - 'xp_cmdshell'
      - 'sp_configure.{0,30}xp_cmdshell'
      - 'xp_dirtree'
      - 'xp_fileexist'
      - 'xp_subdirs'
      - 'xp_regread'
      - 'sp_oacreate'
      - 'sp_oamethod'

  detect_mssql_impersonation:
    description: "MSSQL User Impersonation Detection"
    mitre_id: "T1134"
    tactic: privilege_escalation
    severity: high
    connection_types: [mssql]
    red_team_tool: mssql_relay
    patterns:
      - 'execute.as'
      - 'impersonate'
      - 'login.*impersonat'
      - 'sysadmin'
      - 'trustworthy'
      - 'db_owner'
      - 'alter.*login'
      - 'mssqlclient'

  # ─── Credential Access (TA0006) ────────────────────────────────────────────

  detect_secretsdump:
    description: "Credential Dumping Detection (secretsdump)"
    mitre_id: "T1003"
    tactic: credential_access
    severity: critical
    red_team_tool: secretsdump
    patterns:
      - 'drsuapi'
      - 'samr'
      - 'secretsdump'
      - 'lsadump'
      - 'ntds.dit'
      - 'sam.dump'
      - 'replicate'
      - '1131f6'
      - 'ds-replication'
      - 'mimikatz'
      - 'impacket'

  detect_dcsync:
    description: "DCSync Attack Detection"
    mitre_id: "T1003.006"
    tactic: credential_access
    severity: critical
    red_team_tool: secretsdump
    event_ids: ["4662"]
    patterns:
      - 'dcsync'
      - 'ds-replication'
      - '1131f6aa'
      - '1131f6ad'
      - 'replication'
      - 'drsuapi'
      - 'directory.service.access'
    # Exclude machine accounts (ending in $) performing normal AD replication.
    # Machine accounts like DC01$, SQL01$ are legitimate domain controllers.
    # Only user accounts (no $ suffix) performing replication indicate DCSync attack.
    # NOTE: XML ">" is stored as JSON-escaped "\u003e" in Loki, so we use
    # ".u003e" (dot matches the literal backslash) instead of ">" in the regex.
    exclude_patterns:
      - "SubjectUserName'.u003e[A-Z0-9_-]+[$]"

  detect_dcsync_replication:
    description: "DCSync Replication GUID Detection"
    mitre_id: "T1003.006"
    tactic: credential_access
    severity: critical
    red_team_tool: secretsdump
    event_ids: ["4662"]
    patterns:
      - '1131f6aa-9c07-11d1-f79f-00c04fc2dcd2'
      - '1131f6ad-9c07-11d1-f79f-00c04fc2dcd2'
      - '89e95b76-444d-4c62-991a-0facbeda640c'
      - '1131f6aa'
      - '1131f6ad'
      - '89e95b76'
    exclude_patterns:
      - "SubjectUserName'.u003e[A-Z0-9_-]+[$]"

  detect_kerberoasting:
    description: "Kerberoasting Detection (TGS with RC4)"
    mitre_id: "T1558.003"
    tactic: credential_access
    severity: high
    red_team_tool: kerberoast
    event_ids: ["4769"]
    # Keyed on the TicketEncryptionType field, same as the golden ticket rule.
    # The three previous patterns were all broken, verified live vs Loki over a
    # 24h window (870 total 4769):
    #   - 'encryption.*type.*(0x17|rc4)'          → 690 matches. `encryption.*type`
    #     spans the *field name* (ServiceSupportedEncryptionTypes) and `.*rc4` then
    #     reaches a capability value — RC4 is listed in ServiceAvailableKeys /
    #     DCAvailableKeys / ClientAdvertizedEncryptionTypes on nearly every event.
    #   - 'ticket.*encryption.*(0x17|rc4)'        → 690 matches, same span failure.
    #   - 'servicename.*(mssql|http|ldap|cifs)'   → 0 matches. ServiceName is a SAM
    #     account name (e.g. svc_sql), never an SPN — the same blackhole that killed
    #     the S4U rule and that currently zeroes the golden ticket rule.
    # Net: 690 fired where 28 were real RC4 tickets (4% precision, 662 FPs/day).
    filter_stages:
      - ['TicketEncryptionType..u003e0x17']

  detect_asrep_roasting:
    description: "AS-REP Roasting Detection (TGT without pre-auth)"
    mitre_id: "T1558.004"
    tactic: credential_access
    severity: high
    red_team_tool: asrep_roast
    event_ids: ["4768"]
    # AS-REP roasting is PreAuthType=0 (TGT issued with no pre-auth) — match that
    # field exactly. All four previous patterns were OR'd into one stage and every
    # one of them over-matched; verified live vs Loki over 24h (590 total 4768):
    #   - 'preauthtype.*0' / 'pre.?auth.*type.*0' — `.*0` reaches any later 0 on the
    #     line, so PreAuthType 2/15/16/17 all matched (TicketOptions, SIDs and
    #     Status 0x0 all carry zeroes).
    #   - 'encryption.*type.*(0x17|rc4)' — same field-name span as the kerberoast
    #     rule above; RC4 is listed in AccountAvailableKeys / DCAvailableKeys on
    #     nearly every 4768.
    #   - 'ticket.*options.*0x4' — TicketOptions is 0x40810010 on ordinary TGTs.
    # Net: 411 of 590 fired (70%) where 12 were real no-pre-auth TGTs.
    # The trailing '.' before u003c matches the single JSON escape between the
    # value and the closing tag (Name='PreAuthType'>0</Data) — anchoring
    # the close is what keeps PreAuthType 10/16/17 from matching on the leading 0.
    filter_stages:
      - ['PreAuthType..u003e0.u003c']

  detect_asrep_roasting_bulk:
    description: "Bulk AS-REP Roasting Spray Detection"
    mitre_id: "T1558.004"
    tactic: credential_access
    severity: high
    red_team_tool: asrep_roast
    event_ids: ["4768"]

  detect_silver_ticket:
    description: "Silver Ticket Detection (Kerberos service logon with no KDC-issued ticket)"
    mitre_id: "T1558.002"
    tactic: credential_access
    severity: critical
    red_team_tool: generate_silver_ticket
    event_ids: ["4624"]
    # A Silver Ticket is a TGS forged offline with the SERVICE account's key and
    # presented straight to that service, so the KDC never mints it and no 4769
    # exists anywhere. What the service host does log is an ordinary successful
    # Kerberos network logon: 4624 with LogonType 3 and AuthenticationPackageName
    # Kerberos (plus a 4672 when the forged PAC claims privileged groups).
    #
    # Stages 1 and 2 are that candidate shape, keyed on the fields exactly — the
    # '..u003e' matches the JSON-escaped `'>` between an EventData field name and
    # its value, and the trailing '.u003c' anchors the LogonType value so 3 does
    # not also match 30/13 (same escaping and anchoring as the AS-REP rule above).
    #
    # Those two stages ALONE match every legitimate SMB/LDAP/MSSQL/WinRM access in
    # the domain — thousands of events per day — so on their own this rule would
    # not detect a silver ticket, it would record T1558.002 on every run and
    # destroy blue precision. Stage 3 is what makes the rule honest: the only thing
    # that separates a forged service ticket from a legitimate one is proof the KDC
    # issued it, and that proof lives in TicketEncryptionType on the DC's 4769 — a
    # field no 4624 line carries, because by definition the DC never saw this
    # ticket. A single literal, so Loki takes the fast contains path and the stage
    # cannot widen the way an alternation could.
    #
    # This template therefore cannot fire, by construction. It is kept because the
    # blue write path refuses any MITRE ID no catalog template covers, and coverage
    # is an ID join that matches exact or parent/child but NEVER siblings — so
    # without this entry T1558.002 could not be recorded at all and red's
    # generate_silver_ticket would be a permanent "missed". The actual detection is
    # the cross-host correlation no line filter can express — a Kerberos network
    # logon on a service host with NO 4769 for that principal on any DC —
    # implemented in code in `ares-cli/src/orchestrator/blue/sweep.rs`, which is
    # what records T1558.002. Do not "fix" this rule by dropping stage 3; see
    # detect_golden_ticket for the same structure on the TGT side.
    filter_stages:
      - ['LogonType..u003e3.u003c']
      - ['AuthenticationPackageName..u003eKerberos']
      - ['TicketEncryptionType']

  detect_brute_force:
    description: "Brute Force / Password Spray Detection"
    aliases: [detect_password_spray]
    mitre_id: "T1110"
    tactic: credential_access
    severity: medium
    host_as_filter: false
    # Event 4625 = failed logon, 4771 = pre-auth failed.
    # Single-stage OR is sufficient — event IDs already narrow to failures.
    event_ids: ["4625", "4771"]
    patterns:
      - 'failed'
      - 'failure'
      - 'logon'
      - 'pre.?auth'
      - 'denied'
      - 'invalid'

  detect_s4u_delegation:
    description: "S4U Constrained Delegation Abuse Detection"
    mitre_id: "T1550.003"
    tactic: privilege_escalation
    severity: critical
    connection_types: [constrained_delegation]
    red_team_tool: get_st
    auto_pivot: true
    event_ids: ["4769"]
    # A 4769 with a POPULATED TransmittedServices field IS S4U2Proxy (constrained
    # delegation / RBCD in use) — that single stage is the detection. Do NOT add a
    # service-class stage (cifs/|ldap/|host/|http/|mssql/|krbtgt): in the real 4769
    # log shape `ServiceName` is the target account SAM name (e.g. DC01$), not
    # a class/host SPN, so that filter matched ~1% of true S4U events (measured live:
    # 163 populated-TransmittedServices events → 2) and blackholed the whole rule.
    filter_stages:
      - ['TransmittedServices']
    # Drop 4769 events where TransmittedServices is empty (not actually S4U).
    # The value must be matched in the JSON-escaped XML shape Loki stores, the
    # same convention as PreAuthType above: a plain-text `TransmittedServices:
    # -` form matches nothing, so the exclude silently passed every 4769 through
    # and the rule fired on all of them (measured: 3824 events in, 3824 out).
    # Do NOT exclude machine-account targets: S4U2Proxy / RBCD abuse legitimately
    # requests a host's SPN (e.g. cifs/WEB01$), so a `TargetUserName…$` exclude
    # drops exactly the true positives this rule exists to catch.
    exclude_patterns:
      - 'TransmittedServices..u003e-.u003c'

  detect_lsa_secrets_access:
    description: "LSA Secrets Extraction Detection"
    mitre_id: "T1003.004"
    tactic: credential_access
    severity: high
    red_team_tool: secretsdump
    event_ids: ["4656", "4663", "4658"]
    patterns:
      - 'security.policy.secrets'
      - 'lsa.secrets'
      - 'dpapi'
      - 'defaultpassword'
      - 'nlkm'
      - 'cachedlogon'
      - 'lsadump'
      - 'reg.query.*security'

  detect_unsecured_credentials:
    description: "Unsecured Credential Discovery (GPP / SYSVOL scripts / autologon)"
    aliases: [detect_gpp_password, detect_credentials_in_files]
    mitre_id: "T1552"
    tactic: credential_access
    severity: high
    red_team_tool: gpp_password_finder
    # Scoped by event id first, then by the credential-bearing artifact itself.
    # The original rule had neither: without `event_ids` the label selector was
    # the only pre-filter, and both stages were effectively unconditional
    # ('object.*access' plus bare '\.ps1'/'sysvol'), so it matched 796,922 of
    # 2,409,887 windows-security lines in 24h — a third of the log. T1552 was
    # therefore always "detected", fabricating coverage rather than losing it,
    # and it saturated DETECTION_ENTRY_LIMIT so event_count meant nothing.
    # Bare path words (sysvol/netlogon) and script extensions are deliberately
    # NOT here: touching a share is not credential discovery. The artifact names
    # are what make this T1552 rather than generic file access.
    event_ids: ["5145", "4663", "4656"]
    filter_stages:
      - ['groups\.xml', 'scheduledtasks\.xml', 'services\.xml', 'datasources\.xml', 'drives\.xml', 'printers\.xml', 'cpassword', 'unattend\.xml', 'sysprep\.inf', 'defaultpassword', 'autologon', 'credman']

  detect_ntlm_relay:
    description: "NTLM Relay Attack Detection"
    mitre_id: "T1557"
    tactic: credential_access
    severity: high
    connection_types: [ntlm_relay]
    red_team_tool: ntlmrelayx
    filter_stages:
      - ['ntlm', 'relay', 'responder', 'inveigh']
      - ['ntlmrelayx', 'smbrelay', 'signing.*not.*required', 'coerce']

  detect_certificate_authentication:
    description: "Certificate-Based Authentication Detection"
    mitre_id: "T1649"
    tactic: credential_access
    severity: high
    red_team_tool: certipy_auth
    filter_stages:
      - ['pkinit', 'pkca', 'smartcard', 'certificate.*auth']
      - ['4768', 'tgt.*request', 'kerberos', 'certipy.*auth']

  # ─── Lateral Movement (TA0008) ─────────────────────────────────────────────

  detect_nopac_samaccountname_spoof:
    description: "NoPac sAMAccountName Spoofing Detection (CVE-2021-42278/42287)"
    mitre_id: "T1210"
    tactic: lateral_movement
    severity: critical
    red_team_tool: nopac
    auto_pivot: true
    event_ids: ["4781", "5136"]
    filter_stages:
      - ['samaccountname', 'sam.account.name', 'oldtargetusername', 'newtargetusername']

  detect_pass_the_hash:
    description: "Pass-the-Hash Detection"
    mitre_id: "T1550.002"
    tactic: lateral_movement
    severity: high
    connection_types: [smb]
    red_team_tool: domain_admin_checker
    auto_pivot: true
    event_ids: ["4624"]
    patterns:
      - 'ntlm'
      - 'ntlmssp'
      - 'pass.the.hash'
      - 'logon.type.3'
      - 'network.logon'
      - 'crackmapexec'
      - 'netexec'

  detect_valid_account_reuse:
    description: "Valid Account Reuse Detection (explicit / alternate credentials)"
    mitre_id: "T1078.002"
    tactic: defense_evasion
    severity: high
    red_team_tool: domain_admin_checker
    event_ids: ["4648"]
    # Event 4648 = "a logon was attempted using explicit credentials" (runas
    # /netonly, alternate creds, tooling that supplies creds directly). That is
    # the on-wire shape of stolen-credential reuse, distinct from an interactive
    # logon. TargetServerName/TargetInfo are 4648-specific EventData fields, so
    # they reliably narrow to genuine 4648 records regardless of message rendering.
    patterns:
      - 'TargetServerName'
      - 'TargetInfo'
      - 'explicit.credential'
      - 'runas'
    # Exclude machine-account targets (ending $) — routine computer/service auth,
    # not valid-account reuse. Mirrors the DCSync exclude's Loki-escaped form.
    exclude_patterns:
      - "TargetUserName'.u003e[A-Z0-9_-]+[$]"

  detect_lateral_movement:
    description: "Lateral Movement Detection (PSExec/WMI/WinRM)"
    mitre_id: "T1021"
    tactic: lateral_movement
    severity: high
    connection_types: [smb, psexec, winrm]
    auto_pivot: true
    event_ids: ["7045", "4648"]
    patterns:
      - 'psexec'
      - 'wmic'
      - 'winrm'
      - 'powershell.-session'
      - 'admin\$'
      - 'c\$'
      - 'ipc\$'
      - 'service.install'
      - 'remote.execution'

  detect_smb_file_access:
    description: "Suspicious SMB File Access Detection"
    mitre_id: "T1039"
    tactic: collection
    severity: medium
    connection_types: [smb]
    red_team_tool: download_file_content
    filter_stages:
      - ['5145', 'file.*access', 'share.*access', 'smbclient']
      - ['\.ps1', '\.bat', '\.cmd', '\.xml', '\.config', 'sysvol', 'netlogon', 'groups\.xml']

  # ─── Privilege Escalation (TA0004) ─────────────────────────────────────────

  detect_adcs_exploitation:
    description: "ADCS Certificate Abuse Detection (ESC1-ESC15)"
    aliases: [detect_certificate_abuse]
    mitre_id: "T1649"
    tactic: privilege_escalation
    severity: high
    red_team_tool: "certipy_*"
    # Stage 2 adds the dangerous-EKU OIDs from Grafana adcs-alerts so ESC2/ESC3
    # enrollments are caught even without ESC keyword / SAN strings:
    #   2.5.29.37.0            = Any Purpose EKU (ESC2)
    #   1.3.6.1.4.1.311.20.2.1 = Certificate Request Agent (ESC3)
    #   1.3.6.1.4.1.311.76.6.1 = SubCA
    filter_stages:
      - ['4886', '4887', '4876', 'certipy', 'certificate.*request']
      - ['esc[0-9]', 'enrollee.*supplies.*subject', 'altname', 'upn',
         '2\.5\.29\.37\.0', '1\.3\.6\.1\.4\.1\.311\.20\.2\.1',
         '1\.3\.6\.1\.4\.1\.311\.76\.6\.1', 'certificate.request.agent', 'any.?purpose']

  detect_delegation_abuse:
    description: "Kerberos Delegation Abuse Detection (RBCD)"
    mitre_id: "T1098"
    tactic: privilege_escalation
    severity: critical
    connection_types: [constrained_delegation]
    red_team_tool: rbcd_write
    auto_pivot: true
    # RBCD: Event 5136 = attribute modification on AD objects
    event_ids: ["5136"]
    patterns:
      - 'msDS-AllowedToActOnBehalfOfOtherIdentity'
      - 'msds-allowedtoactonbehalf'
      - 'rbcd'

  detect_bloodhound:
    description: "BloodHound/SharpHound Collection Detection"
    aliases: [detect_bloodhound_collection]
    mitre_id: "T1087"
    tactic: discovery
    severity: medium
    red_team_tool: run_bloodhound
    filter_stages:
      - ['bloodhound', 'sharphound', 'adexplorer', 'ldap.*query']
      - ['acl', 'objectsid', 'memberof', 'primarygroup', 'msds']

  # ─── Persistence (TA0003) ──────────────────────────────────────────────────

  detect_golden_ticket:
    description: "Golden Ticket Detection (RC4 service ticket for DC SPNs)"
    mitre_id: "T1558.001"
    tactic: persistence
    severity: critical
    red_team_tool: generate_golden_ticket
    event_ids: ["4769"]
    # Golden Tickets are forged offline — no 4768 (TGT request) is emitted, so the
    # old tool-string patterns ('golden ticket', 'ticketer') never appear in
    # Windows Security logs and never fired. USING the ticket, however, still emits
    # a 4769 service-ticket request. An RC4 (0x17) service ticket in an AES domain is
    # the encryption-downgrade signal. Ported from Grafana `ad_golden_ticket_detection`.
    #
    # Stage 1 keys on the ACTUAL ticket encryption type, not a bare '0x17'/'rc4'.
    # Verified live vs Loki: bare 'rc4' matches ~90% of all 4769 (RC4 sits in the
    # capability-enumeration fields ServiceSupportedEncryptionTypes /
    # ClientAdvertizedEncryptionTypes on nearly every event), and bare '0x17' still
    # matches AES tickets because SessionKeyEncryptionType is 0x17 almost always. Only
    # the TicketEncryptionType field distinguishes a real RC4 ticket. The '..' matches
    # the JSON-escaped `'>` between the field name and value (Loki stores XML > as
    # > — same escaping trick as the DCSync exclude).
    #
    # Stage 2 (DC service class) currently zeroes recall: in the real 4769 log shape
    # ServiceName is a SAM name (e.g. SQL01$, svc_sql), never a cifs//ldap//host/ SPN,
    # so this stage blackholes every real RC4 ticket — the same failure that killed the
    # S4U rule. Kept because dropping it makes this fire on ALL RC4 downgrades, which is
    # kerberoasting (T1558.003), not uniquely golden — a single-line 4769 rule genuinely
    # can't separate the two.
    #
    # This template therefore cannot fire, by construction, and is kept only so the
    # catalog still carries the T1558.001 mapping and the LLM prompts that name it keep
    # resolving. The actual detection is the cross-event correlation it can't express —
    # 4769 with NO preceding 4768 — implemented in code in the blue orchestrator's
    # baseline sweep (`ares-cli/src/orchestrator/blue/sweep.rs`), which is what records
    # T1558.001. Do not try to "fix" this rule with another filter stage; absence of a
    # partner event is not expressible as a line filter.
    filter_stages:
      - ['TicketEncryptionType..u003e0x17']
      - ['cifs/', 'ldap/', 'host/', 'krbtgt']

  # ─── Execution (TA0002) ────────────────────────────────────────────────────

  detect_suspicious_execution:
    description: "Suspicious Command Execution Detection"
    mitre_id: "T1059"
    tactic: execution
    severity: medium
    filter_stages:
      - ['4688', 'powershell', 'pwsh', 'cmd\.exe', 'wscript', 'cscript']
      - ['encodedcommand', 'bypass', 'hidden', 'downloadstring', 'invoke']

  detect_service_creation:
    description: "Suspicious Service Creation Detection"
    mitre_id: "T1543.003"
    tactic: execution
    severity: high
    connection_types: [psexec]
    red_team_tool: psexec
    auto_pivot: true
    event_ids: ["7045"]
    patterns:
      - 'PSEXE'
      - 'BTOBTO'
      - 'cmd\.exe'
      - 'powershell'
      - 'remcom'

  detect_scheduled_task:
    description: "Suspicious Scheduled Task Detection"
    mitre_id: "T1053.005"
