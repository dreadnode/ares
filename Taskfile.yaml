  ares:red:multi:current:
    desc: "Print current multi-agent operation ID (prefer running, fallback to latest)"
    silent: true
    vars:
      K8S_NAMESPACE: '{{.K8S_NAMESPACE | default "attack-simulation"}}'
    cmds:
      - |
        REDIS_PASS=$(kubectl get secret redis-secret -n {{.K8S_NAMESPACE}} -o jsonpath='{.data.password}' 2>/dev/null | base64 -d || echo "")
        if [ -n "$REDIS_PASS" ]; then
          REDIS_URL="redis://:${REDIS_PASS}@redis:6379"
        else
          REDIS_URL="redis://redis:6379"
        fi

        kubectl exec -n {{.K8S_NAMESPACE}} deploy/ares-orchestrator -- python -c "
        import asyncio
        from datetime import datetime

        import redis.asyncio as redis

        from ares.core.task_queue import RedisTaskQueue

        def _pick_latest(items):
            with_time = [item for item in items if item[0] is not None]
            if with_time:
                with_time.sort(key=lambda item: item[0], reverse=True)
                return with_time[0][1]
            items.sort(key=lambda item: item[1])
            return items[0][1]

        async def main():
            client = redis.from_url('$REDIS_URL', decode_responses=True)
            await client.ping()

            running = []
            async for key in client.scan_iter(f\"{RedisTaskQueue.LOCK_PREFIX}:*\"):
                parts = key.split(':', 2)
                if len(parts) < 3:
                    continue
                op_id = parts[2]
                checkpoint_key = f'ares:operation:{op_id}:checkpoint_time'
                checkpoint = await client.get(checkpoint_key)
                checkpoint_time = None
                if checkpoint:
                    try:
                        checkpoint_time = datetime.fromisoformat(checkpoint)
                    except Exception:
                        checkpoint_time = None
                running.append((checkpoint_time, op_id))

            if running:
                print(_pick_latest(running))
                return

            operations = []
            async for key in client.scan_iter('ares:operation:*:state'):
                parts = key.split(':')
                if len(parts) < 3:
                    continue
                op_id = parts[2]
                checkpoint_key = f'ares:operation:{op_id}:checkpoint_time'
                checkpoint = await client.get(checkpoint_key)
                checkpoint_time = None
                if checkpoint:
                    try:
                        checkpoint_time = datetime.fromisoformat(checkpoint)
                    except Exception:
                        checkpoint_time = None
                operations.append((checkpoint_time, op_id))

            if operations:
                print(_pick_latest(operations))
                return

            print('No operations found')

        asyncio.run(main())
        "

  ares:red:multi:queue:
    desc: "List multi-agent operations and state from the Redis queue"
    silent: true
    vars:
      K8S_NAMESPACE: '{{.K8S_NAMESPACE | default "attack-simulation"}}'
    cmds:
      - |
        REDIS_PASS=$(kubectl get secret redis-secret -n {{.K8S_NAMESPACE}} -o jsonpath='{.data.password}' 2>/dev/null | base64 -d || echo "")
        if [ -n "$REDIS_PASS" ]; then
          REDIS_URL="redis://:${REDIS_PASS}@redis:6379"
        else
          REDIS_URL="redis://redis:6379"
        fi

        kubectl exec -n {{.K8S_NAMESPACE}} deploy/ares-orchestrator -- python -c "
        import asyncio
        from collections import Counter

        import redis.asyncio as redis

        from ares.core.models import SharedRedTeamState
        from ares.core.task_queue import RedisTaskQueue

        async def main():
            client = redis.from_url('$REDIS_URL', decode_responses=False)
            await client.ping()

            operations = []
            async for key in client.scan_iter('ares:operation:*:state'):
                key_str = key.decode()
                parts = key_str.split(':')
                if len(parts) < 3:
                    continue
                op_id = parts[2]
                data = await client.get(key)
                if not data:
                    continue

                state = SharedRedTeamState.from_bytes(data)
                checkpoint_key = f'ares:operation:{op_id}:checkpoint_time'
                checkpoint = await client.get(checkpoint_key)
                checkpoint_time = checkpoint.decode() if checkpoint else 'unknown'
                lock_key = f'{RedisTaskQueue.LOCK_PREFIX}:{op_id}'
                is_running = await client.exists(lock_key) > 0
                status_counts = Counter(
                    task.status.value for task in state.pending_tasks.values()
                )

                operations.append(
                    {
                        'operation_id': op_id,
                        'checkpoint_time': checkpoint_time,
                        'running': is_running,
                        'pending_total': len(state.pending_tasks),
                        'completed_total': len(state.completed_tasks),
                        'status_counts': status_counts,
                        'has_domain_admin': state.has_domain_admin,
                        'vuln_total': len(state.discovered_vulnerabilities),
                        'exploited_total': len(state.exploited_vulnerabilities),
                    }
                )

            if not operations:
                print('No operations found')
                return

            print('📋 Multi-Agent Operations (Redis)')
            print('='*70)
            for op in sorted(operations, key=lambda item: item['operation_id']):
                running = 'running' if op['running'] else 'idle'
                status_counts = op['status_counts']
                print(
                    f\"  {op['operation_id']} [{running}] checkpoint: {op['checkpoint_time']}\"
                )
                print(
                    \"    pending: {pending_total} (pending {pending}, in_progress {in_progress}, retrying {retrying}) \"
                    \"completed: {completed_total}\".format(
                        pending_total=op['pending_total'],
                        pending=status_counts.get('pending', 0),
                        in_progress=status_counts.get('in_progress', 0),
                        retrying=status_counts.get('retrying', 0),
                        completed_total=op['completed_total'],
                    )
                )
                print(
                    \"    domain_admin: {da}  vulns: {vuln_total}  exploited: {exploited_total}\".format(
                        da='yes' if op['has_domain_admin'] else 'no',
                        vuln_total=op['vuln_total'],
                        exploited_total=op['exploited_total'],
                    )
                )

        asyncio.run(main())
        "

