---
# yaml-language-server: $schema=https://taskfile.dev/schema.json
version: "3"

includes:
  aws: "https://raw.githubusercontent.com/CowDogMoo/taskfile-templates/main/aws/Taskfile.yaml"
  github: "https://raw.githubusercontent.com/CowDogMoo/taskfile-templates/main/github/Taskfile.yaml"
  pre-commit: "https://raw.githubusercontent.com/CowDogMoo/taskfile-templates/main/pre-commit/Taskfile.yaml"
  renovate: "https://raw.githubusercontent.com/CowDogMoo/taskfile-templates/main/renovate/Taskfile.yaml"
  secrets: "https://raw.githubusercontent.com/CowDogMoo/taskfile-templates/main/secrets/Taskfile.yaml"  # pragma: allowlist secret
  remote:
    taskfile: .taskfiles/remote/Taskfile.yaml
    optional: true

vars:
  API_DIR: "."
  # Ares configuration
  MODEL: '{{.MODEL | default "claude-sonnet-4-20250514"}}'
  GRAFANA_URL: '{{.GRAFANA_URL | default "https://grafana.dev.plundr.ai"}}'
  POLL_INTERVAL: '{{.POLL_INTERVAL | default "30"}}'
  MAX_STEPS_BLUE: '{{.MAX_STEPS_BLUE | default "50"}}'
  MAX_STEPS_BLUE_ONCE: '{{.MAX_STEPS_BLUE_ONCE | default "15"}}'  # ~15 min max for once mode
  MAX_STEPS_RED: '{{.MAX_STEPS_RED | default "150"}}'
  REPORT_DIR: '{{.REPORT_DIR | default "./reports"}}'
  LOG_DIR: '{{.LOG_DIR | default "./logs"}}'
  DREADNODE_SERVER: '{{.DREADNODE_SERVER | default "https://platform.dev.plundr.ai/"}}'
  DREADNODE_ORGANIZATION: '{{.DREADNODE_ORGANIZATION | default "ares"}}'
  DREADNODE_WORKSPACE: '{{.DREADNODE_WORKSPACE | default "ares-protocol"}}'
  DREADNODE_PROJECT: '{{.DREADNODE_PROJECT | default "ares-soc"}}'

tasks:
  default:
    desc: List all available tasks
    cmds:
      - task --list --sort none

  # Setup and initialization tasks
  check-command:
    internal: true
    vars:
      COMMAND: '{{.CLI_ARGS}}'
    cmds:
      - |
        command -v {{.COMMAND}} >/dev/null 2>&1 || (echo "Command '{{.COMMAND}}' not found. Please install it." && exit 1)

  check-dependencies:
    internal: true
    cmds:
      - task: check-command
        vars: { COMMAND: docker }
      - task: check-command
        vars: { COMMAND: python3 }
      - task: check-command
        vars: { COMMAND: ruby }

  setup-env:
    internal: true
    cmds:
      - cp -n .env.example .env || true

  get-dotenv-value:
    internal: true
    vars:
      KEY: '{{.CLI_ARGS}}'
    cmds:
      - grep '^{{.KEY}}=' .env | sed 's/^{{.KEY}}=//;s/^"//;s/"$//'

  deactivate:
    internal: true
    cmds:
      - |
        if [ -n "${VIRTUAL_ENV:-}" ]; then
          echo "Deactivated venv - try again."
          deactivate
        fi

  setup-git-hooks:
    desc: Set up Git hooks
    cmds:
      - |
        #!/bin/bash
        set -e
        ln -sf .hooks/post_merge.sh .git/hooks/post-merge
        chmod +x .git/hooks/post-merge
        echo "Post-merge git hooks successfully installed!"

  init:
    desc: Initialize the project
    deps: [check-dependencies]
    cmds:
      - task: setup-env
      - task: setup-git-hooks
      - poetry install
      - task: pre-commit:install
      - echo "Project is ready to go! 🚀"

  # Tools and pre-commit tasks
  run-pre-commit:
    desc: Run pre-commit hooks on all files
    cmds:
      - task: pre-commit:update-hooks
      - task: pre-commit:clear-cache
      - task: pre-commit:run-hooks

  clean:
    desc: Clean Python artifacts and cache directories
    cmds:
      - |
        find . -type d -name "__pycache__" -exec rm -rf {} + 2>/dev/null || true
        find . -type f -name "*.pyc" -delete
        find . -type f -name "*.pyo" -delete
        find . -type f -name "*.pyd" -delete
        rm -rf .coverage htmlcov/ .pytest_cache/ .mypy_cache/ build/ dist/ ./*.egg-info/

  # Poetry and API tasks
  poetry:
    desc: Run poetry in the API directory
    vars:
      ARGS: '{{.CLI_ARGS}}'
    cmds:
      - task: deactivate
      - cd {{.API_DIR}} && export PYTHONPATH="$(pwd)" && poetry {{.ARGS}}

  mypy:
    desc: Run type checking with mypy
    cmds:
      - task: poetry
        vars: { ARGS: "run mypy ." }

  ruff:
    desc: Run linting and formatting with ruff
    cmds:
      - task: poetry
        vars: { ARGS: "run ruff check ." }
      - task: poetry
        vars: { ARGS: "run ruff format ." }

  pytest:
    desc: Run tests with pytest and coverage reporting
    vars:
      ARGS: '{{default "--cov=. --cov-report=term-missing tests/" .CLI_ARGS}}'
    cmds:
      - task: poetry
        vars: { ARGS: "run pytest {{.ARGS}}" }

  # GitHub tasks
  create-release:
    desc: Create a release on GitHub
    cmds:
      - task: github:create-release

  # ===========================================================================
  # Ares Blue Team (SOC) Agent Tasks
  # ===========================================================================

  ares:blue:
    desc: Run blue team agent in poll mode (uses 1Password for API keys)
    deps:
      - task: check-aws-auth
        vars:
          PROFILE: '{{.PROFILE | default "infrastructure"}}'
          REGION: '{{.REGION | default "us-west-1"}}'
    cmds:
      - |
        export DREADNODE_API_KEY=$(op item get "Dreadnode Dev Platform" --fields api-key --reveal)
        export GRAFANA_SERVICE_ACCOUNT_TOKEN=$(op item get "Ares Grafana MCP" --fields grafana-token --reveal 2>/dev/null || echo "")
        export ANTHROPIC_API_KEY=$(op item get "claude.ai" --fields dreadnode-api-key --reveal 2>/dev/null || echo "")

        mkdir -p {{.LOG_DIR}}
        LOGFILE="{{.LOG_DIR}}/blue-$(date +%Y%m%d-%H%M%S).log"
        echo "📝 Logging to: $LOGFILE"

        uv run python -m ares \
          --args.model {{.MODEL}} \
          --args.grafana-url {{.GRAFANA_URL}} \
          --args.poll-interval {{.POLL_INTERVAL}} \
          --args.max-steps {{.MAX_STEPS_BLUE}} \
          --args.report-dir {{.REPORT_DIR}} \
          --dn-args.server {{.DREADNODE_SERVER}} \
          --dn-args.token "$DREADNODE_API_KEY" \
          --dn-args.organization {{.DREADNODE_ORGANIZATION}} \
          --dn-args.workspace {{.DREADNODE_WORKSPACE}} \
          --dn-args.project {{.DREADNODE_PROJECT}} \
          2>&1 | tee -a "$LOGFILE"

  ares:blue:once:
    desc: Run blue team agent once and exit (uses 1Password for API keys)
    deps:
      - task: check-aws-auth
        vars:
          PROFILE: '{{.PROFILE | default "infrastructure"}}'
          REGION: '{{.REGION | default "us-west-1"}}'
    cmds:
      - |
        export DREADNODE_API_KEY=$(op item get "Dreadnode Dev Platform" --fields api-key --reveal)
        export GRAFANA_SERVICE_ACCOUNT_TOKEN=$(op item get "Ares Grafana MCP" --fields grafana-token --reveal 2>/dev/null || echo "")
        export ANTHROPIC_API_KEY=$(op item get "claude.ai" --fields dreadnode-api-key --reveal 2>/dev/null || echo "")

        mkdir -p {{.LOG_DIR}}
        LOGFILE="{{.LOG_DIR}}/blue-$(date +%Y%m%d-%H%M%S).log"
        echo "📝 Logging to: $LOGFILE"

        uv run python -m ares \
          --args.model {{.MODEL}} \
          --args.grafana-url {{.GRAFANA_URL}} \
          --args.poll-interval {{.POLL_INTERVAL}} \
          --args.max-steps {{.MAX_STEPS_BLUE_ONCE}} \
          --args.report-dir {{.REPORT_DIR}} \
          --args.once \
          --dn-args.server {{.DREADNODE_SERVER}} \
          --dn-args.token "$DREADNODE_API_KEY" \
          --dn-args.organization {{.DREADNODE_ORGANIZATION}} \
          --dn-args.workspace {{.DREADNODE_WORKSPACE}} \
          --dn-args.project {{.DREADNODE_PROJECT}} \
          2>&1 | tee -a "$LOGFILE"

  ares:blue:local:
    desc: Run blue team agent using .env file (no 1Password)
    deps:
      - task: check-aws-auth
        vars:
          PROFILE: '{{.PROFILE | default "infrastructure"}}'
          REGION: '{{.REGION | default "us-west-1"}}'
    cmds:
      - |
        if [ ! -f .env ]; then
          echo "Error: .env file not found"
          exit 1
        fi

        set -a
        . ./.env
        set +a

        mkdir -p {{.LOG_DIR}}
        LOGFILE="{{.LOG_DIR}}/blue-$(date +%Y%m%d-%H%M%S).log"
        echo "📝 Logging to: $LOGFILE"

        uv run python -m ares \
          --args.model {{.MODEL}} \
          --args.grafana-url {{.GRAFANA_URL}} \
          --args.poll-interval {{.POLL_INTERVAL}} \
          --args.max-steps {{.MAX_STEPS_BLUE}} \
          --args.report-dir {{.REPORT_DIR}} \
          --dn-args.server {{.DREADNODE_SERVER}} \
          --dn-args.organization {{.DREADNODE_ORGANIZATION}} \
          --dn-args.workspace {{.DREADNODE_WORKSPACE}} \
          --dn-args.project {{.DREADNODE_PROJECT}} \
          2>&1 | tee -a "$LOGFILE"

  ares:blue:local:once:
    desc: Run blue team agent once and exit using .env file (no 1Password)
    deps:
      - task: check-aws-auth
        vars:
          PROFILE: '{{.PROFILE | default "infrastructure"}}'
          REGION: '{{.REGION | default "us-west-1"}}'
    cmds:
      - |
        if [ ! -f .env ]; then
          echo "Error: .env file not found"
          exit 1
        fi

        set -a
        . ./.env
        set +a

        mkdir -p {{.LOG_DIR}}
        LOGFILE="{{.LOG_DIR}}/blue-$(date +%Y%m%d-%H%M%S).log"
        echo "📝 Logging to: $LOGFILE"

        uv run python -m ares \
          --args.model {{.MODEL}} \
          --args.grafana-url {{.GRAFANA_URL}} \
          --args.poll-interval {{.POLL_INTERVAL}} \
          --args.max-steps {{.MAX_STEPS_BLUE_ONCE}} \
          --args.report-dir {{.REPORT_DIR}} \
          --args.once \
          --dn-args.server {{.DREADNODE_SERVER}} \
          --dn-args.organization {{.DREADNODE_ORGANIZATION}} \
          --dn-args.workspace {{.DREADNODE_WORKSPACE}} \
          --dn-args.project {{.DREADNODE_PROJECT}} \
          2>&1 | tee -a "$LOGFILE"

  ares:investigate:
    desc: "Investigate a specific alert from JSON file (usage: task ares:investigate ALERT=alert.json)"
    vars:
      ALERT: '{{.ALERT | default ""}}'
    preconditions:
      - sh: test -n "{{.ALERT}}"
        msg: "ALERT variable is required. Usage: task ares:investigate ALERT=alert.json"
      - sh: test -f "{{.ALERT}}"
        msg: "Alert file not found: {{.ALERT}}"
    deps:
      - task: check-aws-auth
        vars:
          PROFILE: '{{.PROFILE | default "infrastructure"}}'
          REGION: '{{.REGION | default "us-west-1"}}'
    cmds:
      - |
        export DREADNODE_API_KEY=$(op item get "Dreadnode Dev Platform" --fields api-key --reveal)
        export GRAFANA_SERVICE_ACCOUNT_TOKEN=$(op item get "Ares Grafana MCP" --fields grafana-token --reveal 2>/dev/null || echo "")
        export ANTHROPIC_API_KEY=$(op item get "claude.ai" --fields dreadnode-api-key --reveal 2>/dev/null || echo "")

        uv run python -m ares investigate-alert {{.ALERT}} \
          --args.model {{.MODEL}} \
          --args.grafana-url {{.GRAFANA_URL}} \
          --args.max-steps {{.MAX_STEPS_BLUE_ONCE}} \
          --args.report-dir {{.REPORT_DIR}} \
          --dn-args.server {{.DREADNODE_SERVER}} \
          --dn-args.token "$DREADNODE_API_KEY" \
          --dn-args.organization {{.DREADNODE_ORGANIZATION}} \
          --dn-args.workspace {{.DREADNODE_WORKSPACE}} \
          --dn-args.project {{.DREADNODE_PROJECT}}

  ares:config:check:
    desc: Check configuration and API key access
    cmds:
      - |
        echo "Checking Ares configuration..."
        echo ""
        echo "Environment:"
        echo "  Python: $(python --version)"
        echo "  uv: $(uv --version 2>/dev/null || echo 'not installed')"
        echo ""
        echo "Configuration:"
        echo "  Platform: {{.DREADNODE_SERVER}}"
        echo "  Project: {{.DREADNODE_PROJECT}}"
        echo "  Model: {{.MODEL}}"
        echo "  Grafana: {{.GRAFANA_URL}}"
        echo "  Loki: {{.LOKI_URL}}"
        echo "  Prometheus: {{.PROMETHEUS_URL}}"
        echo ""
        echo "Checking 1Password CLI access..."

        # Check if op is installed
        if ! command -v op >/dev/null 2>&1; then
          echo "  ❌ 1Password CLI (op) not installed"
          echo ""
          echo "Install from: https://developer.1password.com/docs/cli/get-started/"
          exit 1
        fi

        echo "  ✅ 1Password CLI installed: $(op --version)"
        echo ""
        echo "Checking 1Password items..."

        # Check Dreadnode API key
        if op item get "Dreadnode Dev Platform" --fields api-key --reveal >/dev/null 2>&1; then
          echo "  ✅ Dreadnode API key accessible"
        else
          echo "  ❌ Dreadnode API key not found in 1Password"
          echo "     Item: 'Dreadnode Dev Platform'"
          echo "     Field: 'api-key'"
        fi

        # Check Grafana API key
        if op item get "Ares Grafana MCP" --fields grafana-token --reveal >/dev/null 2>&1; then
          echo "  ✅ Grafana API key accessible"
        else
          echo "  ⚠️  Grafana API key not found in 1Password"
          echo "     Item: 'Ares Grafana MCP'"
          echo "     Field: 'grafana-token'"
        fi

        # Check Anthropic API key
        if op item get "claude.ai" --fields dreadnode-api-key --reveal >/dev/null 2>&1; then
          echo "  ✅ Anthropic API key accessible"
        else
          echo "  ⚠️  Anthropic API key not found in 1Password"
          echo "     Item: 'claude.ai'"
          echo "     Field: 'dreadnode-api-key'"
        fi

        echo ""
        echo "Configuration check complete"

  ares:config:show:
    desc: Show current configuration (without secrets)
    cmds:
      - |
        echo "Ares Configuration:"
        echo "===================="
        echo "Platform Settings:"
        echo "  Server: {{.DREADNODE_SERVER}}"
        echo "  Project: {{.DREADNODE_PROJECT}}"
        echo ""
        echo "Agent Settings:"
        echo "  Model: {{.MODEL}}"
        echo "  Max Steps (Blue): {{.MAX_STEPS_BLUE}}"
        echo "  Max Steps (Blue Once): {{.MAX_STEPS_BLUE_ONCE}}"
        echo "  Max Steps (Red): {{.MAX_STEPS_RED}}"
        echo "  Poll Interval: {{.POLL_INTERVAL}}s"
        echo ""
        echo "Data Sources:"
        echo "  Grafana: {{.GRAFANA_URL}}"
        echo "  Query Method: Grafana MCP (requires mcp-grafana binary)"
        echo ""
        echo "Output:"
        echo "  Reports: {{.REPORT_DIR}}"

  ares:reports:list:
    desc: List all investigation reports
    cmds:
      - |
        echo "Investigation Reports:"
        echo "======================"
        if [ -d {{.REPORT_DIR}} ]; then
          ls -lht {{.REPORT_DIR}}/*.md 2>/dev/null || echo "No reports found"
        else
          echo "Report directory not found: {{.REPORT_DIR}}"
        fi

  ares:reports:latest:
    desc: Show the latest investigation report
    cmds:
      - |
        LATEST=$(ls -t {{.REPORT_DIR}}/*.md 2>/dev/null | head -1)
        if [ -n "$LATEST" ]; then
          echo "Latest report: $LATEST"
          echo "===================="
          cat "$LATEST"
        else
          echo "No reports found in {{.REPORT_DIR}}"
        fi

  ares:reports:clean:
    desc: Remove all investigation reports
    cmds:
      - |
        read -p "Delete all reports in {{.REPORT_DIR}}? (y/N) " -n 1 -r
        echo
        if [[ $REPLY =~ ^[Yy]$ ]]; then
          rm -rf {{.REPORT_DIR}}/*.md
          echo "✅ Reports cleaned"
        fi

  # ===========================================================================
  # Ares Local Log Management
  # ===========================================================================

  ares:logs:list:
    desc: List all local agent logs
    cmds:
      - |
        echo "Agent Logs:"
        echo "==========="
        if [ -d {{.LOG_DIR}} ]; then
          ls -lht {{.LOG_DIR}}/*.log 2>/dev/null || echo "No logs found"
        else
          echo "Log directory not found: {{.LOG_DIR}}"
        fi

  ares:logs:tail:
    desc: "Tail the latest log file (usage: task ares:logs:tail [LINES=100] [FOLLOW=true])"
    vars:
      LINES: '{{.LINES | default "100"}}'
      FOLLOW: '{{.FOLLOW | default "false"}}'
    cmds:
      - |
        LATEST=$(ls -t {{.LOG_DIR}}/*.log 2>/dev/null | head -1)
        if [ -z "$LATEST" ]; then
          echo "No logs found in {{.LOG_DIR}}"
          exit 1
        fi

        echo "📋 Log file: $LATEST"
        echo "======================================================================"

        if [ "{{.FOLLOW}}" = "true" ]; then
          tail -f "$LATEST"
        else
          tail -n {{.LINES}} "$LATEST"
        fi

  ares:logs:blue:
    desc: "Tail the latest blue team log (usage: task ares:logs:blue [LINES=100] [FOLLOW=true])"
    vars:
      LINES: '{{.LINES | default "100"}}'
      FOLLOW: '{{.FOLLOW | default "false"}}'
    cmds:
      - |
        LATEST=$(ls -t {{.LOG_DIR}}/blue-*.log 2>/dev/null | head -1)
        if [ -z "$LATEST" ]; then
          echo "No blue team logs found in {{.LOG_DIR}}"
          exit 1
        fi

        echo "📋 Blue team log: $LATEST"
        echo "======================================================================"

        if [ "{{.FOLLOW}}" = "true" ]; then
          tail -f "$LATEST"
        else
          tail -n {{.LINES}} "$LATEST"
        fi

  ares:logs:red:
    desc: "Tail the latest red team log (usage: task ares:logs:red [LINES=100] [FOLLOW=true])"
    vars:
      LINES: '{{.LINES | default "100"}}'
      FOLLOW: '{{.FOLLOW | default "false"}}'
    cmds:
      - |
        LATEST=$(ls -t {{.LOG_DIR}}/red-*.log 2>/dev/null | head -1)
        if [ -z "$LATEST" ]; then
          echo "No red team logs found in {{.LOG_DIR}}"
          exit 1
        fi

        echo "📋 Red team log: $LATEST"
        echo "======================================================================"

        if [ "{{.FOLLOW}}" = "true" ]; then
          tail -f "$LATEST"
        else
          tail -n {{.LINES}} "$LATEST"
        fi

  ares:logs:clean:
    desc: Remove all local agent logs
    cmds:
      - |
        read -p "Delete all logs in {{.LOG_DIR}}? (y/N) " -n 1 -r
        echo
        if [[ $REPLY =~ ^[Yy]$ ]]; then
          rm -rf {{.LOG_DIR}}/*.log
          echo "✅ Logs cleaned"
        fi

  ares:version:
    desc: Show Ares version information
    cmds:
      - uv run python -c "import ares; print('Ares version:', ares.__version__)"

  ares:mitre:test:
    desc: Test MITRE ATT&CK data loading
    cmds:
      - |
        uv run python -c "
        import asyncio
        from ares.integrations.mitre import MITREAttackClient

        async def test():
            client = MITREAttackClient()
            await client.load()
            print(f'✅ Loaded {len(client._techniques)} techniques')
            print(f'✅ Loaded {len(client._tactics)} tactics')

            # Show a sample technique
            sample = list(client._techniques.values())[0]
            print(f'\nSample technique:')
            print(f'  ID: {sample.id}')
            print(f'  Name: {sample.name}')
            print(f'  Tactic: {sample.tactic}')

        asyncio.run(test())
        "

  ares:example:grafana-windows:
    desc: Show example Grafana MCP queries for Windows attack detection
    cmds:
      - python examples/grafana_mcp_windows_example.py

  # ===========================================================================
  # Ares Red Team Agent Tasks
  # ===========================================================================

  check-aws-auth:
    internal: true
    vars:
      PROFILE: '{{.PROFILE | default "lab"}}'
      REGION: '{{.REGION | default "us-west-1"}}'
    cmds:
      - |
        # Check if AWS CLI is installed
        if ! command -v aws >/dev/null 2>&1; then
          echo "❌ Error: AWS CLI is not installed"
          echo ""
          echo "The red team orchestration tasks require AWS CLI to access the infrastructure account."
          echo "Install it from: https://docs.aws.amazon.com/cli/latest/userguide/getting-started-install.html"
          exit 1
        fi

        # Check if credentials are configured and valid for the profile
        if ! aws sts get-caller-identity --profile "{{.PROFILE}}" --region "{{.REGION}}" >/dev/null 2>&1; then
          echo "❌ Error: AWS authentication failed for profile '{{.PROFILE}}'"
          echo ""
          echo "You need to authenticate to the infrastructure account before running this task."
          echo ""
          echo "Troubleshooting:"
          echo "  1. Verify your AWS credentials are configured: aws configure --profile {{.PROFILE}}"
          echo "  2. If using SSO, authenticate: aws sso login --profile {{.PROFILE}}"
          echo "  3. Check your profile exists: aws configure list --profile {{.PROFILE}}"
          echo "  4. Verify your credentials are not expired"
          exit 1
        fi

        # Success - show caller identity
        echo "✅ AWS authentication verified"
        aws sts get-caller-identity --profile "{{.PROFILE}}" --region "{{.REGION}}" --output table

  ares:red:
    desc: "Run red team agent against a target (usage: task ares:red TARGET=dreadgoad)"
    vars:
      TARGET: '{{.TARGET | default ""}}'
      PROFILE: '{{.PROFILE | default "lab"}}'
      REGION: '{{.REGION | default "us-west-1"}}'
      REDTEAM_PROJECT: '{{.REDTEAM_PROJECT | default "ares-redteam"}}'
    preconditions:
      - sh: test -n "{{.TARGET}}"
        msg: "TARGET variable is required. Usage: task ares:red TARGET=dreadgoad"
    cmds:
      - |
        export OPENAI_API_KEY=$(op item get "Openai" --fields dreadnode-api-key --reveal 2>/dev/null)
        export DREADNODE_API_KEY=$(op item get "Dreadnode Dev Platform" --fields api-key --reveal 2>/dev/null || echo "")
        export ANTHROPIC_API_KEY=$(op item get "claude.ai" --fields dreadnode-api-key --reveal 2>/dev/null || echo "")

        TARGET="{{.TARGET}}"

        # Check if TARGET is an IP address (simple regex check)
        if echo "$TARGET" | grep -qE '^[0-9]+\.[0-9]+\.[0-9]+\.[0-9]+$'; then
            echo "🎯 Using direct IP: $TARGET"
            RESOLVED_TARGET="$TARGET"
        else
            # Resolve TARGET via AWS EC2 Name tag filter
            echo "🔍 Resolving '$TARGET' via AWS EC2 Name tag filter..."

            RESOLVED_TARGET=$(aws ec2 describe-instances \
                --profile "{{.PROFILE}}" \
                --region "{{.REGION}}" \
                --filters "Name=instance-state-name,Values=running" \
                --query "Reservations[*].Instances[?contains(Tags[?Key==\`Name\`].Value|[0], \`$TARGET\`)].PrivateIpAddress" \
                --output text | tr '\t\n' ' ' | xargs)

            if [ -z "$RESOLVED_TARGET" ]; then
                echo "❌ No running EC2 instances found matching Name tag filter: $TARGET"
                exit 1
            fi

            TARGET_COUNT=$(echo "$RESOLVED_TARGET" | wc -w | xargs)
            echo "✅ Resolved $TARGET_COUNT target(s): $RESOLVED_TARGET"
        fi

        mkdir -p {{.LOG_DIR}}
        LOGFILE="{{.LOG_DIR}}/red-$(date +%Y%m%d-%H%M%S).log"
        echo "📝 Logging to: $LOGFILE"

        uv run python -m ares red-team "$RESOLVED_TARGET" \
          --args.model {{.MODEL}} \
          --args.max-steps {{.MAX_STEPS_RED}} \
          --args.report-dir {{.REPORT_DIR}} \
          --dn-args.server {{.DREADNODE_SERVER}} \
          --dn-args.token "$DREADNODE_API_KEY" \
          --dn-args.organization {{.DREADNODE_ORGANIZATION}} \
          --dn-args.workspace {{.DREADNODE_WORKSPACE}} \
          --dn-args.project {{.REDTEAM_PROJECT}} \
          2>&1 | tee -a "$LOGFILE"

  ares:red:local:
    desc: "Run red team agent using .env file (usage: task ares:red:local TARGET=192.168.1.100)"
    vars:
      TARGET: '{{.TARGET | default ""}}'
      REDTEAM_PROJECT: '{{.REDTEAM_PROJECT | default "ares-redteam"}}'
    preconditions:
      - sh: test -n "{{.TARGET}}"
        msg: "TARGET variable is required. Usage: task ares:red:local TARGET=192.168.1.100"
    cmds:
      - |
        if [ ! -f .env ]; then
          echo "Error: .env file not found"
          exit 1
        fi

        set -a
        . ./.env
        set +a

        mkdir -p {{.LOG_DIR}}
        LOGFILE="{{.LOG_DIR}}/red-$(date +%Y%m%d-%H%M%S).log"
        echo "📝 Logging to: $LOGFILE"

        uv run python -m ares red-team {{.TARGET}} \
          --args.model {{.MODEL}} \
          --args.max-steps {{.MAX_STEPS_RED}} \
          --args.report-dir {{.REPORT_DIR}} \
          --dn-args.server {{.DREADNODE_SERVER}} \
          --dn-args.organization {{.DREADNODE_ORGANIZATION}} \
          --dn-args.workspace {{.DREADNODE_WORKSPACE}} \
          --dn-args.project {{.REDTEAM_PROJECT}} \
          2>&1 | tee -a "$LOGFILE"

  # ===========================================================================
  # Ares Multi-Agent Red Team Tasks
  # ===========================================================================

  ares:red:multi:
    desc: "Run multi-agent red team operation (usage: task ares:red:multi TARGET=dreadgoad [DOMAIN=sevenkingdoms.local])"
    vars:
      TARGET: '{{.TARGET | default ""}}'
      DOMAIN: '{{.DOMAIN | default "sevenkingdoms.local"}}'
      OPERATION_ID: '{{.OPERATION_ID | default ""}}'
      RESUME: '{{.RESUME | default "false"}}'
      # Target resolution (where the AD targets live)
      TARGET_PROFILE: '{{.TARGET_PROFILE | default "lab"}}'
      TARGET_REGION: '{{.TARGET_REGION | default "us-west-2"}}'
      # K8s cluster (where the agents run)
      K8S_NAMESPACE: '{{.K8S_NAMESPACE | default "attack-simulation"}}'
      REDTEAM_PROJECT: '{{.REDTEAM_PROJECT | default "ares-redteam"}}'
    preconditions:
      - sh: test -n "{{.TARGET}}"
        msg: "TARGET variable is required. Usage: task ares:red:multi TARGET=dreadgoad"
    cmds:
      - |
        export ANTHROPIC_API_KEY=$(op item get "claude.ai" --fields dreadnode-api-key --reveal 2>/dev/null || echo "")
        export DREADNODE_API_KEY=$(op item get "Dreadnode Dev Platform" --fields api-key --reveal 2>/dev/null || echo "")

        TARGET="{{.TARGET}}"

        # Check if TARGET is an IP address (simple regex check)
        if echo "$TARGET" | grep -qE '^[0-9]+\.[0-9]+\.[0-9]+\.[0-9]+'; then
            echo "🎯 Using direct IP(s): $TARGET"
            RESOLVED_TARGETS="$TARGET"
        else
            # Resolve TARGET via AWS EC2 Name tag filter (from lab account)
            echo "🔍 Resolving '$TARGET' via AWS EC2 ({{.TARGET_PROFILE}}/{{.TARGET_REGION}})..."

            RESOLVED_TARGETS=$(aws ec2 describe-instances \
                --profile "{{.TARGET_PROFILE}}" \
                --region "{{.TARGET_REGION}}" \
                --filters "Name=instance-state-name,Values=running" \
                --query "Reservations[*].Instances[?contains(Tags[?Key==\`Name\`].Value|[0], \`$TARGET\`)].PrivateIpAddress" \
                --output text | tr '\t\n' ',' | sed 's/,$//')

            if [ -z "$RESOLVED_TARGETS" ]; then
                echo "❌ No running EC2 instances found matching Name tag filter: $TARGET"
                exit 1
            fi

            TARGET_COUNT=$(echo "$RESOLVED_TARGETS" | tr ',' '\n' | wc -l | xargs)
            echo "✅ Resolved $TARGET_COUNT target(s): $RESOLVED_TARGETS"
        fi

        # Generate operation ID if not provided
        OPERATION_ID="{{.OPERATION_ID}}"
        if [ -z "$OPERATION_ID" ]; then
          OPERATION_ID="op-$(date +%Y%m%d-%H%M%S)"
        fi

        echo "🎯 Operation ID: $OPERATION_ID"
        echo "🌐 Target domain: {{.DOMAIN}}"
        echo "🖥️  Target IPs: $RESOLVED_TARGETS"
        echo "🔌 K8s namespace: {{.K8S_NAMESPACE}}"

        if [ "{{.RESUME}}" = "true" ]; then
          echo "🔄 Resuming from checkpoint"
        fi

        # Get Redis password from secret
        REDIS_PASS=$(kubectl get secret redis-secret -n {{.K8S_NAMESPACE}} -o jsonpath='{.data.password}' 2>/dev/null | base64 -d || echo "")
        if [ -n "$REDIS_PASS" ]; then
          REDIS_URL="redis://:${REDIS_PASS}@redis:6379"
          echo "📡 Redis: authenticated connection"
        else
          REDIS_URL="redis://redis:6379"
          echo "📡 Redis: no authentication"
        fi

        mkdir -p {{.LOG_DIR}}
        LOGFILE="{{.LOG_DIR}}/red-multi-$(date +%Y%m%d-%H%M%S).log"
        echo "📝 Logging to: $LOGFILE"

        # Run orchestrator inside the K8s cluster via kubectl exec
        echo "🚀 Starting orchestrator in K8s cluster..."
        kubectl exec -i -n {{.K8S_NAMESPACE}} deploy/ares-orchestrator -- \
          python -m ares multi-agent "{{.DOMAIN}}" "$RESOLVED_TARGETS" \
          --args.model {{.MODEL}} \
          --args.max-steps {{.MAX_STEPS_RED}} \
          --multi-args.redis-url "$REDIS_URL" \
          --multi-args.namespace "{{.K8S_NAMESPACE}}" \
          --dn-args.server {{.DREADNODE_SERVER}} \
          --dn-args.token "$DREADNODE_API_KEY" \
          --dn-args.organization {{.DREADNODE_ORGANIZATION}} \
          --dn-args.workspace {{.DREADNODE_WORKSPACE}} \
          --dn-args.project {{.REDTEAM_PROJECT}} \
          2>&1 | tee -a "$LOGFILE"

  ares:red:multi:status:
    desc: "Check multi-agent operation status (usage: task ares:red:multi:status OPERATION_ID=op-xxx)"
    vars:
      OPERATION_ID: '{{.OPERATION_ID | default ""}}'
      K8S_NAMESPACE: '{{.K8S_NAMESPACE | default "attack-simulation"}}'
    preconditions:
      - sh: test -n "{{.OPERATION_ID}}"
        msg: "OPERATION_ID variable is required. Usage: task ares:red:multi:status OPERATION_ID=op-xxx"
    cmds:
      - |
        REDIS_PASS=$(kubectl get secret redis-secret -n {{.K8S_NAMESPACE}} -o jsonpath='{.data.password}' 2>/dev/null | base64 -d || echo "")
        if [ -n "$REDIS_PASS" ]; then
          REDIS_URL="redis://:${REDIS_PASS}@redis:6379"
        else
          REDIS_URL="redis://redis:6379"
        fi

        kubectl exec -n {{.K8S_NAMESPACE}} deploy/ares-orchestrator -- python -c "
        import asyncio
        from ares.core.recovery import OperationRecoveryManager

        async def main():
            recovery = OperationRecoveryManager(redis_url='$REDIS_URL')
            await recovery.start()

            has_checkpoint = await recovery.has_checkpoint('{{.OPERATION_ID}}')
            if not has_checkpoint:
                print('❌ No checkpoint found for operation: {{.OPERATION_ID}}')
                return

            checkpoint_time = await recovery.get_checkpoint_time('{{.OPERATION_ID}}')
            print(f'✅ Checkpoint found')
            print(f'   Last checkpoint: {checkpoint_time}')

            # Recover state to show details
            state = await recovery.recover_operation('{{.OPERATION_ID}}')
            print(f'\n📊 Operation Status:')
            print(f'   Domain Admin: {\"YES ✅\" if state.has_domain_admin else \"NO ⏳\"}')
            print(f'   Credentials: {len(state.all_credentials)}')
            print(f'   Hashes: {len(state.all_hashes)}')
            print(f'   Hosts: {len(state.all_hosts)}')
            print(f'   Vulnerabilities: {len(state.discovered_vulnerabilities)}')
            print(f'   Exploited: {len(state.exploited_vulnerabilities)}')
            print(f'   Pending tasks: {len(state.pending_tasks)}')
            print(f'   Completed tasks: {len(state.completed_tasks)}')

            await recovery.stop()

        asyncio.run(main())
        "

  ares:red:multi:list:
    desc: "List all multi-agent operations with checkpoints"
    vars:
      K8S_NAMESPACE: '{{.K8S_NAMESPACE | default "attack-simulation"}}'
    cmds:
      - |
        REDIS_PASS=$(kubectl get secret redis-secret -n {{.K8S_NAMESPACE}} -o jsonpath='{.data.password}' 2>/dev/null | base64 -d || echo "")
        if [ -n "$REDIS_PASS" ]; then
          REDIS_URL="redis://:${REDIS_PASS}@redis:6379"
        else
          REDIS_URL="redis://redis:6379"
        fi

        kubectl exec -n {{.K8S_NAMESPACE}} deploy/ares-orchestrator -- python -c "
        import asyncio
        from ares.core.recovery import OperationRecoveryManager

        async def main():
            recovery = OperationRecoveryManager(redis_url='$REDIS_URL')
            await recovery.start()

            operations = await recovery.list_operations()

            if not operations:
                print('No operations found')
                return

            print('📋 Multi-Agent Operations:')
            print('='*60)
            for op in operations:
                print(f\"  {op['operation_id']}: checkpoint at {op['checkpoint_time']}\")

            await recovery.stop()

        asyncio.run(main())
        "

  ares:red:multi:resume:
    desc: "Resume a multi-agent operation from checkpoint (usage: task ares:red:multi:resume OPERATION_ID=op-xxx DOMAIN=target.local TARGETS=192.168.1.10)"
    vars:
      OPERATION_ID: '{{.OPERATION_ID | default ""}}'
      DOMAIN: '{{.DOMAIN | default ""}}'
      TARGETS: '{{.TARGETS | default ""}}'
    preconditions:
      - sh: test -n "{{.OPERATION_ID}}"
        msg: "OPERATION_ID variable is required"
      - sh: test -n "{{.DOMAIN}}"
        msg: "DOMAIN variable is required"
      - sh: test -n "{{.TARGETS}}"
        msg: "TARGETS variable is required"
    cmds:
      - task: ares:red:multi
        vars:
          OPERATION_ID: "{{.OPERATION_ID}}"
          DOMAIN: "{{.DOMAIN}}"
          TARGET: "{{.TARGETS}}"
          RESUME: "true"

  ares:red:multi:cleanup:
    desc: "Clean up old multi-agent operation checkpoints (usage: task ares:red:multi:cleanup [MAX_AGE_HOURS=24])"
    vars:
      MAX_AGE_HOURS: '{{.MAX_AGE_HOURS | default "24"}}'
      K8S_NAMESPACE: '{{.K8S_NAMESPACE | default "attack-simulation"}}'
    cmds:
      - |
        REDIS_PASS=$(kubectl get secret redis-secret -n {{.K8S_NAMESPACE}} -o jsonpath='{.data.password}' 2>/dev/null | base64 -d || echo "")
        if [ -n "$REDIS_PASS" ]; then
          REDIS_URL="redis://:${REDIS_PASS}@redis:6379"
        else
          REDIS_URL="redis://redis:6379"
        fi

        kubectl exec -n {{.K8S_NAMESPACE}} deploy/ares-orchestrator -- python -c "
        import asyncio
        from ares.core.recovery import OperationRecoveryManager

        async def main():
            recovery = OperationRecoveryManager(redis_url='$REDIS_URL')
            await recovery.start()

            removed = await recovery.cleanup_old_checkpoints(max_age_hours={{.MAX_AGE_HOURS}})
            print(f'🧹 Cleaned up {removed} old checkpoints (older than {{.MAX_AGE_HOURS}} hours)')

            await recovery.stop()

        asyncio.run(main())
        "

  ares:red:k8s:check:
    desc: "Check Kubernetes infrastructure for multi-agent operations"
    vars:
      NAMESPACE: '{{.NAMESPACE | default "ares"}}'
    cmds:
      - |
        echo "🔍 Checking Kubernetes infrastructure for multi-agent operations"
        echo "=================================================================="
        echo ""

        # Check namespace
        echo "📦 Namespace: {{.NAMESPACE}}"
        if kubectl get namespace {{.NAMESPACE}} >/dev/null 2>&1; then
          echo "   ✅ Namespace exists"
        else
          echo "   ❌ Namespace not found"
        fi
        echo ""

        # Check Redis
        echo "💾 Redis:"
        REDIS_POD=$(kubectl get pods -n {{.NAMESPACE}} -l app=redis -o name 2>/dev/null | head -1)
        if [ -n "$REDIS_POD" ]; then
          echo "   ✅ Redis pod found: $REDIS_POD"
          kubectl exec -n {{.NAMESPACE}} $REDIS_POD -- redis-cli ping 2>/dev/null && echo "   ✅ Redis responding" || echo "   ❌ Redis not responding"
        else
          echo "   ❌ No Redis pods found"
        fi
        echo ""

        # Check agent pods
        echo "🤖 Agent Pods:"
        for role in enum cracker acl privesc lateral poisoning atomic; do
          POD_COUNT=$(kubectl get pods -n {{.NAMESPACE}} -l ares.dreadnode.io/role=$role -o name 2>/dev/null | wc -l | xargs)
          if [ "$POD_COUNT" -gt 0 ]; then
            STATUS=$(kubectl get pods -n {{.NAMESPACE}} -l ares.dreadnode.io/role=$role -o jsonpath='{.items[0].status.phase}' 2>/dev/null)
            echo "   ✅ $role: $POD_COUNT pod(s) - $STATUS"
          else
            echo "   ⚠️  $role: No pods found"
          fi
        done
        echo ""

        echo "📊 All pods in {{.NAMESPACE}}:"
        kubectl get pods -n {{.NAMESPACE}} -o wide 2>/dev/null || echo "   Unable to list pods"

  ares:red:redeploy:
    desc: "Restart all red team deployments in the cluster"
    vars:
      NAMESPACE: '{{.NAMESPACE | default "attack-simulation"}}'
    cmds:
      - |
        echo "🔄 Restarting red team deployments in namespace: {{.NAMESPACE}}"
        kubectl rollout restart deployment -n {{.NAMESPACE}} -l ares.dreadnode.io/component=red-team
        echo "✅ Red team deployments restarted"

  ares:red:logs:
    desc: "Tail red team agent logs from Kali via SSM (usage: task ares:red:logs [KALI=instance-name] [LINES=100] [FOLLOW=true])"
    vars:
      KALI: '{{.KALI | default "staging-alpha-operator-range-kali"}}'
      LINES: '{{.LINES | default "100"}}'
      FOLLOW: '{{.FOLLOW | default "false"}}'
      PROFILE: '{{.PROFILE | default "lab"}}'
      REGION: '{{.REGION | default "us-west-1"}}'
    deps:
      - task: check-aws-auth
        vars:
          PROFILE: '{{.PROFILE}}'
          REGION: '{{.REGION}}'
    cmds:
      - |
        SSM_INSTANCE_ID=$(aws ec2 describe-instances \
            --profile "{{.PROFILE}}" \
            --region "{{.REGION}}" \
            --filters "Name=tag:Name,Values={{.KALI}}" "Name=instance-state-name,Values=running" \
            --query 'Reservations[0].Instances[0].InstanceId' \
            --output text)

        if [ "$SSM_INSTANCE_ID" == "None" ] || [ -z "$SSM_INSTANCE_ID" ]; then
            echo "❌ Kali instance not found or not running: {{.KALI}}"
            exit 1
        fi

        if [ "{{.FOLLOW}}" = "true" ]; then
            echo "📡 Following logs from {{.KALI}} (Press Ctrl+C to stop)"
            echo "======================================================================"
            echo ""

            while true; do
                clear
                echo "🕐 $(date) - Refreshing..."
                echo "======================================================================"

                COMMAND_ID=$(aws ssm send-command \
                    --profile "{{.PROFILE}}" \
                    --region "{{.REGION}}" \
                    --instance-ids "$SSM_INSTANCE_ID" \
                    --document-name "AWS-RunShellScript" \
                    --parameters 'commands=["tail -n 100 /tmp/ares-redteam-output.log 2>/dev/null || echo \"Log file not yet created\""]' \
                    --query 'Command.CommandId' \
                    --output text)

                sleep 2

                aws ssm get-command-invocation \
                    --profile "{{.PROFILE}}" \
                    --region "{{.REGION}}" \
                    --command-id "$COMMAND_ID" \
                    --instance-id "$SSM_INSTANCE_ID" \
                    --query 'StandardOutputContent' \
                    --output text

                sleep 3
            done
        else
            echo "📋 Fetching last {{.LINES}} lines from {{.KALI}}..."
            echo "======================================================================"
            echo ""

            COMMAND_ID=$(aws ssm send-command \
                --profile "{{.PROFILE}}" \
                --region "{{.REGION}}" \
                --instance-ids "$SSM_INSTANCE_ID" \
                --document-name "AWS-RunShellScript" \
                --parameters "commands=[\"tail -n {{.LINES}} /tmp/ares-redteam-output.log 2>/dev/null || echo 'Log file not yet created'\"]" \
                --query 'Command.CommandId' \
                --output text)

            sleep 2

            aws ssm get-command-invocation \
                --profile "{{.PROFILE}}" \
                --region "{{.REGION}}" \
                --command-id "$COMMAND_ID" \
                --instance-id "$SSM_INSTANCE_ID" \
                --query 'StandardOutputContent' \
                --output text
        fi
