---
# yaml-language-server: $schema=https://taskfile.dev/schema.json
version: "3"

includes:
  aws: "https://raw.githubusercontent.com/CowDogMoo/taskfile-templates/main/aws/Taskfile.yaml"
  github: "https://raw.githubusercontent.com/CowDogMoo/taskfile-templates/main/github/Taskfile.yaml"
  pre-commit: "https://raw.githubusercontent.com/CowDogMoo/taskfile-templates/main/pre-commit/Taskfile.yaml"
  renovate: "https://raw.githubusercontent.com/CowDogMoo/taskfile-templates/main/renovate/Taskfile.yaml"
  secrets: "https://raw.githubusercontent.com/CowDogMoo/taskfile-templates/main/secrets/Taskfile.yaml"  # pragma: allowlist secret

vars:
  API_DIR: "."
  # Ares configuration
  MODEL: '{{.MODEL | default "claude-sonnet-4-20250514"}}'
  GRAFANA_URL: '{{.GRAFANA_URL | default "https://grafana.dev.plundr.ai"}}'
  LOKI_URL: '{{.LOKI_URL | default "http://localhost:3100"}}'
  PROMETHEUS_URL: '{{.PROMETHEUS_URL | default "http://localhost:9090"}}'
  POLL_INTERVAL: '{{.POLL_INTERVAL | default "30"}}'
  MAX_STEPS: '{{.MAX_STEPS | default "150"}}'
  REPORT_DIR: '{{.REPORT_DIR | default "./reports"}}'
  DREADNODE_SERVER: '{{.DREADNODE_SERVER | default "https://platform.dev.plundr.ai/"}}'
  DREADNODE_ORGANIZATION: '{{.DREADNODE_ORGANIZATION | default "ares"}}'
  DREADNODE_WORKSPACE: '{{.DREADNODE_WORKSPACE | default "ares-protocol"}}'
  DREADNODE_PROJECT: '{{.DREADNODE_PROJECT | default "ares-soc"}}'

tasks:
  default:
    desc: List all available tasks
    cmds:
      - task --list --sort none

  # Setup and initialization tasks
  check-command:
    internal: true
    vars:
      COMMAND: '{{.CLI_ARGS}}'
    cmds:
      - |
        command -v {{.COMMAND}} >/dev/null 2>&1 || (echo "Command '{{.COMMAND}}' not found. Please install it." && exit 1)

  check-dependencies:
    internal: true
    cmds:
      - task: check-command
        vars: { COMMAND: docker }
      - task: check-command
        vars: { COMMAND: python3 }
      - task: check-command
        vars: { COMMAND: ruby }

  setup-env:
    internal: true
    cmds:
      - cp -n .env.example .env || true

  get-dotenv-value:
    internal: true
    vars:
      KEY: '{{.CLI_ARGS}}'
    cmds:
      - grep '^{{.KEY}}=' .env | sed 's/^{{.KEY}}=//;s/^"//;s/"$//'

  deactivate:
    internal: true
    cmds:
      - |
        if [ -n "${VIRTUAL_ENV:-}" ]; then
          echo "Deactivated venv - try again."
          deactivate
        fi

  setup-git-hooks:
    desc: Set up Git hooks
    cmds:
      - |
        #!/bin/bash
        set -e
        ln -sf .hooks/post_merge.sh .git/hooks/post-merge
        chmod +x .git/hooks/post-merge
        echo "Post-merge git hooks successfully installed!"

  init:
    desc: Initialize the project
    deps: [check-dependencies]
    cmds:
      - task: setup-env
      - task: setup-git-hooks
      - poetry install
      - task: pre-commit:install
      - echo "Project is ready to go! 🚀"

  # Tools and pre-commit tasks
  run-pre-commit:
    desc: Run pre-commit hooks on all files
    cmds:
      - task: pre-commit:update-hooks
      - task: pre-commit:clear-cache
      - task: pre-commit:run-hooks

  clean:
    desc: Clean Python artifacts and cache directories
    cmds:
      - |
        find . -type d -name "__pycache__" -exec rm -rf {} + 2>/dev/null || true
        find . -type f -name "*.pyc" -delete
        find . -type f -name "*.pyo" -delete
        find . -type f -name "*.pyd" -delete
        rm -rf .coverage htmlcov/ .pytest_cache/ .mypy_cache/ build/ dist/ ./*.egg-info/

  # Poetry and API tasks
  poetry:
    desc: Run poetry in the API directory
    vars:
      ARGS: '{{.CLI_ARGS}}'
    cmds:
      - task: deactivate
      - cd {{.API_DIR}} && export PYTHONPATH="$(pwd)" && poetry {{.ARGS}}

  mypy:
    desc: Run type checking with mypy
    cmds:
      - task: poetry
        vars: { ARGS: "run mypy ." }

  ruff:
    desc: Run linting and formatting with ruff
    cmds:
      - task: poetry
        vars: { ARGS: "run ruff check ." }
      - task: poetry
        vars: { ARGS: "run ruff format ." }

  pytest:
    desc: Run tests with pytest and coverage reporting
    vars:
      ARGS: '{{default "--cov=. --cov-report=term-missing tests/" .CLI_ARGS}}'
    cmds:
      - task: poetry
        vars: { ARGS: "run pytest {{.ARGS}}" }

  # GitHub tasks
  create-release:
    desc: Create a release on GitHub
    cmds:
      - task: github:create-release

  # ===========================================================================
  # Ares SOC Agent Tasks
  # ===========================================================================

  ares:run:
    desc: Run Ares in poll mode (retrieves API keys from 1Password)
    cmds:
      - |
        echo "Starting Ares SOC Investigation Agent..."
        echo "Platform: {{.DREADNODE_SERVER}}"
        echo "Model: {{.MODEL}}"
        echo ""

        # Get API keys from 1Password
        export DREADNODE_API_KEY=$(op item get "Dreadnode Dev Platform" --fields api-key --reveal)
        export GRAFANA_API_KEY=$(op item get "Ares Grafana MCP" --fields grafana-token --reveal 2>/dev/null || echo "")
        export ANTHROPIC_API_KEY=$(op item get "claude.ai" --fields dreadnode-api-key --reveal 2>/dev/null || echo "")

        # Run Ares using uv
        uv run python -m src \
          --args.model {{.MODEL}} \
          --args.grafana-url {{.GRAFANA_URL}} \
          --args.loki-url {{.LOKI_URL}} \
          --args.prometheus-url {{.PROMETHEUS_URL}} \
          --args.poll-interval {{.POLL_INTERVAL}} \
          --args.max-steps {{.MAX_STEPS}} \
          --args.report-dir {{.REPORT_DIR}} \
          --dn-args.server {{.DREADNODE_SERVER}} \
          --dn-args.token "$DREADNODE_API_KEY" \
          --dn-args.organization {{.DREADNODE_ORGANIZATION}} \
          --dn-args.workspace {{.DREADNODE_WORKSPACE}} \
          --dn-args.project {{.DREADNODE_PROJECT}}

  ares:run:local:
    desc: Run Ares using local environment variables (no 1Password)
    cmds:
      - |
        echo "Starting Ares SOC Investigation Agent (using .env)..."
        echo "Platform: {{.DREADNODE_SERVER}}"
        echo "Model: {{.MODEL}}"
        echo ""

        # Check for .env file
        if [ ! -f .env ]; then
          echo "⚠️  Warning: .env file not found. Copy .env.example to .env and configure."
          exit 1
        fi

        # Load .env
        set -a
        . ./.env
        set +a

        # Run Ares using uv
        uv run python -m src \
          --args.model {{.MODEL}} \
          --args.grafana-url {{.GRAFANA_URL}} \
          --args.loki-url {{.LOKI_URL}} \
          --args.prometheus-url {{.PROMETHEUS_URL}} \
          --args.poll-interval {{.POLL_INTERVAL}} \
          --args.max-steps {{.MAX_STEPS}} \
          --args.report-dir {{.REPORT_DIR}} \
          --dn-args.server {{.DREADNODE_SERVER}} \
          --dn-args.organization {{.DREADNODE_ORGANIZATION}} \
          --dn-args.workspace {{.DREADNODE_WORKSPACE}} \
          --dn-args.project {{.DREADNODE_PROJECT}}

  ares:investigate:
    desc: "Investigate a specific alert from JSON file (usage: task ares:investigate ALERT=alert.json)"
    vars:
      ALERT: '{{.ALERT | default ""}}'
    preconditions:
      - sh: test -n "{{.ALERT}}"
        msg: "ALERT variable is required. Usage: task ares:investigate ALERT=alert.json"
      - sh: test -f "{{.ALERT}}"
        msg: "Alert file not found: {{.ALERT}}"
    cmds:
      - |
        echo "Investigating alert from: {{.ALERT}}"
        echo ""

        # Get API keys from 1Password
        export DREADNODE_API_KEY=$(op item get "Dreadnode Dev Platform" --fields api-key --reveal)
        export GRAFANA_API_KEY=$(op item get "Ares Grafana MCP" --fields grafana-token --reveal 2>/dev/null || echo "")
        export ANTHROPIC_API_KEY=$(op item get "claude.ai" --fields dreadnode-api-key --reveal 2>/dev/null || echo "")

        # Run investigation
        uv run python -m src investigate-alert {{.ALERT}} \
          --args.model {{.MODEL}} \
          --args.grafana-url {{.GRAFANA_URL}} \
          --args.loki-url {{.LOKI_URL}} \
          --args.prometheus-url {{.PROMETHEUS_URL}} \
          --args.max-steps {{.MAX_STEPS}} \
          --args.report-dir {{.REPORT_DIR}} \
          --dn-args.server {{.DREADNODE_SERVER}} \
          --dn-args.token "$DREADNODE_API_KEY" \
          --dn-args.organization {{.DREADNODE_ORGANIZATION}} \
          --dn-args.workspace {{.DREADNODE_WORKSPACE}} \
          --dn-args.project {{.DREADNODE_PROJECT}}

  ares:config:check:
    desc: Check configuration and API key access
    cmds:
      - |
        echo "Checking Ares configuration..."
        echo ""
        echo "Environment:"
        echo "  Python: $(python --version)"
        echo "  uv: $(uv --version 2>/dev/null || echo 'not installed')"
        echo ""
        echo "Configuration:"
        echo "  Platform: {{.DREADNODE_SERVER}}"
        echo "  Project: {{.DREADNODE_PROJECT}}"
        echo "  Model: {{.MODEL}}"
        echo "  Grafana: {{.GRAFANA_URL}}"
        echo "  Loki: {{.LOKI_URL}}"
        echo "  Prometheus: {{.PROMETHEUS_URL}}"
        echo ""
        echo "Checking 1Password CLI access..."

        # Check if op is installed
        if ! command -v op >/dev/null 2>&1; then
          echo "  ❌ 1Password CLI (op) not installed"
          echo ""
          echo "Install from: https://developer.1password.com/docs/cli/get-started/"
          exit 1
        fi

        echo "  ✅ 1Password CLI installed: $(op --version)"
        echo ""
        echo "Checking 1Password items..."

        # Check Dreadnode API key
        if op item get "Dreadnode Dev Platform" --fields api-key --reveal >/dev/null 2>&1; then
          echo "  ✅ Dreadnode API key accessible"
        else
          echo "  ❌ Dreadnode API key not found in 1Password"
          echo "     Item: 'Dreadnode Dev Platform'"
          echo "     Field: 'api-key'"
        fi

        # Check Grafana API key
        if op item get "Ares Grafana MCP" --fields grafana-token --reveal >/dev/null 2>&1; then
          echo "  ✅ Grafana API key accessible"
        else
          echo "  ⚠️  Grafana API key not found in 1Password"
          echo "     Item: 'Ares Grafana MCP'"
          echo "     Field: 'grafana-token'"
        fi

        # Check Anthropic API key
        if op item get "claude.ai" --fields dreadnode-api-key --reveal >/dev/null 2>&1; then
          echo "  ✅ Anthropic API key accessible"
        else
          echo "  ⚠️  Anthropic API key not found in 1Password"
          echo "     Item: 'claude.ai'"
          echo "     Field: 'dreadnode-api-key'"
        fi

        echo ""
        echo "Configuration check complete"

  ares:config:show:
    desc: Show current configuration (without secrets)
    cmds:
      - |
        echo "Ares Configuration:"
        echo "===================="
        echo "Platform Settings:"
        echo "  Server: {{.DREADNODE_SERVER}}"
        echo "  Project: {{.DREADNODE_PROJECT}}"
        echo ""
        echo "Agent Settings:"
        echo "  Model: {{.MODEL}}"
        echo "  Max Steps: {{.MAX_STEPS}}"
        echo "  Poll Interval: {{.POLL_INTERVAL}}s"
        echo ""
        echo "Data Sources:"
        echo "  Grafana: {{.GRAFANA_URL}}"
        echo "  Loki: {{.LOKI_URL}}"
        echo "  Prometheus: {{.PROMETHEUS_URL}}"
        echo ""
        echo "Output:"
        echo "  Reports: {{.REPORT_DIR}}"

  ares:reports:list:
    desc: List all investigation reports
    cmds:
      - |
        echo "Investigation Reports:"
        echo "======================"
        if [ -d {{.REPORT_DIR}} ]; then
          ls -lht {{.REPORT_DIR}}/*.md 2>/dev/null || echo "No reports found"
        else
          echo "Report directory not found: {{.REPORT_DIR}}"
        fi

  ares:reports:latest:
    desc: Show the latest investigation report
    cmds:
      - |
        LATEST=$(ls -t {{.REPORT_DIR}}/*.md 2>/dev/null | head -1)
        if [ -n "$LATEST" ]; then
          echo "Latest report: $LATEST"
          echo "===================="
          cat "$LATEST"
        else
          echo "No reports found in {{.REPORT_DIR}}"
        fi

  ares:reports:clean:
    desc: Remove all investigation reports
    cmds:
      - |
        read -p "Delete all reports in {{.REPORT_DIR}}? (y/N) " -n 1 -r
        echo
        if [[ $REPLY =~ ^[Yy]$ ]]; then
          rm -rf {{.REPORT_DIR}}/*.md
          echo "✅ Reports cleaned"
        fi

  ares:version:
    desc: Show Ares version information
    cmds:
      - uv run python -m ares version

  ares:mitre:test:
    desc: Test MITRE ATT&CK data loading
    cmds:
      - |
        uv run python -c "
        import asyncio
        from src.mitre import MITREAttackClient

        async def test():
            client = MITREAttackClient()
            await client.load()
            print(f'✅ Loaded {len(client._techniques)} techniques')
            print(f'✅ Loaded {len(client._tactics)} tactics')

            # Show a sample technique
            sample = list(client._techniques.values())[0]
            print(f'\nSample technique:')
            print(f'  ID: {sample.id}')
            print(f'  Name: {sample.name}')
            print(f'  Tactic: {sample.tactic}')

        asyncio.run(test())
        "

  ares:test:windows:
    desc: Test Grafana MCP integration for Windows attack queries
    cmds:
      - python tests/test_grafana_mcp_windows.py
