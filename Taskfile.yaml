  ares:red:multi:loot:
    desc: "Dump users, credentials, and hosts from Redis state (usage: task ares:red:multi:loot OPERATION_ID=op-xxx)"
    silent: true
    vars:
      OPERATION_ID: '{{.OPERATION_ID | default ""}}'
      K8S_NAMESPACE: '{{.K8S_NAMESPACE | default "attack-simulation"}}'
    preconditions:
      - sh: test -n "{{.OPERATION_ID}}"
        msg: "OPERATION_ID variable is required. Usage: task ares:red:multi:loot OPERATION_ID=op-xxx"
    cmds:
      - |
        REDIS_PASS=$(kubectl get secret redis-secret -n {{.K8S_NAMESPACE}} -o jsonpath='{.data.password}' 2>/dev/null | base64 -d || echo "")
        if [ -n "$REDIS_PASS" ]; then
          REDIS_URL="redis://:${REDIS_PASS}@redis:6379"
        else
          REDIS_URL="redis://redis:6379"
        fi

        POD=$(kubectl get pods -n {{.K8S_NAMESPACE}} -l ares.dreadnode.io/role=orchestrator -o jsonpath='{.items[0].metadata.name}' 2>/dev/null)
        if [ -z "$POD" ]; then
          echo "No orchestrator pod found in namespace {{.K8S_NAMESPACE}}"
          exit 1
        fi

        kubectl exec -i -n {{.K8S_NAMESPACE}} "$POD" -- env REDIS_URL="$REDIS_URL" python - <<'PY'
        import asyncio
        import os
        from ares.core.models import SharedRedTeamState
        from ares.core.redis_client import create_redis_client

        OP_ID = "{{.OPERATION_ID}}"

        def _fmt_host(host):
            parts = []
            if getattr(host, "hostname", ""):
                parts.append(host.hostname)
            if getattr(host, "ip", ""):
                parts.append(host.ip)
            line = " / ".join(parts)
            if getattr(host, "os", ""):
                line = f"{line} [{host.os}]" if line else f"[{host.os}]"
            return line or "(unknown)"

        def _fmt_user(user):
            domain = getattr(user, "domain", "")
            name = getattr(user, "username", "")
            prefix = f"{domain}\\\\{name}" if domain else name
            flags = []
            if getattr(user, "is_admin", False):
                flags.append("admin")
            return f"{prefix} ({', '.join(flags)})" if flags else prefix or "(unknown)"

        def _fmt_cred(cred):
            domain = getattr(cred, "domain", "")
            name = getattr(cred, "username", "")
            password = getattr(cred, "password", "")
            prefix = f"{domain}\\\\{name}" if domain else name
            flags = []
            if getattr(cred, "is_admin", False):
                flags.append("admin")
            suffix = f" ({', '.join(flags)})" if flags else ""
            return f"{prefix}:{password}{suffix}" if prefix or password else "(unknown)"

        async def main():
            client = await create_redis_client(decode_responses=False)
            try:
                data = await client.get(f"ares:operation:{OP_ID}:state")
                if not data:
                    print(f"No state found for operation: {OP_ID}")
                    return
                state = SharedRedTeamState.from_bytes(data)
            finally:
                await client.aclose()

            print(f"Operation: {state.operation_id}")
            print("")

            hosts = state.all_hosts
            users = state.all_users
            creds = state.all_credentials
            hashes = state.all_hashes
            shares = state.all_shares
            weaknesses = state.all_weaknesses

            print(f"Hosts ({len(hosts)}):")
            if hosts:
                for host in hosts:
                    print(f"- {_fmt_host(host)}")
            else:
                print("- None")
            print("")

            print(f"Users ({len(users)}):")
            if users:
                for user in users:
                    print(f"- {_fmt_user(user)}")
            else:
                print("- None")
            print("")

            print(f"Credentials ({len(creds)}):")
            if creds:
                for cred in creds:
                    print(f"- {_fmt_cred(cred)}")
            else:
                print("- None")
            print("")

            print(f"Hashes ({len(hashes)}):")
            if hashes:
                for h in hashes:
                    domain = getattr(h, "domain", "")
                    name = getattr(h, "username", "")
                    prefix = f"{domain}\\\\{name}" if domain else name
                    print(f"- {prefix}:{h.hash_type}:{h.hash_value}")
            else:
                print("- None")
            print("")

            print(f"Shares ({len(shares)}):")
            if shares:
                for share in shares:
                    host = getattr(share, "host", "")
                    name = getattr(share, "name", "")
                    perms = getattr(share, "permissions", "")
                    parts = [p for p in (host, name) if p]
                    line = "/".join(parts) if parts else "(unknown)"
                    if perms:
                        line = f"{line} [{perms}]"
                    print(f"- {line}")
            else:
                print("- None")
            print("")

            print(f"Weaknesses ({len(weaknesses)}):")
            if weaknesses:
                for item in weaknesses:
                    print(f"- {item}")
            else:
                print("- None")

        asyncio.run(main())
        PY

