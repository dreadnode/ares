---
# yaml-language-server: $schema=https://taskfile.dev/schema.json
version: "3"

includes:
  aws: "https://raw.githubusercontent.com/CowDogMoo/taskfile-templates/main/aws/Taskfile.yaml"
  github: "https://raw.githubusercontent.com/CowDogMoo/taskfile-templates/main/github/Taskfile.yaml"
  pre-commit: "https://raw.githubusercontent.com/CowDogMoo/taskfile-templates/main/pre-commit/Taskfile.yaml"
  renovate: "https://raw.githubusercontent.com/CowDogMoo/taskfile-templates/main/renovate/Taskfile.yaml"
  secrets: "https://raw.githubusercontent.com/CowDogMoo/taskfile-templates/main/secrets/Taskfile.yaml"  # pragma: allowlist secret
  remote:
    taskfile: .taskfiles/remote/Taskfile.yaml
    optional: true

vars:
  API_DIR: "."
  # Ares configuration
  # MODEL: '{{.MODEL | default "claude-sonnet-4-20250514"}}'
  MODEL: '{{.MODEL | default "gpt-5.2"}}'
  GRAFANA_URL: '{{.GRAFANA_URL | default "https://grafana.dev.plundr.ai"}}'
  POLL_INTERVAL: '{{.POLL_INTERVAL | default "30"}}'
  MAX_STEPS_BLUE: '{{.MAX_STEPS_BLUE | default "50"}}'
  MAX_STEPS_BLUE_ONCE: '{{.MAX_STEPS_BLUE_ONCE | default "15"}}'  # ~15 min max for once mode
  MAX_STEPS_RED: '{{.MAX_STEPS_RED | default "150"}}'
  REPORT_DIR: '{{.REPORT_DIR | default "./reports"}}'
  LOG_DIR: '{{.LOG_DIR | default "./logs"}}'
  DREADNODE_SERVER_URL: '{{.DREADNODE_SERVER_URL | default "https://platform.dev.plundr.ai/"}}'
  DREADNODE_ORGANIZATION: '{{.DREADNODE_ORGANIZATION | default "ares"}}'
  DREADNODE_WORKSPACE: '{{.DREADNODE_WORKSPACE | default "ares-protocol"}}'
  DREADNODE_PROJECT: '{{.DREADNODE_PROJECT | default "ares-soc"}}'
  MODEL_ORCHESTRATOR: '{{.MODEL_ORCHESTRATOR | default ""}}'
  MODEL_WORKER: '{{.MODEL_WORKER | default ""}}'
  MODEL_ALL: '{{.MODEL_ALL | default ""}}'
  MODEL_RECON: '{{.MODEL_RECON | default ""}}'
  MODEL_CREDENTIAL_ACCESS: '{{.MODEL_CREDENTIAL_ACCESS | default ""}}'
  MODEL_CRACKER: '{{.MODEL_CRACKER | default ""}}'
  MODEL_ACL: '{{.MODEL_ACL | default ""}}'
  MODEL_PRIVESC: '{{.MODEL_PRIVESC | default ""}}'
  MODEL_LATERAL: '{{.MODEL_LATERAL | default ""}}'
  MODEL_COERCION: '{{.MODEL_COERCION | default ""}}'

tasks:
  default:
    desc: List all available tasks
    silent: true
    cmds:
      - task --list --sort none

  # Setup and initialization tasks
  check-command:
    internal: true
    silent: true
    vars:
      COMMAND: '{{.CLI_ARGS}}'
    cmds:
      - |
        command -v {{.COMMAND}} >/dev/null 2>&1 || (echo "Command '{{.COMMAND}}' not found. Please install it." && exit 1)

  check-dependencies:
    internal: true
    silent: true
    cmds:
      - task: check-command
        vars: { COMMAND: docker }
      - task: check-command
        vars: { COMMAND: python3 }
      - task: check-command
        vars: { COMMAND: ruby }

  setup-env:
    internal: true
    silent: true
    cmds:
      - cp -n .env.example .env || true

  get-dotenv-value:
    internal: true
    silent: true
    vars:
      KEY: '{{.CLI_ARGS}}'
    cmds:
      - grep '^{{.KEY}}=' .env | sed 's/^{{.KEY}}=//;s/^"//;s/"$//'

  deactivate:
    internal: true
    silent: true
    cmds:
      - |
        if [ -n "${VIRTUAL_ENV:-}" ]; then
          echo "Deactivated venv - try again."
          deactivate
        fi

  setup-git-hooks:
    desc: Set up Git hooks
    silent: true
    cmds:
      - |
        #!/bin/bash
        set -e
        ln -sf .hooks/post_merge.sh .git/hooks/post-merge
        chmod +x .git/hooks/post-merge
        echo "Post-merge git hooks successfully installed!"

  init:
    desc: Initialize the project
    silent: true
    deps: [check-dependencies]
    cmds:
      - task: setup-env
      - task: setup-git-hooks
      - poetry install
      - task: pre-commit:install
      - echo "Project is ready to go! 🚀"

  # Tools and pre-commit tasks
  run-pre-commit:
    desc: Run pre-commit hooks on all files
    silent: true
    cmds:
      - task: pre-commit:update-hooks
      - task: pre-commit:clear-cache
      - task: pre-commit:run-hooks

  clean:
    desc: Clean Python artifacts and cache directories
    silent: true
    cmds:
      - |
        find . -type d -name "__pycache__" -exec rm -rf {} + 2>/dev/null || true
        find . -type f -name "*.pyc" -delete
        find . -type f -name "*.pyo" -delete
        find . -type f -name "*.pyd" -delete
        rm -rf .coverage htmlcov/ .pytest_cache/ .mypy_cache/ build/ dist/ ./*.egg-info/

  # Poetry and API tasks
  poetry:
    desc: Run poetry in the API directory
    silent: true
    vars:
      ARGS: '{{.CLI_ARGS}}'
    cmds:
      - task: deactivate
      - cd {{.API_DIR}} && export PYTHONPATH="$(pwd)" && poetry {{.ARGS}}

  mypy:
    desc: Run type checking with mypy
    silent: true
    cmds:
      - task: poetry
        vars: { ARGS: "run mypy ." }

  ruff:
    desc: Run linting and formatting with ruff
    silent: true
    cmds:
      - task: poetry
        vars: { ARGS: "run ruff check ." }
      - task: poetry
        vars: { ARGS: "run ruff format ." }

  pytest:
    desc: Run tests with pytest and coverage reporting
    silent: true
    vars:
      ARGS: '{{default "--cov=. --cov-report=term-missing tests/" .CLI_ARGS}}'
    cmds:
      - task: poetry
        vars: { ARGS: "run pytest {{.ARGS}}" }

  # GitHub tasks
  create-release:
    desc: Create a release on GitHub
    silent: true
    cmds:
      - task: github:create-release

  # ===========================================================================
  # Ares Blue Team (SOC) Agent Tasks
  # ===========================================================================

  ares:blue:
    desc: Run blue team agent in poll mode (uses 1Password for API keys)
    silent: true
    deps:
      - task: check-aws-auth
        vars:
          PROFILE: '{{.PROFILE | default "infrastructure"}}'
          REGION: '{{.REGION | default "us-west-2"}}'
    cmds:
      - |
        export ANTHROPIC_API_KEY=$(op item get "claude.ai" --fields dreadnode-api-key --reveal 2>/dev/null || echo "")
        export DREADNODE_API_KEY=$(op item get "Dreadnode Dev Platform" --fields api-key --reveal 2>/dev/null || echo "")
        export GRAFANA_SERVICE_ACCOUNT_TOKEN=$(op item get "Ares Grafana MCP" --fields grafana-token --reveal 2>/dev/null || echo "")
        export OPENAI_API_KEY=$(op item get "Openai" --fields dreadnode-api-key --reveal 2>/dev/null)
        MODEL_ARG="{{.MODEL}}"
        if [ -n "{{.MODEL_ALL}}" ]; then
          MODEL_ARG="{{.MODEL_ALL}}"
        fi

        mkdir -p {{.LOG_DIR}}
        LOGFILE="{{.LOG_DIR}}/blue-$(date +%Y%m%d-%H%M%S).log"
        echo "📝 Logging to: $LOGFILE"

        uv run python -m ares \
          --args.model "$MODEL_ARG" \
          --args.grafana-url {{.GRAFANA_URL}} \
          --args.poll-interval {{.POLL_INTERVAL}} \
          --args.max-steps {{.MAX_STEPS_BLUE}} \
          --args.report-dir {{.REPORT_DIR}} \
          --dn-args.server {{.DREADNODE_SERVER_URL}} \
          --dn-args.token "$DREADNODE_API_KEY" \
          --dn-args.organization {{.DREADNODE_ORGANIZATION}} \
          --dn-args.workspace {{.DREADNODE_WORKSPACE}} \
          --dn-args.project {{.DREADNODE_PROJECT}} \
          2>&1 | tee -a "$LOGFILE"

  ares:blue:once:
    desc: Run blue team agent once and exit (uses 1Password for API keys)
    silent: true
    deps:
      - task: check-aws-auth
        vars:
          PROFILE: '{{.PROFILE | default "infrastructure"}}'
          REGION: '{{.REGION | default "us-west-2"}}'
    cmds:
      - |
        export ANTHROPIC_API_KEY=$(op item get "claude.ai" --fields dreadnode-api-key --reveal 2>/dev/null || echo "")
        export DREADNODE_API_KEY=$(op item get "Dreadnode Dev Platform" --fields api-key --reveal 2>/dev/null || echo "")
        export GRAFANA_SERVICE_ACCOUNT_TOKEN=$(op item get "Ares Grafana MCP" --fields grafana-token --reveal 2>/dev/null || echo "")
        export OPENAI_API_KEY=$(op item get "Openai" --fields dreadnode-api-key --reveal 2>/dev/null)
        MODEL_ARG="{{.MODEL}}"
        if [ -n "{{.MODEL_ALL}}" ]; then
          MODEL_ARG="{{.MODEL_ALL}}"
        fi

        mkdir -p {{.LOG_DIR}}
        LOGFILE="{{.LOG_DIR}}/blue-$(date +%Y%m%d-%H%M%S).log"
        echo "📝 Logging to: $LOGFILE"

        uv run python -m ares \
          --args.model "$MODEL_ARG" \
          --args.grafana-url {{.GRAFANA_URL}} \
          --args.poll-interval {{.POLL_INTERVAL}} \
          --args.max-steps {{.MAX_STEPS_BLUE_ONCE}} \
          --args.report-dir {{.REPORT_DIR}} \
          --args.once \
          --dn-args.server {{.DREADNODE_SERVER_URL}} \
          --dn-args.token "$DREADNODE_API_KEY" \
          --dn-args.organization {{.DREADNODE_ORGANIZATION}} \
          --dn-args.workspace {{.DREADNODE_WORKSPACE}} \
          --dn-args.project {{.DREADNODE_PROJECT}} \
          2>&1 | tee -a "$LOGFILE"

  ares:blue:local:
    desc: Run blue team agent using .env file (no 1Password)
    silent: true
    deps:
      - task: check-aws-auth
        vars:
          PROFILE: '{{.PROFILE | default "infrastructure"}}'
          REGION: '{{.REGION | default "us-west-2"}}'
    cmds:
      - |
        if [ ! -f .env ]; then
          echo "Error: .env file not found"
          exit 1
        fi

        set -a
        . ./.env
        set +a
        MODEL_ARG="{{.MODEL}}"
        if [ -n "{{.MODEL_ALL}}" ]; then
          MODEL_ARG="{{.MODEL_ALL}}"
        fi

        mkdir -p {{.LOG_DIR}}
        LOGFILE="{{.LOG_DIR}}/blue-$(date +%Y%m%d-%H%M%S).log"
        echo "📝 Logging to: $LOGFILE"

        uv run python -m ares \
          --args.model "$MODEL_ARG" \
          --args.grafana-url {{.GRAFANA_URL}} \
          --args.poll-interval {{.POLL_INTERVAL}} \
          --args.max-steps {{.MAX_STEPS_BLUE}} \
          --args.report-dir {{.REPORT_DIR}} \
          --dn-args.server {{.DREADNODE_SERVER_URL}} \
          --dn-args.organization {{.DREADNODE_ORGANIZATION}} \
          --dn-args.workspace {{.DREADNODE_WORKSPACE}} \
          --dn-args.project {{.DREADNODE_PROJECT}} \
          2>&1 | tee -a "$LOGFILE"

  ares:blue:local:once:
    desc: Run blue team agent once and exit using .env file (no 1Password)
    silent: true
    deps:
      - task: check-aws-auth
        vars:
          PROFILE: '{{.PROFILE | default "infrastructure"}}'
          REGION: '{{.REGION | default "us-west-2"}}'
    cmds:
      - |
        if [ ! -f .env ]; then
          echo "Error: .env file not found"
          exit 1
        fi

        set -a
        . ./.env
        set +a
        MODEL_ARG="{{.MODEL}}"
        if [ -n "{{.MODEL_ALL}}" ]; then
          MODEL_ARG="{{.MODEL_ALL}}"
        fi

        mkdir -p {{.LOG_DIR}}
        LOGFILE="{{.LOG_DIR}}/blue-$(date +%Y%m%d-%H%M%S).log"
        echo "📝 Logging to: $LOGFILE"

        uv run python -m ares \
          --args.model "$MODEL_ARG" \
          --args.grafana-url {{.GRAFANA_URL}} \
          --args.poll-interval {{.POLL_INTERVAL}} \
          --args.max-steps {{.MAX_STEPS_BLUE_ONCE}} \
          --args.report-dir {{.REPORT_DIR}} \
          --args.once \
          --dn-args.server {{.DREADNODE_SERVER_URL}} \
          --dn-args.organization {{.DREADNODE_ORGANIZATION}} \
          --dn-args.workspace {{.DREADNODE_WORKSPACE}} \
          --dn-args.project {{.DREADNODE_PROJECT}} \
          2>&1 | tee -a "$LOGFILE"

  ares:investigate:
    desc: "Investigate a specific alert from JSON file (usage: task ares:investigate ALERT=alert.json)"
    silent: true
    vars:
      ALERT: '{{.ALERT | default ""}}'
    preconditions:
      - sh: test -n "{{.ALERT}}"
        msg: "ALERT variable is required. Usage: task ares:investigate ALERT=alert.json"
      - sh: test -f "{{.ALERT}}"
        msg: "Alert file not found: {{.ALERT}}"
    deps:
      - task: check-aws-auth
        vars:
          PROFILE: '{{.PROFILE | default "infrastructure"}}'
          REGION: '{{.REGION | default "us-west-2"}}'
    cmds:
      - |
        export ANTHROPIC_API_KEY=$(op item get "claude.ai" --fields dreadnode-api-key --reveal 2>/dev/null || echo "")
        export DREADNODE_API_KEY=$(op item get "Dreadnode Dev Platform" --fields api-key --reveal 2>/dev/null || echo "")
        export GRAFANA_SERVICE_ACCOUNT_TOKEN=$(op item get "Ares Grafana MCP" --fields grafana-token --reveal 2>/dev/null || echo "")
        export OPENAI_API_KEY=$(op item get "Openai" --fields dreadnode-api-key --reveal 2>/dev/null)
        MODEL_ARG="{{.MODEL}}"
        if [ -n "{{.MODEL_ALL}}" ]; then
          MODEL_ARG="{{.MODEL_ALL}}"
        fi

        uv run python -m ares investigate-alert {{.ALERT}} \
          --args.model "$MODEL_ARG" \
          --args.grafana-url {{.GRAFANA_URL}} \
          --args.max-steps {{.MAX_STEPS_BLUE_ONCE}} \
          --args.report-dir {{.REPORT_DIR}} \
          --dn-args.server {{.DREADNODE_SERVER_URL}} \
          --dn-args.token "$DREADNODE_API_KEY" \
          --dn-args.organization {{.DREADNODE_ORGANIZATION}} \
          --dn-args.workspace {{.DREADNODE_WORKSPACE}} \
          --dn-args.project {{.DREADNODE_PROJECT}}

  ares:config:check:
    desc: Check configuration and API key access
    silent: true
    cmds:
      - |
        echo "Checking Ares configuration..."
        echo ""
        echo "Environment:"
        echo "  Python: $(python --version)"
        echo "  uv: $(uv --version 2>/dev/null || echo 'not installed')"
        echo ""
        echo "Configuration:"
        echo "  Platform: {{.DREADNODE_SERVER_URL}}"
        echo "  Project: {{.DREADNODE_PROJECT}}"
        if [ -n "{{.MODEL_ALL}}" ]; then
          echo "  Model: {{.MODEL_ALL}}"
        else
          echo "  Model: {{.MODEL}}"
        fi
        echo "  Grafana: {{.GRAFANA_URL}}"
        echo "  Loki: {{.LOKI_URL}}"
        echo "  Prometheus: {{.PROMETHEUS_URL}}"
        echo ""
        echo "Checking 1Password CLI access..."

        # Check if op is installed
        if ! command -v op >/dev/null 2>&1; then
          echo "  ❌ 1Password CLI (op) not installed"
          echo ""
          echo "Install from: https://developer.1password.com/docs/cli/get-started/"
          exit 1
        fi

        echo "  ✅ 1Password CLI installed: $(op --version)"
        echo ""
        echo "Checking 1Password items..."

        # Check Dreadnode API key
        if op item get "Dreadnode Dev Platform" --fields api-key --reveal >/dev/null 2>&1; then
          echo "  ✅ Dreadnode API key accessible"
        else
          echo "  ❌ Dreadnode API key not found in 1Password"
          echo "     Item: 'Dreadnode Dev Platform'"
          echo "     Field: 'api-key'"
        fi

        # Check Grafana API key
        if op item get "Ares Grafana MCP" --fields grafana-token --reveal >/dev/null 2>&1; then
          echo "  ✅ Grafana API key accessible"
        else
          echo "  ⚠️  Grafana API key not found in 1Password"
          echo "     Item: 'Ares Grafana MCP'"
          echo "     Field: 'grafana-token'"
        fi

        # Check Anthropic API key
        if op item get "claude.ai" --fields dreadnode-api-key --reveal >/dev/null 2>&1; then
          echo "  ✅ Anthropic API key accessible"
        else
          echo "  ⚠️  Anthropic API key not found in 1Password"
          echo "     Item: 'claude.ai'"
          echo "     Field: 'dreadnode-api-key'"
        fi

        echo ""
        echo "Configuration check complete"

  ares:config:show:
    desc: Show current configuration (without secrets)
    silent: true
    cmds:
      - |
        echo "Ares Configuration:"
        echo "===================="
        echo "Platform Settings:"
        echo "  Server: {{.DREADNODE_SERVER_URL}}"
        echo "  Project: {{.DREADNODE_PROJECT}}"
        echo ""
        echo "Agent Settings:"
        echo "  Model: {{.MODEL}}"
        echo "  Max Steps (Blue): {{.MAX_STEPS_BLUE}}"
        echo "  Max Steps (Blue Once): {{.MAX_STEPS_BLUE_ONCE}}"
        echo "  Max Steps (Red): {{.MAX_STEPS_RED}}"
        echo "  Poll Interval: {{.POLL_INTERVAL}}s"
        echo ""
        echo "Data Sources:"
        echo "  Grafana: {{.GRAFANA_URL}}"
        echo "  Query Method: Grafana MCP (requires mcp-grafana binary)"
        echo ""
        echo "Output:"
        echo "  Reports: {{.REPORT_DIR}}"

  ares:reports:list:
    desc: List all investigation reports
    silent: true
    cmds:
      - |
        echo "Investigation Reports:"
        echo "======================"
        if [ -d {{.REPORT_DIR}} ]; then
          ls -lht {{.REPORT_DIR}}/*.md 2>/dev/null || echo "No reports found"
        else
          echo "Report directory not found: {{.REPORT_DIR}}"
        fi

  ares:reports:latest:
    desc: Show the latest investigation report
    silent: true
    cmds:
      - |
        LATEST=$(ls -t {{.REPORT_DIR}}/*.md 2>/dev/null | head -1)
        if [ -n "$LATEST" ]; then
          echo "Latest report: $LATEST"
          echo "===================="
          cat "$LATEST"
        else
          echo "No reports found in {{.REPORT_DIR}}"
        fi

  ares:reports:clean:
    desc: Remove all investigation reports
    silent: true
    cmds:
      - |
        read -p "Delete all reports in {{.REPORT_DIR}}? (y/N) " -n 1 -r
        echo
        if [[ $REPLY =~ ^[Yy]$ ]]; then
          rm -rf {{.REPORT_DIR}}/*.md
          echo "✅ Reports cleaned"
        fi

  # ===========================================================================
  # Ares Logs
  # ===========================================================================

  ares:logs:
    desc: "Tail remote logs (usage: task ares:logs [ROLE=recon|orchestrator] [LINES=100] [FOLLOW=true])"
    silent: true
    vars:
      ROLE: '{{.ROLE | default ""}}'
      FOLLOW: '{{.FOLLOW | default "true"}}'
      LINES: '{{.LINES | default "100"}}'
    cmds:
      - task: remote:logs
        vars:
          ROLE: '{{.ROLE}}'
          FOLLOW: '{{.FOLLOW}}'
          LINES: '{{.LINES}}'

  ares:version:
    desc: Show Ares version information
    silent: true
    cmds:
      - uv run python -c "import ares; print('Ares version:', ares.__version__)"

  ares:mitre:test:
    desc: Test MITRE ATT&CK data loading
    silent: true
    cmds:
      - |
        uv run python -c "
        import asyncio
        from ares.integrations.mitre import MITREAttackClient

        async def test():
            client = MITREAttackClient()
            await client.load()
            print(f'✅ Loaded {len(client._techniques)} techniques')
            print(f'✅ Loaded {len(client._tactics)} tactics')

            # Show a sample technique
            sample = list(client._techniques.values())[0]
            print(f'\nSample technique:')
            print(f'  ID: {sample.id}')
            print(f'  Name: {sample.name}')
            print(f'  Tactic: {sample.tactic}')

        asyncio.run(test())
        "

  ares:example:grafana-windows:
    desc: Show example Grafana MCP queries for Windows attack detection
    silent: true
    cmds:
      - python examples/grafana_mcp_windows_example.py

  # ===========================================================================
  # Ares Red Team Agent Tasks
  # ===========================================================================

  check-aws-auth:
    internal: true
    silent: true
    vars:
      PROFILE: '{{.PROFILE | default "lab"}}'
      REGION: '{{.REGION | default "us-west-1"}}'
    cmds:
      - |
        # Check if AWS CLI is installed
        if ! command -v aws >/dev/null 2>&1; then
          echo "❌ Error: AWS CLI is not installed"
          echo ""
          echo "The red team orchestration tasks require AWS CLI to access the infrastructure account."
          echo "Install it from: https://docs.aws.amazon.com/cli/latest/userguide/getting-started-install.html"
          exit 1
        fi

        # Check if credentials are configured and valid for the profile
        if ! aws sts get-caller-identity --profile "{{.PROFILE}}" --region "{{.REGION}}" >/dev/null 2>&1; then
          echo "❌ Error: AWS authentication failed for profile '{{.PROFILE}}'"
          echo ""
          echo "You need to authenticate to the infrastructure account before running this task."
          echo ""
          echo "Troubleshooting:"
          echo "  1. Verify your AWS credentials are configured: aws configure --profile {{.PROFILE}}"
          echo "  2. If using SSO, authenticate: aws sso login --profile {{.PROFILE}}"
          echo "  3. Check your profile exists: aws configure list --profile {{.PROFILE}}"
          echo "  4. Verify your credentials are not expired"
          exit 1
        fi

        # Success - show caller identity
        echo "✅ AWS authentication verified"
        aws sts get-caller-identity --profile "{{.PROFILE}}" --region "{{.REGION}}" --output table

  ares:red:
    desc: "Run red team agent against a target (usage: task ares:red TARGET=dreadgoad)"
    silent: true
    vars:
      TARGET: '{{.TARGET | default ""}}'
      PROFILE: '{{.PROFILE | default "lab"}}'
      REGION: '{{.REGION | default "us-west-1"}}'
      REDTEAM_PROJECT: '{{.REDTEAM_PROJECT | default "ares-redteam"}}'
    preconditions:
      - sh: test -n "{{.TARGET}}"
        msg: "TARGET variable is required. Usage: task ares:red TARGET=dreadgoad"
    cmds:
      - |
        export ANTHROPIC_API_KEY=$(op item get "claude.ai" --fields dreadnode-api-key --reveal 2>/dev/null || echo "")
        export DREADNODE_API_KEY=$(op item get "Dreadnode Dev Platform" --fields api-key --reveal 2>/dev/null || echo "")
        export GRAFANA_SERVICE_ACCOUNT_TOKEN=$(op item get "Ares Grafana MCP" --fields grafana-token --reveal 2>/dev/null || echo "")
        export OPENAI_API_KEY=$(op item get "Openai" --fields dreadnode-api-key --reveal 2>/dev/null)
        MODEL_ARG="{{.MODEL}}"
        if [ -n "{{.MODEL_ALL}}" ]; then
          MODEL_ARG="{{.MODEL_ALL}}"
        fi

        TARGET="{{.TARGET}}"

        # Check if TARGET is an IP address (simple regex check)
        if echo "$TARGET" | grep -qE '^[0-9]+\.[0-9]+\.[0-9]+\.[0-9]+$'; then
            echo "🎯 Using direct IP: $TARGET"
            RESOLVED_TARGET="$TARGET"
        else
            # Resolve TARGET via AWS EC2 Name tag filter
            echo "🔍 Resolving '$TARGET' via AWS EC2 Name tag filter..."

            RESOLVED_TARGET=$(aws ec2 describe-instances \
                --profile "{{.PROFILE}}" \
                --region "{{.REGION}}" \
                --filters "Name=instance-state-name,Values=running" \
                --query "Reservations[*].Instances[?contains(Tags[?Key==\`Name\`].Value|[0], \`$TARGET\`)].PrivateIpAddress" \
                --output text | tr '\t\n' ' ' | xargs)

            if [ -z "$RESOLVED_TARGET" ]; then
                echo "❌ No running EC2 instances found matching Name tag filter: $TARGET"
                exit 1
            fi

            TARGET_COUNT=$(echo "$RESOLVED_TARGET" | wc -w | xargs)
            echo "✅ Resolved $TARGET_COUNT target(s): $RESOLVED_TARGET"
        fi

        mkdir -p {{.LOG_DIR}}
