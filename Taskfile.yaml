  ares:red:multi:redis:list:
    desc: "List multi-agent Redis operations, statuses, and locks"
    silent: true
    vars:
      K8S_NAMESPACE: '{{.K8S_NAMESPACE | default "attack-simulation"}}'
    cmds:
      - |
        set -euo pipefail
        REDIS_POD=$(kubectl get pods -n {{.K8S_NAMESPACE}} -l app=redis -o name 2>/dev/null | head -1)
        if [ -z "$REDIS_POD" ]; then
          echo "❌ No Redis pod found in namespace {{.K8S_NAMESPACE}}"
          exit 1
        fi

        REDIS_PASS=$(kubectl get secret redis-secret -n {{.K8S_NAMESPACE}} -o jsonpath='{.data.password}' 2>/dev/null | base64 -d || echo "")
        REDIS_ENV=()
        if [ -n "$REDIS_PASS" ]; then
          REDIS_ENV=(env REDISCLI_AUTH="$REDIS_PASS")
        fi

        echo "📋 ares:operations queue (operation_ids):"
        queue=$(kubectl exec -n {{.K8S_NAMESPACE}} $REDIS_POD -- "${REDIS_ENV[@]}" redis-cli lrange ares:operations 0 -1)
        if [ -z "$queue" ]; then
          echo "  (empty)"
        else
          echo "$queue" | sed -n 's/.*"operation_id"[[:space:]]*:[[:space:]]*"\\([^"]*\\)".*/  \\1/p'
        fi

        echo ""
        echo "📌 operation status keys:"
        keys=$(kubectl exec -n {{.K8S_NAMESPACE}} $REDIS_POD -- "${REDIS_ENV[@]}" redis-cli --scan --pattern "ares:operations:*:status")
        if [ -z "$keys" ]; then
          echo "  (none)"
        else
          for key in $keys; do
            val=$(kubectl exec -n {{.K8S_NAMESPACE}} $REDIS_POD -- "${REDIS_ENV[@]}" redis-cli get "$key")
            echo "  $key -> $val"
          done
        fi

        echo ""
        echo "🔒 operation locks:"
        kubectl exec -n {{.K8S_NAMESPACE}} $REDIS_POD -- "${REDIS_ENV[@]}" redis-cli --scan --pattern "ares:lock:*" || true

