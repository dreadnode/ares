[project]
name = "ares"
version = "0.1.0"
description = "Autonomous SOC Investigation Agent"
authors = [{ name = "Dreadnode", email = "hello@dreadnode.io" }]
readme = "README.md"
license = { file = "LICENSE" }
requires-python = ">=3.10,<3.14"
classifiers = [
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "License :: OSI Approved :: Apache Software License",
    "Operating System :: OS Independent",
]

dependencies = [
    "dreadnode>=1.17.0",
    "cyclopts>=4.2.0",
    "loguru>=0.7.3",
    "httpx>=0.28.0,<1.0.0",
    "boto3>=1.42.25",
]

[project.optional-dependencies]
docs = [
    "mkdocs>=1.6.1",
    "mkdocs-material>=9.6.1",
    "mkdocs-section-index>=0.3.8",
    "mkdocstrings>=1.0.0",
    "mkdocstrings-python>=2.0.0",
    "pymdown-extensions>=10.8.1",
    "pygments>=2.18.0",
]

[dependency-groups]
dev = [
    "mypy>=1.8.0,<2.0.0",
    "ruff>=0.11.6,<1.0.0",
    "pre-commit>=4.0.0,<5.0.0",
    "pytest>=8.3.3",
    "pytest-asyncio>=0.24.0",
    "pytest-cov>=4.1.0",
    "types-requests>=2.32.0.20250306",
    "tomli>=2.0.0; python_version < '3.11'",
    "jinja2>=3.0.0",
]

[project.scripts]
ares = "ares.__main__:run"

[tool.poetry.plugins."pipx.run"]
ares = 'ares.__main__:run'

[project.urls]
Homepage = "https://github.com/dreadnode/ares"
Repository = "https://github.com/dreadnode/ares"
Documentation = "https://docs.dreadnode.io"

# Build

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/ares"]

[tool.hatch.build.targets.sdist]
include = ["/src", "/tests", "/docs", "/README.md", "/LICENSE"]

# Dev

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
python_files = ["test_*.py"]
addopts = ["--strict-markers", "--cov=ares", "--cov-report=term-missing"]
pythonpath = ["."]
markers = [
    "slow: marks tests as slow (deselect with '-m \"not slow\"')",
    "integration: marks tests as integration tests",
]

[tool.mypy]
strict = true
python_version = "3.10"
exclude = ["tests", ".hooks", "scripts"]

[[tool.mypy.overrides]]
module = ["ares.*"]
disable_error_code = [
    "unused-ignore",
    "import-untyped",
    "import-not-found",
    "type-arg",
    "no-untyped-def",
    "no-untyped-call",
    "no-any-return",
    "attr-defined",
    "call-arg",
    "list-item",
    "misc",
    "valid-type",
    "untyped-decorator",
]

[tool.pyright]
typeCheckingMode = "off" # we prefer mypy and don't want to deal with small differences

[tool.ty.environment]
python-version = "3.10"

[tool.ty.src]
exclude = [".hooks", "tests"]

[tool.bandit]
exclude_dirs = ["tests"]
skips = [
    "B101",  # assert_used
    "B603",  # subprocess_without_shell_equals_true (intentional for pentesting tools)
    "B404",  # import_subprocess (required for pentesting)
    "B110",  # try_except_pass (acceptable in cleanup code)
    "B107",  # hardcoded_password_default (false positives on empty string defaults)
]

[tool.coverage.run]
branch = true
source = ["src"]

[tool.coverage.report]
exclude_lines = [
    "pragma: no cover",
    "def __repr__",
    "if self.debug:",
    "raise NotImplementedError",
    "if __name__ == .__main__.:",
]

[tool.ruff]
target-version = "py310"
line-length = 100
extend-exclude = [
    "*.ipynb", # jupyter notebooks
]

[tool.ruff.lint]
select = ["ALL"]
ignore = [
    "E501",    # line too long (we make best effort)
    "TRY003",  # long messages in exception classes
    "EM",      # picky message construction for exceptions
    "C90",     # mccabe complexity
    "A002",    # shadowing built-in
    "D",       # docstrings
    "ANN",     # annotations (handled by mypy)
    "PLR0913", # too many arguments
    "ERA001",  # commented out code
    "FIX002",  # contains todo, consider fixing
    "COM812",  # disabled for formatting
    "ISC001",  # disabled for formatting
    "PLC0415", # import should be at the top of the file
    "TD003",   # missing issue link on todos
    "PLR2004", # magic values - too many false positives
    "S603",    # subprocess call without shell=True (intentional for airgap CLI tools)
    "S607",    # partial executable path (intentional for kubectl/zarf)
    "PERF401", # use list comprehension - many false positives when code is clearer as is
    "TRY300",  # consider moving to else block - often less readable
    "BLE001",  # blind exception catching - acceptable in top-level handlers
    "PLR0915", # too many statements - acceptable for main functions
    "G004",    # f-strings in logging - we use loguru, not stdlib logging
    "TRY400",  # logging.exception vs logging.error - we use loguru
    "PLR0911", # too many return statements - acceptable for tool methods
    "ARG001",  # unused function argument - tools API requires specific signatures
    "ARG002",  # unused method argument - tools API requires specific signatures
    "PLW0603", # global statement - acceptable for module-level caching
    "SLF001",  # private member access - intentional for internal APIs
    "SIM105",  # contextlib.suppress - style preference
    "S110",    # try-except-pass - acceptable in cleanup code
    "PTH108",  # os.unlink vs Path.unlink - compatibility
    "PTH110",  # os.path.exists vs Path.exists - compatibility
    "PTH123",  # open() vs Path.open() - style preference
    "RUF005",  # list concatenation - style preference
    "FBT001",  # boolean positional argument - acceptable for tool methods
    "FBT002",  # boolean default positional argument - acceptable for tool methods
]

[tool.ruff.format]
skip-magic-trailing-comma = false

[tool.ruff.lint.extend-per-file-ignores]
".hooks/**/*.py" = [
    "ARG001",  # temporary for rigging decorators
    "T201",    # printing is fine for hooks
    "BLE001",  # blind exception catching is fine for hooks
    "TRY301",  # abstract raise is fine for hooks
]
"tests/**/*.py" = [
    "INP001",  # namespace not required for pytest
    "SLF001",  # allow access to private members
    "PLR2004", # magic values
    "S1",      # security issues in tests are not relevant
    "PERF",    # performance issues in tests are not relevant
    "T201",    # printing is fine for tests
    "DTZ003",  # datetime without tz is fine for tests
    "PLR0915", # too many statements is fine for tests
    "PTH123",  # open() vs Path.open() is fine for tests
    "PTH109",  # os.getcwd() vs Path.cwd() is fine for tests
]
"scripts/**/*.py" = [
    "T201",    # printing is fine for scripts
    "S602",    # subprocess shell=True is fine for scripts (we have # nosec)
    "PTH123",  # open() vs Path.open() is fine for scripts
    "RUF059",  # unused unpacked variables is fine
]
"examples/**/*.py" = [
    "T201",    # printing is fine for examples
    "DTZ003",  # datetime without tz is fine for examples
]
