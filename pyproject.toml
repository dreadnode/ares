[project]
name = "ares"
version = "0.1.0"
description = "Autonomous SOC Investigation Agent"
authors = [{ name = "Dreadnode", email = "hello@dreadnode.io" }]
readme = "README.md"
license = { file = "LICENSE" }
requires-python = ">=3.11,<3.14"
classifiers = [
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "License :: OSI Approved :: Apache Software License",
    "Operating System :: OS Independent",
]

dependencies = [
    "dreadnode>=1.17.0",
    "cyclopts>=4.2.0",
    "loguru>=0.7.3",
    "httpx>=0.28.0,<1.0.0",
    "boto3>=1.42.25",
    "importlib_resources>=5.0.0; python_version < '3.11'",
    "redis (>=7.1.0,<8.0.0)",
    "kubernetes>=29.0.0",
    "tenacity>=8.2.0",
    "sentence-transformers>=2.2.0",
]

[project.optional-dependencies]
docs = [
    "mkdocs>=1.6.1",
    "mkdocs-material>=9.6.1",
    "mkdocs-section-index>=0.3.8",
    "mkdocstrings>=1.0.0",
    "mkdocstrings-python>=2.0.0",
    "pymdown-extensions>=10.8.1",
    "pygments>=2.18.0",
]

[dependency-groups]
dev = [
    "mypy>=1.8.0,<2.0.0",
    "ruff>=0.11.6,<1.0.0",
    "pre-commit>=4.0.0,<5.0.0",
    "pytest>=8.3.3",
    "pytest-asyncio>=0.24.0",
    "pytest-cov>=4.1.0",
    "types-requests>=2.32.0.20250306",
    "tomli>=2.0.0; python_version < '3.11'",
    "jinja2>=3.0.0",
    "pytest-mock (>=3.15.1,<4.0.0)",
    "pytest-xdist (>=3.8.0,<4.0.0)",
]

[project.scripts]
ares = "ares.__main__:run"
ares-ops = "ares.cli_ops:main"
ares-blue-ops = "ares.cli_blue_ops:main"

[tool.poetry.plugins."pipx.run"]
ares = 'ares.__main__:run'

[project.urls]
Homepage = "https://github.com/dreadnode/ares"
Repository = "https://github.com/dreadnode/ares"
Documentation = "https://docs.dreadnode.io"

# Build

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.metadata]
allow-direct-references = true

[tool.hatch.build.targets.wheel]
packages = ["src/ares"]

# Include template files (jinja, yaml, md) in the wheel
[tool.hatch.build.targets.wheel.sources]
"src" = ""

[tool.hatch.build]
include = [
    "src/ares/**/*.py",
    "src/ares/**/*.jinja",
    "src/ares/**/*.yaml",
    "src/ares/**/*.yml",
    "src/ares/**/*.md",
    "src/ares/**/*.j2",
]

[tool.hatch.build.targets.sdist]
include = ["/src", "/tests", "/docs", "/README.md", "/LICENSE"]

# Dev

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
python_files = ["test_*.py"]
addopts = ["--strict-markers", "--cov=ares", "--cov-report=term-missing"]
pythonpath = ["."]
markers = [
    "slow: marks tests as slow (deselect with '-m \"not slow\"')",
    "integration: marks tests as integration tests",
]

[tool.mypy]
strict = true
python_version = "3.11"
exclude = ["tests", ".hooks", "scripts"]

[[tool.mypy.overrides]]
module = ["ares.*"]
# Disabled error codes are grouped by reason:
#
# External library compatibility (keep disabled):
#   - import-untyped: Third-party libs without type stubs (boto3, kubernetes, etc.)
#   - import-not-found: Optional dependencies not always installed
#   - untyped-decorator: External decorators without type info (rigging, etc.)
#
# Dynamic patterns in agent/tool code (keep disabled for now):
#   - attr-defined: Dynamic attribute access on state objects and tool responses
#   - call-arg: Variable kwargs passed to LLM/tool APIs
#   - misc: Catch-all for edge cases in dynamic code
#   - valid-type: Complex type aliases with generics
#
# Incremental strictness (TODO: enable progressively):
#   - type-arg: Missing generic type arguments (list vs list[str])
#   - no-untyped-def: Functions missing return type annotations
#   - no-untyped-call: Calls to untyped functions
#   - no-any-return: Functions returning Any
#   - list-item: List contains incompatible types
#   - unused-ignore: Unused # type: ignore comments (enable after cleanup)
disable_error_code = [
    # External library compatibility
    "import-untyped",
    "import-not-found",
    "untyped-decorator",
    # Dynamic patterns in agent/tool code
    "attr-defined",
    "call-arg",
    "misc",
    "valid-type",
    # Incremental strictness (enable progressively)
    "type-arg",
    "no-untyped-def",
    "no-untyped-call",
    "no-any-return",
    "list-item",
    "unused-ignore",
]

[tool.pyright]
typeCheckingMode = "off" # we prefer mypy and don't want to deal with small differences

[tool.ty.environment]
python-version = "3.11"

[tool.ty.src]
exclude = [".hooks", "tests"]

[tool.bandit]
exclude_dirs = ["tests"]
skips = [
    "B101",  # assert_used
    "B603",  # subprocess_without_shell_equals_true (intentional for pentesting tools)
    "B404",  # import_subprocess (required for pentesting)
    "B110",  # try_except_pass (acceptable in cleanup code)
    "B107",  # hardcoded_password_default (false positives on empty string defaults)
]

[tool.coverage.run]
branch = true
source = ["src"]

[tool.coverage.report]
exclude_lines = [
    "pragma: no cover",
    "def __repr__",
    "if self.debug:",
    "raise NotImplementedError",
    "if __name__ == .__main__.:",
]

[tool.ruff]
target-version = "py310"
line-length = 100
extend-exclude = [
    "*.ipynb", # jupyter notebooks
]

[tool.ruff.lint]
select = ["ALL"]
ignore = [
    "E501",    # we make best effort on line length
    "TRY003",
    "EM",
    "C90",
    "A002",
    "D",
    "ANN",     # handled by mypy
    "PLR0913",
    "ERA001",
    "FIX002",
    "COM812",  # disabled for formatting
    "ISC001",  # disabled for formatting
    "PLC0415",
    "TD003",
    "PLR2004", # too many false positives
    "S603",    # intentional for airgap CLI tools
    "S607",    # intentional for kubectl/zarf
    "PERF401", # many false positives when code is clearer
    "TRY300",  # often less readable
    "TRY301",  # style preference
    "BLE001",  # acceptable in top-level handlers
    "PT017",   # valid test pattern
    "PLR0915", # acceptable for main functions
    "PLR0912", # acceptable for complex workflow/parsing functions
    "PERF203", # try/except in loops is intentional for async error handling
    "G004",    # we use loguru, not stdlib logging
    "TRY400",  # we use loguru
    "PLR0911", # acceptable for tool methods
    "ARG001",  # tools API requires specific signatures
    "ARG002",  # tools API requires specific signatures
    "PLW0603", # acceptable for module-level caching
    "SLF001",  # intentional for internal APIs
    "SIM105",  # style preference
    "S110",    # acceptable in cleanup code
    "ASYNC240", # sync path ops are fine in our async functions (startup, cleanup)
    "PTH108",  # style preference
    "PTH110",  # style preference
    "PTH123",  # style preference
    "RUF005",  # style preference
    "FBT001",  # acceptable for tool methods
    "FBT002",  # acceptable for tool methods
]

[tool.ruff.format]
skip-magic-trailing-comma = false

[tool.ruff.lint.extend-per-file-ignores]
".hooks/**/*.py" = [
    "ARG001",  # temporary for rigging decorators
    "T201",    # printing is fine for hooks
    "BLE001",  # blind exception catching is fine for hooks
    "TRY301",  # abstract raise is fine for hooks
]
"tests/**/*.py" = [
    "INP001",  # namespace not required for pytest
    "SLF001",  # allow access to private members
    "PLR2004", # magic values
    "S1",      # security issues in tests are not relevant
    "PERF",    # performance issues in tests are not relevant
    "T201",    # printing is fine for tests
    "DTZ003",  # datetime without tz is fine for tests
    "PLR0915", # too many statements is fine for tests
    "PTH123",  # open() vs Path.open() is fine for tests
    "PTH109",  # os.getcwd() vs Path.cwd() is fine for tests
]
"scripts/**/*.py" = [
    "T201",    # printing is fine for scripts
    "S602",    # subprocess shell=True is fine for scripts (we have # nosec)
    "PTH123",  # open() vs Path.open() is fine for scripts
    "RUF059",  # unused unpacked variables is fine
]
"examples/**/*.py" = [
    "T201",    # printing is fine for examples
    "DTZ003",  # datetime without tz is fine for examples
]
"src/ares/cli_ops.py" = [
    "T201",    # printing is fine for CLI commands
    "PLR0912", # too many branches is acceptable for CLI command functions
]
"src/ares/cli_blue_ops.py" = [
    "T201",    # printing is fine for CLI commands
    "PLR0912", # too many branches is acceptable for CLI command functions
]
"src/ares/main.py" = [
    "T201",    # printing is intentional for CI JSON output
]
"src/ares/eval/*.py" = [
    "PLR0912", # complex evaluation functions have many branches by nature
]
