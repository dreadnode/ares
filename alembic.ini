# Alembic configuration for Ares persistent store

[alembic]
# Path to migration scripts
script_location = alembic

# Template used to generate migration files
file_template = %%(year)d%%(month).2d%%(day).2d_%%(hour).2d%%(minute).2d%%(second).2d_%%(rev)s_%%(slug)s

# sys.path prepend for PYTHONPATH
prepend_sys_path = .

# Timezone for revision timestamps
# timezone =

# Max length of revision ID
truncate_slug_length = 40

# Set to 'true' to run the environment during
# the 'revision' command, regardless of autogenerate
# revision_environment = false

# Set to 'true' to allow .pyc and .pyo files without a source .py file to be detected as revisions
# sourceless = false

# Version path separator
# version_path_separator = os  # default: use os.pathsep

# Set to 'true' to search source files recursively in each "version_locations" directory
# recursive_version_locations = false

# Output encoding used when revision files are written from script.py.mako
output_encoding = utf-8

# Database URL (overridden by env var in env.py)
sqlalchemy.url = driver://user:pass@localhost/dbname  # pragma: allowlist secret

[post_write_hooks]
# Format with ruff after writing migration
hooks = ruff
ruff.type = console_scripts
ruff.entrypoint = ruff
ruff.options = format REVISION_SCRIPT_FILENAME

# Logging configuration
[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARN
handlers = console
qualname =

[logger_sqlalchemy]
level = WARN
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
