[package]
name = "ares-llm"
version = "0.1.0"
edition = "2021"
description = "Model-agnostic LLM provider, prompt builder, and agent loop for Ares"

[dependencies]
ares-core = { path = "../ares-core" }
serde = { workspace = true }
serde_json = { workspace = true }
tokio = { workspace = true }
chrono = { workspace = true }
tracing = { workspace = true }
anyhow = { workspace = true }
uuid = { workspace = true }
tera = { workspace = true }
once_cell = { workspace = true }
regex = { workspace = true }
reqwest = { version = "0.12", features = ["json"] }
async-trait = "0.1"

[dev-dependencies]
tokio = { workspace = true }
serde_json = { workspace = true }
async-trait = "0.1"
