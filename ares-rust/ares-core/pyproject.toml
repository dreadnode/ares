[build-system]
requires = ["maturin>=1.7,<2.0"]
build-backend = "maturin"

[project]
name = "ares-core"
version = "0.1.0"
description = "Rust-native core library for the Ares red team orchestration system"
requires-python = ">=3.11"
authors = [{ name = "Dreadnode", email = "hello@dreadnode.io" }]

[tool.maturin]
features = ["python", "extension-module"]
module-name = "ares_core"
manifest-path = "Cargo.toml"
strip = false
