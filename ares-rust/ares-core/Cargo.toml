[package]
name = "ares-core"
version = "0.1.0"
edition = "2021"
description = "Core library for the Ares red team orchestration system"

[dependencies]
serde = { workspace = true }
serde_json = { workspace = true }
tokio = { workspace = true }
redis = { workspace = true }
chrono = { workspace = true }
tracing = { workspace = true }
uuid = { workspace = true }
thiserror = { workspace = true }
anyhow = { workspace = true }
serde_yaml = { workspace = true }
regex = { workspace = true }
once_cell = { workspace = true }
md-5 = "0.10"
base64 = "0.22"
tera = { workspace = true }
pyo3 = { workspace = true, optional = true }

# OpenTelemetry (behind "telemetry" feature)
opentelemetry = { workspace = true, optional = true }
opentelemetry_sdk = { workspace = true, optional = true }
opentelemetry-otlp = { workspace = true, optional = true }
tracing-opentelemetry = { workspace = true, optional = true }
tracing-subscriber = { workspace = true, optional = true }

[dev-dependencies]
tempfile = "3"

[lib]
crate-type = ["lib", "cdylib"]

[features]
default = []
python = ["pyo3"]
telemetry = [
    "opentelemetry",
    "opentelemetry_sdk",
    "opentelemetry-otlp",
    "tracing-opentelemetry",
    "tracing-subscriber",
]
# Only enable extension-module when building the cdylib Python extension (.so).
# Do NOT enable this for binaries that embed Python (orchestrator, worker) —
# extension-module disables linking against libpython, which breaks Rust→Python calls.
extension-module = ["pyo3/extension-module"]
