[package]
name = "ares-orchestrator"
version = "0.1.0"
edition = "2021"
description = "Rust-native orchestration loop for the Ares red team system"

[[bin]]
name = "ares-orchestrator"
path = "src/main.rs"

[dependencies]
ares-core = { path = "../ares-core" }
serde = { workspace = true }
serde_json = { workspace = true }
tokio = { workspace = true }
redis = { workspace = true }
chrono = { workspace = true }
tracing = { workspace = true }
tracing-subscriber = { workspace = true }
anyhow = { workspace = true }
uuid = { workspace = true }

[dev-dependencies]
tokio = { workspace = true }

[features]
default = []
python = ["ares-core/python"]
