---
- hosts: localhost
  connection: local
  gather_facts: true
  become: true
  tasks:
    - name: Confirm ansible bootstrap reached the target
      ansible.builtin.copy:
        dest: /etc/ares-ansible-stamp
        mode: '0644'
        content: |
          ansible_bootstrap_ok=true
          host={{ ansible_hostname }}
          os_family={{ ansible_os_family }}
          distribution={{ ansible_distribution }} {{ ansible_distribution_version }}

    - name: Install a representative red-team CLI tool (nmap)
      ansible.builtin.apt:
        name:
          - nmap
          - tcpdump
          - net-tools
        state: present
        update_cache: true
