---
# Remote development tasks - sync code to running K8s pods
version: "3"

vars:
  INFO: '\033[0;34m[INFO]\033[0m'
  SUCCESS: '\033[0;32m[SUCCESS]\033[0m'
  ERROR: '\033[0;31m[ERROR]\033[0m'
  WARN: '\033[1;33m[WARN]\033[0m'
  # Defaults
  NAMESPACE: '{{.NAMESPACE | default "attack-simulation"}}'
  ORCH_CONTAINER: '{{.ORCH_CONTAINER | default "orchestrator"}}'
  WORKER_CONTAINER: '{{.WORKER_CONTAINER | default ""}}'
  PARALLELISM: '{{.PARALLELISM | default "10"}}'
  PVC_PATH: '/ares'
  VERIFY_PVC_DIFF: '{{.VERIFY_PVC_DIFF | default "true"}}'

tasks:
  # ============================================================================
  # HOT RELOAD: Watch and Sync
  # ============================================================================
  hot:
    desc: "Watch for code changes and auto-sync to pods"
    silent: true
    vars:
      WATCH_DIR: '{{.WATCH_DIR | default "src/ares"}}'
    preconditions:
      - sh: command -v fswatch >/dev/null 2>&1
        msg: "fswatch is required. Install with: brew install fswatch"
      - sh: command -v kubectl >/dev/null 2>&1
        msg: "kubectl is required"
    cmds:
      - |
        echo -e "{{.INFO}} Validating environment..."

        # Check kubectl connectivity
        if ! kubectl cluster-info &> /dev/null; then
          echo -e "{{.ERROR}} Cannot connect to Kubernetes cluster"
          exit 1
        fi

        # Check if ares pods exist
        POD_COUNT=$(kubectl get pods -n {{.NAMESPACE}} \
          -l ares.dreadnode.io/component=red-team \
          --field-selector=status.phase=Running \
          -o json 2>/dev/null | jq '.items | length')

        if [ "$POD_COUNT" = "0" ] || [ -z "$POD_COUNT" ]; then
          echo -e "{{.ERROR}} No running ares pods found in namespace {{.NAMESPACE}}"
          echo -e "{{.INFO}} Check with: kubectl get pods -n {{.NAMESPACE}}"
          exit 1
        fi

        echo -e "{{.SUCCESS}} Found $POD_COUNT running agent pod(s)"

      - |
        echo ""
        echo -e "{{.INFO}} Starting hot-reload development"
        echo -e "{{.INFO}} Namespace: {{.NAMESPACE}}"
        echo -e "{{.INFO}} Watching: {{.WATCH_DIR}}/**/*.py"
        echo ""
        echo -e "{{.SUCCESS}} File sync active! Edit files and save to trigger sync."
        echo -e "{{.INFO}} Press Ctrl+C to stop"
        echo ""

        # Watch for changes and sync
        fswatch -r -e ".*" -i "\\.py$" "{{.WATCH_DIR}}" | while read -r changed_file; do
          # Extract relative path from src/ares/
          relative_path="${changed_file#*src/ares/}"

          echo -e "{{.INFO}} [$(date +%H:%M:%S)] Detected: $relative_path"

          # Get all running pods and sync to each
          PODS=$(kubectl get pods -n {{.NAMESPACE}} \
            -l ares.dreadnode.io/component=red-team \
            --field-selector=status.phase=Running \
            -o json | jq -r '.items[] | select(.metadata.labels["ares.dreadnode.io/role"] != "atomic") | .metadata.name' | tr '\n' ' ')

          # Also get orchestrator
          ORCH_POD=$(kubectl get pods -n {{.NAMESPACE}} \
            -l app.kubernetes.io/name=ares-orchestrator \
            --field-selector=status.phase=Running \
            -o jsonpath='{.items[0].metadata.name}' 2>/dev/null || true)

          # Sync to worker pods (PVC only - PYTHONPATH=/ares/src handles imports)
          if [ -n "$PODS" ]; then
            printf '%s\n' $PODS | xargs -n1 -P {{.PARALLELISM}} -I{} bash -c '
              pod="$1"
              file="$2"
              rel="$3"
              verify="{{.VERIFY_PVC_DIFF}}"
              worker_container="{{.WORKER_CONTAINER}}"
              if [ -z "$worker_container" ]; then
                worker_container=$(kubectl get pod -n {{.NAMESPACE}} "$pod" \
                  -o jsonpath="{.spec.containers[0].name}" 2>/dev/null)
              fi
              if [ -n "$worker_container" ]; then
                container_flag=(-c "$worker_container")
              else
                container_flag=()
              fi
              if kubectl cp "$file" "$pod:{{.PVC_PATH}}/src/ares/$rel" \
                  -n {{.NAMESPACE}} "${container_flag[@]}" 2>/dev/null; then
                echo -e "{{.SUCCESS}}   -> $pod"
              elif kubectl cp "$file" "$pod:{{.PVC_PATH}}/src/ares/$rel" \
                  -n {{.NAMESPACE}} 2>/dev/null; then
                echo -e "{{.SUCCESS}}   -> $pod"
              else
                echo -e "{{.WARN}}   x $pod (failed)"
              fi
              if [ "$verify" = "true" ]; then
                local_hash=$(shasum -a 256 "$file" 2>/dev/null | awk "{print \$1}")
                remote_hash=$(kubectl exec -n {{.NAMESPACE}} "${container_flag[@]}" "$pod" -- \
                  sha256sum "/ares/src/ares/$rel" 2>/dev/null | awk "{print \$1}")
                if [ -z "$remote_hash" ]; then
                  remote_hash="MISSING"
                fi
                if [ "$remote_hash" = "__ERR__" ] || [ "$local_hash" = "__ERR__" ]; then
                  echo -e "{{.WARN}}   x $pod (pvc-verify failed)"
                elif [ "$remote_hash" = "MISSING" ]; then
                  echo -e "{{.WARN}}   x $pod (pvc missing)"
                elif [ "$remote_hash" = "$local_hash" ]; then
                  echo -e "{{.SUCCESS}}   -> $pod (pvc verified)"
                else
                  echo -e "{{.WARN}}   x $pod (pvc differs)"
                fi
              fi
              exit 0
            ' _ {} "$changed_file" "$relative_path"
          fi

          # Sync to orchestrator (PVC only)
          if [ -n "$ORCH_POD" ]; then
            if kubectl cp "$changed_file" "$ORCH_POD:{{.PVC_PATH}}/src/ares/$relative_path" \
                -n {{.NAMESPACE}} -c {{.ORCH_CONTAINER}} 2>/dev/null; then
              echo -e "{{.SUCCESS}}   -> $ORCH_POD"
            else
              echo -e "{{.WARN}}   x $ORCH_POD (failed)"
            fi
            if [ "{{.VERIFY_PVC_DIFF}}" = "true" ]; then
              local_hash=$(shasum -a 256 "$changed_file" 2>/dev/null | awk "{print \$1}")
              remote_hash=$(kubectl exec -n {{.NAMESPACE}} -c {{.ORCH_CONTAINER}} "$ORCH_POD" -- \
                sha256sum "/ares/src/ares/$relative_path" 2>/dev/null | awk "{print \$1}")
              if [ -z "$remote_hash" ]; then
                remote_hash="MISSING"
              fi
              if [ "$remote_hash" = "__ERR__" ] || [ "$local_hash" = "__ERR__" ]; then
                echo -e "{{.WARN}}   x $ORCH_POD (pvc-verify failed)"
              elif [ "$remote_hash" = "MISSING" ]; then
                echo -e "{{.WARN}}   x $ORCH_POD (pvc missing)"
              elif [ "$remote_hash" = "$local_hash" ]; then
                echo -e "{{.SUCCESS}}   -> $ORCH_POD (pvc verified)"
              else
                echo -e "{{.WARN}}   x $ORCH_POD (pvc differs)"
              fi
            fi
          fi
          echo ""
        done

  # ============================================================================
  # SYNC: Copy files to pods
  # ============================================================================
  sync:
    desc: "Sync local code to pods (usage: task remote:sync [FILES=src/ares/core/worker.py])"
    silent: true
    vars:
      FILES: '{{.FILES | default ""}}'
    cmds:
      - |
        echo -e "{{.INFO}} Syncing code to pods in {{.NAMESPACE}}"

        # Get orchestrator pod first (so we can exclude it from workers)
        ORCH_POD=$(kubectl get pods -n {{.NAMESPACE}} \
          -l app.kubernetes.io/name=ares-orchestrator \
          --field-selector=status.phase=Running \
          -o jsonpath='{.items[0].metadata.name}' 2>/dev/null || true)

        # Get worker pods, excluding atomic role and orchestrator (orchestrator synced separately below)
        PODS=$(kubectl get pods -n {{.NAMESPACE}} \
          -l ares.dreadnode.io/component=red-team \
          --field-selector=status.phase=Running \
          -o json | jq -r --arg orch "$ORCH_POD" '.items[] | select(.metadata.labels["ares.dreadnode.io/role"] != "atomic") | select(.metadata.name != $orch) | .metadata.name' | tr '\n' ' ')

        if [ -z "$PODS" ] && [ -z "$ORCH_POD" ]; then
          echo -e "{{.ERROR}} No running pods found"
          exit 1
        fi

        # Determine files to sync
        if [ -n "{{.FILES}}" ]; then
          FILES_TO_SYNC="{{.FILES}}"
        else
          # Default: sync all ares source files
          FILES_TO_SYNC=$(find src/ares -name "*.py" -type f)
        fi

        for f in $FILES_TO_SYNC; do
          if [ ! -f "$f" ]; then
            echo -e "{{.WARN}} Skipping (not found): $f"
            continue
          fi

          relative_path="${f#src/ares/}"
          echo -e "{{.INFO}} $relative_path"

          # Sync to worker pods (PVC only - PYTHONPATH=/ares/src handles imports)
          if [ -n "$PODS" ]; then
            printf '%s\n' $PODS | xargs -n1 -P {{.PARALLELISM}} -I{} bash -c '
              pod="$1"
              file="$2"
              rel="$3"
              verify="{{.VERIFY_PVC_DIFF}}"
              worker_container="{{.WORKER_CONTAINER}}"
              if [ -z "$worker_container" ]; then
                worker_container=$(kubectl get pod -n {{.NAMESPACE}} "$pod" \
                  -o jsonpath="{.spec.containers[0].name}" 2>/dev/null)
              fi
              if [ -n "$worker_container" ]; then
                container_flag=(-c "$worker_container")
              else
                container_flag=()
              fi
              if kubectl cp "$file" "$pod:{{.PVC_PATH}}/src/ares/$rel" \
                  -n {{.NAMESPACE}} "${container_flag[@]}" 2>/dev/null; then
                echo -e "{{.SUCCESS}}   -> $pod"
              elif kubectl cp "$file" "$pod:{{.PVC_PATH}}/src/ares/$rel" \
                  -n {{.NAMESPACE}} 2>/dev/null; then
                echo -e "{{.SUCCESS}}   -> $pod"
              else
                echo -e "{{.WARN}}   x $pod"
              fi
              if [ "$verify" = "true" ]; then
                local_hash=$(shasum -a 256 "$file" 2>/dev/null | awk "{print \$1}")
                remote_hash=$(kubectl exec -n {{.NAMESPACE}} "${container_flag[@]}" "$pod" -- \
                  sha256sum "/ares/src/ares/$rel" 2>/dev/null | awk "{print \$1}")
                if [ -z "$remote_hash" ]; then
                  remote_hash="MISSING"
                fi
                if [ "$remote_hash" = "__ERR__" ] || [ "$local_hash" = "__ERR__" ]; then
                  echo -e "{{.WARN}}   x $pod (pvc-verify failed)"
                elif [ "$remote_hash" = "MISSING" ]; then
                  echo -e "{{.WARN}}   x $pod (pvc missing)"
                elif [ "$remote_hash" = "$local_hash" ]; then
                  echo -e "{{.SUCCESS}}   -> $pod (pvc verified)"
                else
                  echo -e "{{.WARN}}   x $pod (pvc differs)"
                fi
              fi
              exit 0
            ' _ {} "$f" "$relative_path"
          fi

          # Sync to orchestrator (PVC only)
          if [ -n "$ORCH_POD" ]; then
            if kubectl cp "$f" "$ORCH_POD:{{.PVC_PATH}}/src/ares/$relative_path" \
                -n {{.NAMESPACE}} -c {{.ORCH_CONTAINER}} 2>/dev/null; then
              echo -e "{{.SUCCESS}}   -> $ORCH_POD"
            else
              echo -e "{{.WARN}}   x $ORCH_POD"
            fi
            if [ "{{.VERIFY_PVC_DIFF}}" = "true" ]; then
              local_hash=$(shasum -a 256 "$f" 2>/dev/null | awk "{print \$1}")
              remote_hash=$(kubectl exec -n {{.NAMESPACE}} -c {{.ORCH_CONTAINER}} "$ORCH_POD" -- \
                sha256sum "/ares/src/ares/$relative_path" 2>/dev/null | awk "{print \$1}")
              if [ -z "$remote_hash" ]; then
                remote_hash="MISSING"
              fi
              if [ "$remote_hash" = "__ERR__" ] || [ "$local_hash" = "__ERR__" ]; then
                echo -e "{{.WARN}}   x $ORCH_POD (pvc-verify failed)"
              elif [ "$remote_hash" = "MISSING" ]; then
                echo -e "{{.WARN}}   x $ORCH_POD (pvc missing)"
              elif [ "$remote_hash" = "$local_hash" ]; then
                echo -e "{{.SUCCESS}}   -> $ORCH_POD (pvc verified)"
              else
                echo -e "{{.WARN}}   x $ORCH_POD (pvc differs)"
              fi
            fi
          fi
        done

        echo ""
        echo -e "{{.SUCCESS}} Sync complete"

  # ============================================================================
  # SYNC:FULL: Copy full src/ares tree to pods
  # ============================================================================
  sync:full:
    desc: "Sync full src/ares tree to pods"
    silent: true
    cmds:
      - |
        echo -e "{{.INFO}} Full sync to pods in {{.NAMESPACE}}"

        # Get orchestrator pod first (so we can exclude it from workers)
        ORCH_POD=$(kubectl get pods -n {{.NAMESPACE}} \
          -l app.kubernetes.io/name=ares-orchestrator \
          --field-selector=status.phase=Running \
          -o jsonpath='{.items[0].metadata.name}' 2>/dev/null || true)

        # Get worker pods, excluding atomic role and orchestrator (orchestrator synced separately below)
        PODS=$(kubectl get pods -n {{.NAMESPACE}} \
          -l ares.dreadnode.io/component=red-team \
          --field-selector=status.phase=Running \
          -o json | jq -r --arg orch "$ORCH_POD" '.items[] | select(.metadata.labels["ares.dreadnode.io/role"] != "atomic") | select(.metadata.name != $orch) | .metadata.name' | tr '\n' ' ')

        if [ -z "$PODS" ] && [ -z "$ORCH_POD" ]; then
          echo -e "{{.ERROR}} No running pods found"
          exit 1
        fi

        # Sync to worker pods
        if [ -n "$PODS" ]; then
          printf '%s\n' $PODS | xargs -n1 -P {{.PARALLELISM}} -I{} bash -c '
            pod="$1"
            worker_container="{{.WORKER_CONTAINER}}"
            if [ -z "$worker_container" ]; then
              worker_container=$(kubectl get pod -n {{.NAMESPACE}} "$pod" \
                -o jsonpath="{.spec.containers[0].name}" 2>/dev/null)
            fi
            if [ -n "$worker_container" ]; then
              container_flag=(-c "$worker_container")
            else
              container_flag=()
            fi
            if kubectl exec -n {{.NAMESPACE}} "${container_flag[@]}" "$pod" -- \
                mkdir -p {{.PVC_PATH}}/src/ares 2>/dev/null && \
              kubectl cp src/ares "$pod":{{.PVC_PATH}}/src/ares \
                -n {{.NAMESPACE}} "${container_flag[@]}" 2>/dev/null; then
              echo -e "{{.SUCCESS}}   -> $pod"
            elif kubectl cp src/ares "$pod":{{.PVC_PATH}}/src/ares \
                -n {{.NAMESPACE}} 2>/dev/null; then
              echo -e "{{.SUCCESS}}   -> $pod"
            else
              echo -e "{{.WARN}}   x $pod"
            fi
            exit 0
          ' _ {}
        fi

        # Sync to orchestrator
        if [ -n "$ORCH_POD" ]; then
          if kubectl exec -n {{.NAMESPACE}} -c {{.ORCH_CONTAINER}} "$ORCH_POD" -- \
              mkdir -p {{.PVC_PATH}}/src/ares 2>/dev/null && \
            kubectl cp src/ares "$ORCH_POD":{{.PVC_PATH}}/src/ares \
              -n {{.NAMESPACE}} -c {{.ORCH_CONTAINER}} 2>/dev/null; then
            echo -e "{{.SUCCESS}}   -> $ORCH_POD"
          else
            echo -e "{{.WARN}}   x $ORCH_POD"
          fi
        fi

        echo ""
        echo -e "{{.SUCCESS}} Full sync complete"

  # ============================================================================
  # SYNC:BRANCH: Sync only files changed on current branch
  # ============================================================================
  sync:branch:
    desc: "Sync only files changed on current branch (vs main)"
    silent: true
    vars:
      BASE_BRANCH: '{{.BASE_BRANCH | default "main"}}'
      CHANGED_FILES:
        sh: |
          # Get changed Python files in src/ares
          CHANGED=$(git diff --name-only {{.BASE_BRANCH}}...HEAD -- 'src/ares/*.py' 'src/ares/**/*.py' 2>/dev/null | grep -E '\.py$' || true)
          # Also include uncommitted changes (staged + unstaged)
          UNCOMMITTED=$(git diff --name-only HEAD -- 'src/ares/*.py' 'src/ares/**/*.py' 2>/dev/null | grep -E '\.py$' || true)
          STAGED=$(git diff --name-only --cached -- 'src/ares/*.py' 'src/ares/**/*.py' 2>/dev/null | grep -E '\.py$' || true)
          # Combine and dedupe
          echo -e "$CHANGED\n$UNCOMMITTED\n$STAGED" | grep -v '^$' | sort -u | tr '\n' ' ' | xargs
    preconditions:
      - sh: '[ -n "{{.CHANGED_FILES}}" ]'
        msg: "No Python files changed in src/ares/ on this branch"
    cmds:
      - cmd: |
          FILE_COUNT=$(echo "{{.CHANGED_FILES}}" | wc -w | tr -d ' ')
          echo -e "{{.INFO}} Finding files changed on branch vs {{.BASE_BRANCH}}..."
          echo -e "{{.SUCCESS}} Found $FILE_COUNT changed file(s)"
          echo ""
        silent: true
      - for: {var: CHANGED_FILES, split: ' '}
        task: _sync-file
        vars:
          FILE: '{{.ITEM}}'
      - cmd: |
          FILE_COUNT=$(echo "{{.CHANGED_FILES}}" | wc -w | tr -d ' ')
          echo ""
          echo -e "{{.SUCCESS}} Branch sync complete ($FILE_COUNT files)"
        silent: true

  # ============================================================================
  # INTERNAL: Sync single file to all pods
  # ============================================================================
  _sync-file:
    internal: true
    silent: true
    vars:
      REL_PATH:
        sh: echo "{{.FILE}}" | sed 's|^src/ares/||'
      WORKER_PODS:
        sh: |
          ORCH_POD=$(kubectl get pods -n {{.NAMESPACE}} \
            -l app.kubernetes.io/name=ares-orchestrator \
            --field-selector=status.phase=Running \
            -o jsonpath='{.items[0].metadata.name}' 2>/dev/null || true)
          kubectl get pods -n {{.NAMESPACE}} \
            -l ares.dreadnode.io/component=red-team \
            --field-selector=status.phase=Running \
            -o json | jq -r --arg orch "$ORCH_POD" \
            '.items[] | select(.metadata.labels["ares.dreadnode.io/role"] != "atomic") | select(.metadata.name != $orch) | .metadata.name' | tr '\n' ' ' | xargs
      ORCH_POD:
        sh: |
          kubectl get pods -n {{.NAMESPACE}} \
            -l app.kubernetes.io/name=ares-orchestrator \
            --field-selector=status.phase=Running \
            -o jsonpath='{.items[0].metadata.name}' 2>/dev/null || true
    preconditions:
      - sh: 'test -f "{{.FILE}}"'
        msg: "File not found: {{.FILE}}"
    cmds:
      - cmd: echo -e "{{.INFO}} {{.REL_PATH}}"
        silent: true
      - for: {var: WORKER_PODS, split: ' '}
        task: _sync-to-worker
        vars:
          POD: '{{.ITEM}}'
          FILE: '{{.FILE}}'
          REL_PATH: '{{.REL_PATH}}'
      - task: _sync-to-orchestrator
        vars:
          POD: '{{.ORCH_POD}}'
          FILE: '{{.FILE}}'
          REL_PATH: '{{.REL_PATH}}'

  # ============================================================================
  # INTERNAL: Sync file to single worker pod
  # ============================================================================
  _sync-to-worker:
    internal: true
    silent: true
    preconditions:
      - sh: '[ -n "{{.POD}}" ]'
    vars:
      CONTAINER:
        sh: |
          container="{{.WORKER_CONTAINER}}"
          if [ -z "$container" ]; then
            container=$(kubectl get pod -n {{.NAMESPACE}} "{{.POD}}" \
              -o jsonpath="{.spec.containers[0].name}" 2>/dev/null)
          fi
          echo "$container"
    cmds:
      - cmd: |
          # Ensure directory exists
          if [ -n "{{.CONTAINER}}" ]; then
            kubectl exec -n {{.NAMESPACE}} {{.POD}} -c {{.CONTAINER}} -- \
              mkdir -p $(dirname {{.PVC_PATH}}/src/ares/{{.REL_PATH}}) 2>/dev/null || true
          else
            kubectl exec -n {{.NAMESPACE}} {{.POD}} -- \
              mkdir -p $(dirname {{.PVC_PATH}}/src/ares/{{.REL_PATH}}) 2>/dev/null || true
          fi

          # Copy file
          if [ -n "{{.CONTAINER}}" ]; then
            if kubectl cp "{{.FILE}}" "{{.POD}}:{{.PVC_PATH}}/src/ares/{{.REL_PATH}}" \
                -n {{.NAMESPACE}} -c {{.CONTAINER}} 2>/dev/null; then
              echo -e "{{.SUCCESS}}   -> {{.POD}}"
            else
              echo -e "{{.WARN}}   x {{.POD}}"
              exit 0
            fi
          else
            if kubectl cp "{{.FILE}}" "{{.POD}}:{{.PVC_PATH}}/src/ares/{{.REL_PATH}}" \
                -n {{.NAMESPACE}} 2>/dev/null; then
              echo -e "{{.SUCCESS}}   -> {{.POD}}"
            else
              echo -e "{{.WARN}}   x {{.POD}}"
              exit 0
            fi
          fi

          # Verify if enabled
          if [ "{{.VERIFY_PVC_DIFF}}" = "true" ]; then
            local_hash=$(shasum -a 256 "{{.FILE}}" 2>/dev/null | awk '{print $1}')
            if [ -n "{{.CONTAINER}}" ]; then
              remote_hash=$(kubectl exec -n {{.NAMESPACE}} -c {{.CONTAINER}} "{{.POD}}" -- \
                sha256sum "{{.PVC_PATH}}/src/ares/{{.REL_PATH}}" 2>/dev/null | awk '{print $1}')
            else
              remote_hash=$(kubectl exec -n {{.NAMESPACE}} "{{.POD}}" -- \
                sha256sum "{{.PVC_PATH}}/src/ares/{{.REL_PATH}}" 2>/dev/null | awk '{print $1}')
            fi

            if [ -z "$remote_hash" ]; then
              echo -e "{{.WARN}}   x {{.POD}} (pvc missing)"
            elif [ "$remote_hash" = "$local_hash" ]; then
              echo -e "{{.SUCCESS}}   -> {{.POD}} (pvc verified)"
            else
              echo -e "{{.WARN}}   x {{.POD}} (pvc differs)"
            fi
          fi
        silent: true

  # ============================================================================
  # INTERNAL: Sync file to orchestrator pod
  # ============================================================================
  _sync-to-orchestrator:
    internal: true
    silent: true
    preconditions:
      - sh: '[ -n "{{.POD}}" ]'
    cmds:
      - cmd: |
          # Ensure directory exists
          kubectl exec -n {{.NAMESPACE}} -c {{.ORCH_CONTAINER}} "{{.POD}}" -- \
            mkdir -p $(dirname {{.PVC_PATH}}/src/ares/{{.REL_PATH}}) 2>/dev/null || true

          # Copy file
          if kubectl cp "{{.FILE}}" "{{.POD}}:{{.PVC_PATH}}/src/ares/{{.REL_PATH}}" \
              -n {{.NAMESPACE}} -c {{.ORCH_CONTAINER}} 2>/dev/null; then
            echo -e "{{.SUCCESS}}   -> {{.POD}}"
          else
            echo -e "{{.WARN}}   x {{.POD}}"
            exit 0
          fi

          # Verify if enabled
          if [ "{{.VERIFY_PVC_DIFF}}" = "true" ]; then
            local_hash=$(shasum -a 256 "{{.FILE}}" 2>/dev/null | awk '{print $1}')
            remote_hash=$(kubectl exec -n {{.NAMESPACE}} -c {{.ORCH_CONTAINER}} "{{.POD}}" -- \
              sha256sum "{{.PVC_PATH}}/src/ares/{{.REL_PATH}}" 2>/dev/null | awk '{print $1}')

            if [ -z "$remote_hash" ]; then
              echo -e "{{.WARN}}   x {{.POD}} (pvc missing)"
            elif [ "$remote_hash" = "$local_hash" ]; then
              echo -e "{{.SUCCESS}}   -> {{.POD}} (pvc verified)"
            else
              echo -e "{{.WARN}}   x {{.POD}} (pvc differs)"
            fi
          fi
        silent: true

  # ============================================================================
  # ROLLOUT: Restart pods
  # ============================================================================
  rollout:
    desc: "Restart pods to pick up code changes"
    silent: true
    cmds:
      - |
        echo -e "{{.INFO}} Restarting deployments in {{.NAMESPACE}}..."

        # Restart worker agents
        kubectl rollout restart deployment -n {{.NAMESPACE}} -l ares.dreadnode.io/component=red-team 2>/dev/null || true

        # Restart orchestrator (has different label)
        kubectl rollout restart deployment -n {{.NAMESPACE}} -l app.kubernetes.io/name=ares-orchestrator 2>/dev/null || true

        echo -e "{{.SUCCESS}} Rollout initiated"
        echo -e "{{.INFO}} Checking worker status..."

        kubectl rollout status deployment -n {{.NAMESPACE}} -l ares.dreadnode.io/component=red-team --timeout=60s 2>/dev/null || true

        echo -e "{{.INFO}} Checking orchestrator status..."
        kubectl rollout status deployment -n {{.NAMESPACE}} -l app.kubernetes.io/name=ares-orchestrator --timeout=60s 2>/dev/null || true

        echo ""
        echo -e "{{.SUCCESS}} All pods restarted"

  # ============================================================================
  # PVC: Clear dev PVCs
  # ============================================================================
  pvc:clear:
    desc: "Clear dev code from PVCs for a fresh deploy (usage: task remote:pvc:clear [CONFIRM=true] [ROLLOUT=true])"
    silent: true
    vars:
      CONFIRM: '{{.CONFIRM | default "false"}}'
      ROLLOUT: '{{.ROLLOUT | default "true"}}'
    cmds:
      - |
        set -euo pipefail

        if [ "{{.CONFIRM}}" != "true" ]; then
          echo -e "{{.WARN}} This will delete {{.PVC_PATH}}/src/ares from pods."
          echo -e "{{.WARN}} Re-run with CONFIRM=true to proceed."
          exit 1
        fi

        ORCH_POD=$(kubectl get pods -n {{.NAMESPACE}} \
          -l app.kubernetes.io/name=ares-orchestrator \
          --field-selector=status.phase=Running \
          -o jsonpath='{.items[0].metadata.name}' 2>/dev/null || true)

        PODS=$(kubectl get pods -n {{.NAMESPACE}} \
          -l ares.dreadnode.io/component=red-team \
          --field-selector=status.phase=Running \
          -o json | jq -r --arg orch "$ORCH_POD" \
          '.items[] | select(.metadata.labels["ares.dreadnode.io/role"] != "atomic") | select(.metadata.name != $orch) | .metadata.name' | tr '\n' ' ')

        if [ -z "$PODS" ] && [ -z "$ORCH_POD" ]; then
          echo -e "{{.ERROR}} No running pods found"
          exit 1
        fi

        echo -e "{{.INFO}} Clearing {{.PVC_PATH}}/src/ares in pods..."

        if [ -n "$PODS" ]; then
          printf '%s\n' $PODS | xargs -n1 -P {{.PARALLELISM}} -I{} bash -c '
            pod="$1"
            worker_container="{{.WORKER_CONTAINER}}"
            if [ -z "$worker_container" ]; then
              worker_container=$(kubectl get pod -n {{.NAMESPACE}} "$pod" \
                -o jsonpath="{.spec.containers[0].name}" 2>/dev/null)
            fi
            if [ -n "$worker_container" ]; then
              container_flag=(-c "$worker_container")
            else
              container_flag=()
            fi
            if kubectl exec -n {{.NAMESPACE}} "${container_flag[@]}" "$pod" -- \
                rm -rf {{.PVC_PATH}}/src/ares 2>/dev/null && \
              kubectl exec -n {{.NAMESPACE}} "${container_flag[@]}" "$pod" -- \
                mkdir -p {{.PVC_PATH}}/src/ares 2>/dev/null; then
              echo -e "{{.SUCCESS}}   -> $pod"
            else
              echo -e "{{.WARN}}   x $pod"
            fi
            exit 0
          ' _ {}
        fi

        if [ -n "$ORCH_POD" ]; then
          if kubectl exec -n {{.NAMESPACE}} -c {{.ORCH_CONTAINER}} "$ORCH_POD" -- \
              rm -rf {{.PVC_PATH}}/src/ares 2>/dev/null && \
            kubectl exec -n {{.NAMESPACE}} -c {{.ORCH_CONTAINER}} "$ORCH_POD" -- \
              mkdir -p {{.PVC_PATH}}/src/ares 2>/dev/null; then
            echo -e "{{.SUCCESS}}   -> $ORCH_POD"
          else
            echo -e "{{.WARN}}   x $ORCH_POD"
          fi
        fi

        if [ "{{.ROLLOUT}}" = "true" ]; then
          echo -e "{{.INFO}} Restarting deployments after PVC clear..."
          kubectl rollout restart deployment -n {{.NAMESPACE}} -l ares.dreadnode.io/component=red-team 2>/dev/null || true
          kubectl rollout restart deployment -n {{.NAMESPACE}} -l app.kubernetes.io/name=ares-orchestrator 2>/dev/null || true
          echo -e "{{.SUCCESS}} Rollout initiated"
        fi

  # ============================================================================
  # STATUS: Check pod status
  # ============================================================================
  status:
    desc: "Show remote pod status"
    silent: true
    cmds:
      - |
        echo ""
        echo -e "{{.INFO}} Pod Status in {{.NAMESPACE}}"
        echo "========================================"
        kubectl get pods -n {{.NAMESPACE}} -o wide 2>/dev/null || echo -e "{{.ERROR}} Failed to get pods"

        echo ""
        echo -e "{{.INFO}} Deployments"
        echo "========================================"
        kubectl get deployments -n {{.NAMESPACE}} 2>/dev/null || echo -e "{{.ERROR}} Failed to get deployments"

  # ============================================================================
  # LOGS: Tail pod logs
  # ============================================================================
  logs:
    desc: "Tail logs from pods (usage: task remote:logs [ROLE=enum] [FOLLOW=true])"
    silent: true
    vars:
      ROLE: '{{.ROLE | default ""}}'
      FOLLOW: '{{.FOLLOW | default "true"}}'
      LINES: '{{.LINES | default "100"}}'
    cmds:
      - |
        if [ -n "{{.ROLE}}" ]; then
          SELECTOR="-l ares.dreadnode.io/role={{.ROLE}}"
          echo -e "{{.INFO}} Logs from {{.ROLE}} agent:"
        else
          SELECTOR="-l ares.dreadnode.io/component=red-team"
          echo -e "{{.INFO}} Logs from all agents:"
        fi
        echo "========================================"

        if [ "{{.FOLLOW}}" = "true" ]; then
          if [ -n "{{.WORKER_CONTAINER}}" ]; then
            kubectl logs -n {{.NAMESPACE}} $SELECTOR -c {{.WORKER_CONTAINER}} --tail={{.LINES}} -f --prefix=true 2>/dev/null || \
              kubectl logs -n {{.NAMESPACE}} $SELECTOR --tail={{.LINES}} -f --prefix=true
          else
            kubectl logs -n {{.NAMESPACE}} $SELECTOR --tail={{.LINES}} -f --prefix=true
          fi
        else
          if [ -n "{{.WORKER_CONTAINER}}" ]; then
            kubectl logs -n {{.NAMESPACE}} $SELECTOR -c {{.WORKER_CONTAINER}} --tail={{.LINES}} --prefix=true 2>/dev/null || \
              kubectl logs -n {{.NAMESPACE}} $SELECTOR --tail={{.LINES}} --prefix=true
          else
            kubectl logs -n {{.NAMESPACE}} $SELECTOR --tail={{.LINES}} --prefix=true
          fi
        fi

  logs:orchestrator:
    desc: "Tail orchestrator logs"
    silent: true
    vars:
      FOLLOW: '{{.FOLLOW | default "true"}}'
      LINES: '{{.LINES | default "100"}}'
    cmds:
      - |
        echo -e "{{.INFO}} Orchestrator logs:"
        echo "========================================"

        if [ "{{.FOLLOW}}" = "true" ]; then
          kubectl logs -n {{.NAMESPACE}} -l app.kubernetes.io/name=ares-orchestrator -c {{.ORCH_CONTAINER}} --tail={{.LINES}} -f
        else
          kubectl logs -n {{.NAMESPACE}} -l app.kubernetes.io/name=ares-orchestrator -c {{.ORCH_CONTAINER}} --tail={{.LINES}}
        fi

  # ============================================================================
  # EXEC: Run commands in pods
  # ============================================================================
  exec:
    desc: "Execute command in pod (usage: task remote:exec ROLE=enum CMD=bash)"
    silent: true
    vars:
      ROLE: '{{.ROLE | default "enum"}}'
      CMD: '{{.CMD | default "bash"}}'
    cmds:
      - |
        POD=$(kubectl get pods -n {{.NAMESPACE}} -l ares.dreadnode.io/role={{.ROLE}} -o name 2>/dev/null | head -1)

        if [ -z "$POD" ]; then
          echo -e "{{.ERROR}} No pod found with role: {{.ROLE}}"
          echo -e "{{.INFO}} Available roles:"
          kubectl get pods -n {{.NAMESPACE}} -o json 2>/dev/null | \
            jq -r '.items[].metadata.labels["ares.dreadnode.io/role"] // empty' | sort -u | sed 's/^/  - /'
          exit 1
        fi

        echo -e "{{.INFO}} Executing in $POD..."
        if [ -n "{{.WORKER_CONTAINER}}" ]; then
          kubectl exec -it -n {{.NAMESPACE}} $POD -c {{.WORKER_CONTAINER}} -- {{.CMD}} 2>/dev/null || \
            kubectl exec -it -n {{.NAMESPACE}} $POD -- {{.CMD}}
        else
          kubectl exec -it -n {{.NAMESPACE}} $POD -- {{.CMD}}
        fi

  # ============================================================================
  # VERIFY: Check synced code
  # ============================================================================
  verify:
    desc: "Verify synced code in pod (usage: task remote:verify ROLE=enum FILE=core/worker.py)"
    silent: true
    vars:
      ROLE: '{{.ROLE | default "enum"}}'
      FILE: '{{.FILE | default "core/worker.py"}}'
    cmds:
      - |
        echo -e "{{.INFO}} Verifying {{.FILE}} in {{.ROLE}} agent..."
        echo "========================================"

        POD=$(kubectl get pods -n {{.NAMESPACE}} -l ares.dreadnode.io/role={{.ROLE}} -o name 2>/dev/null | head -1)

        if [ -z "$POD" ]; then
          echo -e "{{.ERROR}} No pod found with role: {{.ROLE}}"
          exit 1
        fi

        if [ -n "{{.WORKER_CONTAINER}}" ]; then
          kubectl exec -n {{.NAMESPACE}} $POD -c {{.WORKER_CONTAINER}} -- \
            head -50 {{.PVC_PATH}}/src/ares/{{.FILE}} 2>/dev/null || \
            kubectl exec -n {{.NAMESPACE}} $POD -- \
              head -50 {{.PVC_PATH}}/src/ares/{{.FILE}}
        else
          kubectl exec -n {{.NAMESPACE}} $POD -- \
            head -50 {{.PVC_PATH}}/src/ares/{{.FILE}}
        fi
