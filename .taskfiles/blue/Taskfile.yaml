---
# Blue Team Tasks
version: "3"

vars:
  # AWS defaults for Grafana access
  PROFILE: '{{.PROFILE | default "infrastructure"}}'
  REGION: '{{.REGION | default "us-west-2"}}'

  # 1Password API keys (shared across tasks)
  ANTHROPIC_API_KEY:
    sh: op item get "Dreadnode Claude" --fields api-key --reveal 2>/dev/null || echo ""
  DREADNODE_API_KEY:
    sh: op item get "Dreadnode Dev Platform" --fields api-key --reveal 2>/dev/null || echo ""
  GRAFANA_SERVICE_ACCOUNT_TOKEN:
    sh: op item get "Ares Grafana MCP" --fields api-token --reveal 2>/dev/null || echo ""
  OPENAI_API_KEY:
    sh: op item get "Openai" --fields dreadnode-ares-api-key --reveal 2>/dev/null || echo ""

  # Model selection (MODEL_ALL takes precedence over MODEL)
  MODEL_ARG:
    sh: |
      if [ -n "{{.MODEL_ALL}}" ]; then
        echo "{{.MODEL_ALL}}"
      else
        echo "{{.MODEL}}"
      fi

tasks:
  # ===========================================================================
  # Blue Team Agent Tasks
  # ===========================================================================

  poll:
    desc: "Run blue team agent in poll mode (uses 1Password for API keys)"
    silent: true
    cmds:
      - |
        # Verify AWS auth
        if ! aws sts get-caller-identity --profile "{{.PROFILE}}" --region "{{.REGION}}" >/dev/null 2>&1; then
            echo "AWS authentication failed for profile: {{.PROFILE}}"
            echo "Run: aws sso login --profile {{.PROFILE}}"
            exit 1
        fi

        export ANTHROPIC_API_KEY="{{.ANTHROPIC_API_KEY}}"
        export DREADNODE_API_KEY="{{.DREADNODE_API_KEY}}"
        export GRAFANA_SERVICE_ACCOUNT_TOKEN="{{.GRAFANA_SERVICE_ACCOUNT_TOKEN}}"
        export OPENAI_API_KEY="{{.OPENAI_API_KEY}}"

        mkdir -p {{.LOG_DIR}}
        LOGFILE="{{.LOG_DIR}}/blue-$(date +%Y%m%d-%H%M%S).log"
        echo "Logging to: $LOGFILE"

        uv run python -m ares \
          --args.model "{{.MODEL_ARG}}" \
          --args.grafana-url {{.GRAFANA_URL}} \
          --args.poll-interval {{.POLL_INTERVAL}} \
          --args.max-steps {{.MAX_STEPS_BLUE}} \
          --args.report-dir {{.REPORT_DIR}} \
          --dn-args.server {{.DREADNODE_SERVER_URL}} \
          --dn-args.token "$DREADNODE_API_KEY" \
          --dn-args.organization {{.DREADNODE_ORGANIZATION}} \
          --dn-args.workspace {{.DREADNODE_WORKSPACE}} \
          --dn-args.project {{.DREADNODE_PROJECT}} \
          2>&1 | tee -a "$LOGFILE"

  poll:local:
    desc: "Run blue team agent in poll mode using .env file"
    silent: true
    preconditions:
      - sh: test -f .env
        msg: ".env file not found"
    cmds:
      - |
        # Verify AWS auth
        if ! aws sts get-caller-identity --profile "{{.PROFILE}}" --region "{{.REGION}}" >/dev/null 2>&1; then
            echo "AWS authentication failed for profile: {{.PROFILE}}"
            echo "Run: aws sso login --profile {{.PROFILE}}"
            exit 1
        fi

        set -a
        . ./.env
        set +a

        mkdir -p {{.LOG_DIR}}
        LOGFILE="{{.LOG_DIR}}/blue-$(date +%Y%m%d-%H%M%S).log"
        echo "Logging to: $LOGFILE"

        uv run python -m ares \
          --args.model "{{.MODEL_ARG}}" \
          --args.grafana-url {{.GRAFANA_URL}} \
          --args.poll-interval {{.POLL_INTERVAL}} \
          --args.max-steps {{.MAX_STEPS_BLUE}} \
          --args.report-dir {{.REPORT_DIR}} \
          --dn-args.server {{.DREADNODE_SERVER_URL}} \
          --dn-args.organization {{.DREADNODE_ORGANIZATION}} \
          --dn-args.workspace {{.DREADNODE_WORKSPACE}} \
          --dn-args.project {{.DREADNODE_PROJECT}} \
          2>&1 | tee -a "$LOGFILE"

  once:
    desc: "Run blue team agent once and exit (usage: task blue:once [OPERATION_ID=op-xxx] [LATEST=true])"
    silent: true
    vars:
      OPERATION_ID: '{{.OPERATION_ID | default ""}}'
      LATEST: '{{.LATEST | default ""}}'
    cmds:
      - |
        # Verify AWS auth
        if ! aws sts get-caller-identity --profile "{{.PROFILE}}" --region "{{.REGION}}" >/dev/null 2>&1; then
            echo "AWS authentication failed for profile: {{.PROFILE}}"
            echo "Run: aws sso login --profile {{.PROFILE}}"
            exit 1
        fi

        export ANTHROPIC_API_KEY="{{.ANTHROPIC_API_KEY}}"
        export DREADNODE_API_KEY="{{.DREADNODE_API_KEY}}"
        export GRAFANA_SERVICE_ACCOUNT_TOKEN="{{.GRAFANA_SERVICE_ACCOUNT_TOKEN}}"
        export OPENAI_API_KEY="{{.OPENAI_API_KEY}}"

        mkdir -p {{.LOG_DIR}}
        LOGFILE="{{.LOG_DIR}}/blue-$(date +%Y%m%d-%H%M%S).log"
        echo "Logging to: $LOGFILE"

        # Build operation context args
        OP_ARGS=""
        if [ "{{.LATEST}}" = "true" ]; then
          OP_ARGS="--args.latest"
        elif [ -n "{{.OPERATION_ID}}" ]; then
          OP_ARGS="--args.operation-id {{.OPERATION_ID}}"
        fi

        uv run python -m ares \
          --args.model "{{.MODEL_ARG}}" \
          --args.grafana-url {{.GRAFANA_URL}} \
          --args.poll-interval {{.POLL_INTERVAL}} \
          --args.max-steps {{.MAX_STEPS_BLUE_ONCE}} \
          --args.report-dir {{.REPORT_DIR}} \
          --args.once \
          $OP_ARGS \
          --dn-args.server {{.DREADNODE_SERVER_URL}} \
          --dn-args.token "$DREADNODE_API_KEY" \
          --dn-args.organization {{.DREADNODE_ORGANIZATION}} \
          --dn-args.workspace {{.DREADNODE_WORKSPACE}} \
          --dn-args.project {{.DREADNODE_PROJECT}} \
          2>&1 | tee -a "$LOGFILE"

  once:remote:
    desc: "Run blue team agent once on K8s cluster (usage: task blue:once:remote [OPERATION_ID=op-xxx] [LATEST=true])"
    silent: true
    vars:
      OPERATION_ID: '{{.OPERATION_ID | default ""}}'
      LATEST: '{{.LATEST | default ""}}'
    preconditions:
      - sh: test -n "{{.OPERATION_ID}}" || test "{{.LATEST}}" = "true"
        msg: "Either OPERATION_ID or LATEST=true is required. Usage: task blue:once:remote OPERATION_ID=op-xxx  OR  task blue:once:remote LATEST=true"
    cmds:
      - |
        echo "Running blue team agent on K8s cluster..."
        echo "K8s namespace: {{.K8S_NAMESPACE}}"
        echo ""

        # Build operation context args
        OP_ARGS=""
        if [ "{{.LATEST}}" = "true" ]; then
          OP_ARGS="--args.latest"
        elif [ -n "{{.OPERATION_ID}}" ]; then
          OP_ARGS="--args.operation-id {{.OPERATION_ID}}"
        fi

        kubectl exec -i -n {{.K8S_NAMESPACE}} deploy/ares-blue-orchestrator -- \
          env OPENAI_API_KEY="{{.OPENAI_API_KEY}}" \
          ANTHROPIC_API_KEY="{{.ANTHROPIC_API_KEY}}" \
          DREADNODE_API_KEY="{{.DREADNODE_API_KEY}}" \
          DREADNODE_SERVER_URL="{{.DREADNODE_SERVER_URL}}" \
          DREADNODE_ORGANIZATION="{{.DREADNODE_ORGANIZATION}}" \
          DREADNODE_WORKSPACE="{{.DREADNODE_WORKSPACE}}" \
          DREADNODE_PROJECT="{{.DREADNODE_PROJECT}}" \
          GRAFANA_SERVICE_ACCOUNT_TOKEN="{{.GRAFANA_SERVICE_ACCOUNT_TOKEN}}" \
          GRAFANA_URL="{{.GRAFANA_URL}}" \
          /usr/bin/python3 -m ares \
          --args.model "{{.MODEL_ARG}}" \
          --args.grafana-url "{{.GRAFANA_URL}}" \
          --args.max-steps {{.MAX_STEPS_BLUE_ONCE}} \
          --args.report-dir /tmp/reports \
          --args.once \
          $OP_ARGS \
          --dn-args.server "{{.DREADNODE_SERVER_URL}}" \
          --dn-args.token "$DREADNODE_API_KEY" \
          --dn-args.organization "{{.DREADNODE_ORGANIZATION}}" \
          --dn-args.workspace "{{.DREADNODE_WORKSPACE}}" \
          --dn-args.project "{{.DREADNODE_PROJECT}}"

  once:local:
    desc: "Run blue team agent once and exit using .env file (usage: task blue:once:local [OPERATION_ID=op-xxx] [LATEST=true])"
    silent: true
    vars:
      OPERATION_ID: '{{.OPERATION_ID | default ""}}'
      LATEST: '{{.LATEST | default ""}}'
    preconditions:
      - sh: test -f .env
        msg: ".env file not found"
    cmds:
      - |
        # Verify AWS auth
        if ! aws sts get-caller-identity --profile "{{.PROFILE}}" --region "{{.REGION}}" >/dev/null 2>&1; then
            echo "AWS authentication failed for profile: {{.PROFILE}}"
            echo "Run: aws sso login --profile {{.PROFILE}}"
            exit 1
        fi

        set -a
        . ./.env
        set +a

        mkdir -p {{.LOG_DIR}}
        LOGFILE="{{.LOG_DIR}}/blue-$(date +%Y%m%d-%H%M%S).log"
        echo "Logging to: $LOGFILE"

        # Build operation context args
        OP_ARGS=""
        if [ "{{.LATEST}}" = "true" ]; then
          OP_ARGS="--args.latest"
        elif [ -n "{{.OPERATION_ID}}" ]; then
          OP_ARGS="--args.operation-id {{.OPERATION_ID}}"
        fi

        uv run python -m ares \
          --args.model "{{.MODEL_ARG}}" \
          --args.grafana-url {{.GRAFANA_URL}} \
          --args.poll-interval {{.POLL_INTERVAL}} \
          --args.max-steps {{.MAX_STEPS_BLUE_ONCE}} \
          --args.report-dir {{.REPORT_DIR}} \
          --args.once \
          $OP_ARGS \
          --dn-args.server {{.DREADNODE_SERVER_URL}} \
          --dn-args.organization {{.DREADNODE_ORGANIZATION}} \
          --dn-args.workspace {{.DREADNODE_WORKSPACE}} \
          --dn-args.project {{.DREADNODE_PROJECT}} \
          2>&1 | tee -a "$LOGFILE"

  investigate:
    desc: "Investigate a specific alert from JSON file (usage: task blue:investigate ALERT=alert.json)"
    silent: true
    vars:
      ALERT: '{{.ALERT | default ""}}'
    preconditions:
      - sh: test -n "{{.ALERT}}"
        msg: "ALERT variable is required. Usage: task blue:investigate ALERT=alert.json"
      - sh: test -f "{{.ALERT}}"
        msg: "Alert file not found: {{.ALERT}}"
    cmds:
      - |
        # Verify AWS auth
        if ! aws sts get-caller-identity --profile "{{.PROFILE}}" --region "{{.REGION}}" >/dev/null 2>&1; then
            echo "AWS authentication failed for profile: {{.PROFILE}}"
            echo "Run: aws sso login --profile {{.PROFILE}}"
            exit 1
        fi

        export ANTHROPIC_API_KEY="{{.ANTHROPIC_API_KEY}}"
        export DREADNODE_API_KEY="{{.DREADNODE_API_KEY}}"
        export GRAFANA_SERVICE_ACCOUNT_TOKEN="{{.GRAFANA_SERVICE_ACCOUNT_TOKEN}}"
        export OPENAI_API_KEY="{{.OPENAI_API_KEY}}"

        uv run python -m ares investigate-alert {{.ALERT}} \
          --args.model "{{.MODEL_ARG}}" \
          --args.grafana-url {{.GRAFANA_URL}} \
          --args.max-steps {{.MAX_STEPS_BLUE_ONCE}} \
          --args.report-dir {{.REPORT_DIR}} \
          --dn-args.server {{.DREADNODE_SERVER_URL}} \
          --dn-args.token "$DREADNODE_API_KEY" \
          --dn-args.organization {{.DREADNODE_ORGANIZATION}} \
          --dn-args.workspace {{.DREADNODE_WORKSPACE}} \
          --dn-args.project {{.DREADNODE_PROJECT}}

  # ===========================================================================
  # Reports
  # ===========================================================================

  reports:list:
    desc: List all investigation reports
    silent: true
    cmds:
      - |
        echo "Investigation Reports:"
        echo "======================"
        if [ -d {{.REPORT_DIR}} ]; then
          ls -lht {{.REPORT_DIR}}/*.md 2>/dev/null || echo "No reports found"
        else
          echo "Report directory not found: {{.REPORT_DIR}}"
        fi

  reports:latest:
    desc: Show the latest investigation report
    silent: true
    cmds:
      - |
        LATEST=$(ls -t {{.REPORT_DIR}}/*.md 2>/dev/null | head -1)
        if [ -n "$LATEST" ]; then
          echo "Latest report: $LATEST"
          echo "===================="
          cat "$LATEST"
        else
          echo "No reports found in {{.REPORT_DIR}}"
        fi

  playbook:
    desc: "Export detection playbook from red team operation (usage: task blue:playbook [OPERATION_ID=op-xxx] [LATEST=true])"
    silent: true
    vars:
      OPERATION_ID: '{{.OPERATION_ID | default ""}}'
      LATEST: '{{.LATEST | default ""}}'
      OUTPUT_DIR: '{{.OUTPUT_DIR | default "./reports"}}'
      JSON: '{{.JSON | default "false"}}'
    preconditions:
      - sh: test -n "{{.OPERATION_ID}}" || test "{{.LATEST}}" = "true"
        msg: "Either OPERATION_ID or LATEST=true is required. Usage: task blue:playbook OPERATION_ID=op-xxx  OR  task blue:playbook LATEST=true"
    cmds:
      - cmd: mkdir -p "{{.OUTPUT_DIR}}"
        silent: true
      - |
        LATEST_FLAG=""
        if [ "{{.LATEST}}" = "true" ]; then
          LATEST_FLAG="--latest"
        fi
        OP_ID_ARG=""
        if [ -n "{{.OPERATION_ID}}" ]; then
          OP_ID_ARG="{{.OPERATION_ID}}"
        fi
        JSON_FLAG=""
        if [ "{{.JSON}}" = "true" ]; then
          JSON_FLAG="--json-output"
        fi
        kubectl exec -i -n {{.K8S_NAMESPACE}} deploy/ares-orchestrator -- python -m ares.cli_ops export-detection $OP_ID_ARG $LATEST_FLAG $JSON_FLAG --output-dir /tmp/reports

        # Get the operation ID if we used --latest
        if [ -n "$LATEST_FLAG" ]; then
          RESOLVED_OP_ID=$(kubectl exec -i -n {{.K8S_NAMESPACE}} deploy/ares-orchestrator -- python -m ares.cli_ops list --latest 2>/dev/null | tr -d '\n')
        else
          RESOLVED_OP_ID="{{.OPERATION_ID}}"
        fi

        # Copy playbook files from pod to local machine
        if [ -n "$RESOLVED_OP_ID" ]; then
          ORCH_POD=$(kubectl get pods -n {{.K8S_NAMESPACE}} -l app.kubernetes.io/name=ares-orchestrator -o jsonpath='{.items[0].metadata.name}')
          kubectl cp "{{.K8S_NAMESPACE}}/${ORCH_POD}:/tmp/reports/${RESOLVED_OP_ID}_detection_playbook.json" "{{.OUTPUT_DIR}}/${RESOLVED_OP_ID}_detection_playbook.json" 2>/dev/null || true
          kubectl cp "{{.K8S_NAMESPACE}}/${ORCH_POD}:/tmp/reports/${RESOLVED_OP_ID}_detection_playbook.md" "{{.OUTPUT_DIR}}/${RESOLVED_OP_ID}_detection_playbook.md" 2>/dev/null || true
          if [ -f "{{.OUTPUT_DIR}}/${RESOLVED_OP_ID}_detection_playbook.json" ]; then
            echo "Detection playbook saved to: {{.OUTPUT_DIR}}/${RESOLVED_OP_ID}_detection_playbook.json"
            echo "Detection playbook saved to: {{.OUTPUT_DIR}}/${RESOLVED_OP_ID}_detection_playbook.md"
          fi
        fi

  playbook:local:
    desc: "Export detection playbook locally using .env file (usage: task blue:playbook:local [OPERATION_ID=op-xxx] [LATEST=true])"
    silent: true
    vars:
      OPERATION_ID: '{{.OPERATION_ID | default ""}}'
      LATEST: '{{.LATEST | default ""}}'
      OUTPUT_DIR: '{{.OUTPUT_DIR | default "./reports"}}'
      JSON: '{{.JSON | default "false"}}'
    preconditions:
      - sh: test -f .env
        msg: ".env file not found"
      - sh: test -n "{{.OPERATION_ID}}" || test "{{.LATEST}}" = "true"
        msg: "Either OPERATION_ID or LATEST=true is required. Usage: task blue:playbook:local OPERATION_ID=op-xxx  OR  task blue:playbook:local LATEST=true"
    cmds:
      - cmd: mkdir -p "{{.OUTPUT_DIR}}"
        silent: true
      - |
        set -a
        . ./.env
        set +a

        LATEST_FLAG=""
        if [ "{{.LATEST}}" = "true" ]; then
          LATEST_FLAG="--latest"
        fi
        OP_ID_ARG=""
        if [ -n "{{.OPERATION_ID}}" ]; then
          OP_ID_ARG="{{.OPERATION_ID}}"
        fi
        JSON_FLAG=""
        if [ "{{.JSON}}" = "true" ]; then
          JSON_FLAG="--json-output"
        fi
        uv run python -m ares.cli_ops export-detection $OP_ID_ARG $LATEST_FLAG $JSON_FLAG --output-dir "{{.OUTPUT_DIR}}"

  reports:consolidate:
    desc: Generate a consolidated report from all investigation reports in a directory
    silent: true
    vars:
      INPUT_DIR: '{{.INPUT_DIR | default "./reports"}}'
      OUTPUT_DIR: '{{.OUTPUT_DIR | default "./reports"}}'
    cmds:
      - |
        uv run python -c "
        import sys
        from pathlib import Path
        from datetime import datetime, timezone

        from ares.reports import (
            BlueTeamOperation,
            generate_operation_report,
        )
        from ares.reports.investigation import MarkdownReportGenerator
        from ares.core.models import (
            InvestigationState,
            InvestigationStage,
            Evidence,
            TimelineEvent,
            PyramidLevel,
        )
        from ares.core.lateral_analyzer import LateralGraph
        import re
        import json

        input_dir = Path('{{.INPUT_DIR}}')
        output_dir = Path('{{.OUTPUT_DIR}}')

        if not input_dir.exists():
            print(f'Input directory not found: {input_dir}')
            sys.exit(1)

        # Find investigation reports
        reports = list(input_dir.glob('investigation_*.md'))
        if not reports:
            print(f'No investigation reports found in {input_dir}')
            sys.exit(1)

        print(f'Found {len(reports)} investigation report(s)')

        # Parse reports back into states (simplified - extracts key data)
        investigations = []
        for report_path in reports:
            content = report_path.read_text()

            # Extract investigation ID
            inv_id_match = re.search(r'\*\*Investigation ID:\*\*\s*\`?(\S+?)\`?', content)
            inv_id = inv_id_match.group(1) if inv_id_match else report_path.stem

            # Extract alert info
            alert_match = re.search(r'\|\s*Alert Name\s*\|\s*(.+?)\s*\|', content)
            alert_name = alert_match.group(1).strip() if alert_match else 'Unknown'

            severity_match = re.search(r'\|\s*Severity\s*\|\s*(\w+)\s*\|', content)
            severity = severity_match.group(1).strip() if severity_match else 'unknown'

            # Extract techniques
            techniques = set(re.findall(r'(T\d{4}(?:\.\d{3})?)', content))

            # Extract pyramid level
            pyramid_match = re.search(r'\*\*Highest Pyramid Level:\*\*\s*(\d+)', content)
            highest_level = int(pyramid_match.group(1)) if pyramid_match else 0

            # Create a minimal state
            state = InvestigationState(
                investigation_id=inv_id,
                alert={'labels': {'alertname': alert_name, 'severity': severity}},
                started_at=datetime.now(timezone.utc),
                stage=InvestigationStage.SYNTHESIS,
                evidence=[],
                timeline=[],
                questions=[],
                identified_techniques=techniques,
                identified_tactics=set(),
                technique_names={t: t for t in techniques},
                technique_to_tactic={},
                queried_hosts=set(),
                queried_users=set(),
                executed_queries=[],
                escalated='ESCALATED' in content,
                escalation_reason=None,
                attack_synopsis=None,
                recommendations=[],
                lateral_graph=LateralGraph(),
            )
            investigations.append(state)
            print(f'  - {inv_id}: {alert_name} ({len(techniques)} techniques)')

        # Create operation and generate report
        timestamp = datetime.now(timezone.utc).strftime('%Y%m%d-%H%M%S')
        operation_id = f'blue-op-{timestamp}'

        operation = BlueTeamOperation(
            operation_id=operation_id,
            started_at=min(s.started_at for s in investigations),
            completed_at=datetime.now(timezone.utc),
            investigations=investigations,
        )

        report_content = generate_operation_report(operation)

        output_path = output_dir / f'blueteam-{operation_id}.md'
        output_path.write_text(report_content)

        print(f'')
        print(f'✅ Consolidated report generated: {output_path}')
        print(f'   Investigations: {len(investigations)}')
        print(f'   Techniques: {len(operation.all_techniques)}')
        "

  reports:clean:
    desc: Remove all investigation reports
    silent: true
    cmds:
      - |
        read -p "Delete all reports in {{.REPORT_DIR}}? (y/N) " -n 1 -r
        echo
        if [[ $REPLY =~ ^[Yy]$ ]]; then
          rm -rf {{.REPORT_DIR}}/*.md
          echo "✅ Reports cleaned"
        fi

  # ===========================================================================
  # Development / Testing
  # ===========================================================================

  mitre:test:
    desc: Test MITRE ATT&CK data loading
    silent: true
    cmds:
      - |
        uv run python -c "
        import asyncio
        from ares.integrations.mitre import MITREAttackClient

        async def test():
            client = MITREAttackClient()
            await client.load()
            print(f'✅ Loaded {len(client._techniques)} techniques')
            print(f'✅ Loaded {len(client._tactics)} tactics')

            # Show a sample technique
            sample = list(client._techniques.values())[0]
            print(f'\nSample technique:')
            print(f'  ID: {sample.id}')
            print(f'  Name: {sample.name}')
            print(f'  Tactic: {sample.tactic}')

        asyncio.run(test())
        "

  example:grafana-windows:
    desc: Show example Grafana MCP queries for Windows attack detection
    silent: true
    cmds:
      - python examples/grafana_mcp_windows_example.py

  # ===========================================================================
  # Multi-Agent Blue Team Tasks (via K8s orchestrator service)
  # ===========================================================================

  multi:
    desc: "Submit investigation to blue orchestrator (usage: task blue:multi ALERT=alert.json [INVESTIGATION_ID=inv-xxx])"
    silent: true
    vars:
      ALERT: '{{.ALERT | default ""}}'
      INVESTIGATION_ID: '{{.INVESTIGATION_ID | default ""}}'
      MULTI_AGENT: '{{.MULTI_AGENT | default "false"}}'
      MODEL_ARG:
        sh: |
          if [ -n "{{.MODEL_ALL}}" ]; then
            echo "{{.MODEL_ALL}}"
          else
            echo "{{.MODEL}}"
          fi
    preconditions:
      - sh: test -n "{{.ALERT}}"
        msg: "ALERT variable is required. Usage: task blue:multi ALERT=alert.json"
      - sh: test -f "{{.ALERT}}"
        msg: "Alert file not found: {{.ALERT}}"
    cmds:
      - |
        echo "Submitting investigation to blue orchestrator service..."
        echo "Alert file: {{.ALERT}}"
        echo "K8s namespace: {{.K8S_NAMESPACE}}"
        echo ""

        INV_ID_ARG=""
        if [ -n "{{.INVESTIGATION_ID}}" ]; then
          INV_ID_ARG="--investigation-id {{.INVESTIGATION_ID}}"
        fi

        MULTI_AGENT_FLAG=""
        if [ "{{.MULTI_AGENT}}" = "true" ]; then
          MULTI_AGENT_FLAG="--multi-agent"
        fi

        kubectl exec -i -n {{.K8S_NAMESPACE}} deploy/ares-blue-orchestrator -- \
          env OPENAI_API_KEY="{{.OPENAI_API_KEY}}" \
          ANTHROPIC_API_KEY="{{.ANTHROPIC_API_KEY}}" \
          DREADNODE_API_KEY="{{.DREADNODE_API_KEY}}" \
          DREADNODE_SERVER_URL="{{.DREADNODE_SERVER_URL}}" \
          DREADNODE_ORGANIZATION="{{.DREADNODE_ORGANIZATION}}" \
          DREADNODE_WORKSPACE="{{.DREADNODE_WORKSPACE}}" \
          DREADNODE_PROJECT="{{.DREADNODE_PROJECT}}" \
          GRAFANA_SERVICE_ACCOUNT_TOKEN="{{.GRAFANA_SERVICE_ACCOUNT_TOKEN}}" \
          GRAFANA_URL="{{.GRAFANA_URL}}" \
          ARES_MODEL="{{.MODEL_ARG}}" \
          ARES_ORCHESTRATOR_MODEL="{{.MODEL_ARG}}" \
          python -m ares.cli_blue_ops submit "$(cat {{.ALERT}})" \
          $INV_ID_ARG \
          --model "{{.MODEL_ARG}}" \
          --max-steps {{.MAX_STEPS_BLUE}} \
          $MULTI_AGENT_FLAG

  multi:local:
    desc: "Submit investigation using .env file (usage: task blue:multi:local ALERT=alert.json)"
    silent: true
    vars:
      ALERT: '{{.ALERT | default ""}}'
      INVESTIGATION_ID: '{{.INVESTIGATION_ID | default ""}}'
      MULTI_AGENT: '{{.MULTI_AGENT | default "false"}}'
      MODEL_ARG:
        sh: |
          if [ -n "{{.MODEL_ALL}}" ]; then
            echo "{{.MODEL_ALL}}"
          else
            echo "{{.MODEL}}"
          fi
      REDIS_URL:
        sh: |
          REDIS_PASS=$(kubectl get secret redis-secret -n {{.K8S_NAMESPACE}} -o jsonpath='{.data.password}' 2>/dev/null | base64 -d || echo "")
          if [ -n "$REDIS_PASS" ]; then
            echo "redis://:${REDIS_PASS}@redis:6379"
          else
            echo "redis://redis:6379"
          fi
    preconditions:
      - sh: test -f .env
        msg: ".env file not found"
      - sh: test -n "{{.ALERT}}"
        msg: "ALERT variable is required. Usage: task blue:multi:local ALERT=alert.json"
      - sh: test -f "{{.ALERT}}"
        msg: "Alert file not found: {{.ALERT}}"
    cmds:
      - |
        set -a
        . ./.env
        set +a

        echo "Submitting investigation to blue orchestrator service..."
        echo "Alert file: {{.ALERT}}"
        echo ""

        INV_ID_ARG=""
        if [ -n "{{.INVESTIGATION_ID}}" ]; then
          INV_ID_ARG="--investigation-id {{.INVESTIGATION_ID}}"
        fi

        MULTI_AGENT_FLAG=""
        if [ "{{.MULTI_AGENT}}" = "true" ]; then
          MULTI_AGENT_FLAG="--multi-agent"
        fi

        kubectl exec -i -n {{.K8S_NAMESPACE}} deploy/ares-blue-orchestrator -- \
          env OPENAI_API_KEY="$OPENAI_API_KEY" \
          ANTHROPIC_API_KEY="$ANTHROPIC_API_KEY" \
          DREADNODE_API_KEY="$DREADNODE_API_KEY" \
          DREADNODE_SERVER_URL="$DREADNODE_SERVER_URL" \
          DREADNODE_ORGANIZATION="$DREADNODE_ORGANIZATION" \
          DREADNODE_WORKSPACE="$DREADNODE_WORKSPACE" \
          DREADNODE_PROJECT="$DREADNODE_PROJECT" \
          GRAFANA_SERVICE_ACCOUNT_TOKEN="$GRAFANA_SERVICE_ACCOUNT_TOKEN" \
          GRAFANA_URL="$GRAFANA_URL" \
          ARES_MODEL="{{.MODEL_ARG}}" \
          ARES_ORCHESTRATOR_MODEL="{{.MODEL_ARG}}" \
          python -m ares.cli_blue_ops submit "$(cat {{.ALERT}})" \
          $INV_ID_ARG \
          --model "{{.MODEL_ARG}}" \
          --max-steps {{.MAX_STEPS_BLUE}} \
          --redis-url "{{.REDIS_URL}}" \
          $MULTI_AGENT_FLAG

  multi:remote:
    desc: "Run multi-agent blue investigation from red team operation (usage: task blue:multi:remote [OPERATION_ID=op-xxx] [LATEST=true])"
    silent: true
    vars:
      OPERATION_ID: '{{.OPERATION_ID | default ""}}'
      LATEST: '{{.LATEST | default ""}}'
      MODEL_ARG:
        sh: |
          if [ -n "{{.MODEL_ALL}}" ]; then
            echo "{{.MODEL_ALL}}"
          else
            echo "{{.MODEL}}"
          fi
    preconditions:
      - sh: test -n "{{.OPERATION_ID}}" || test "{{.LATEST}}" = "true"
        msg: "Either OPERATION_ID or LATEST=true is required. Usage: task blue:multi:remote OPERATION_ID=op-xxx  OR  task blue:multi:remote LATEST=true"
    cmds:
      - |
        echo "Running multi-agent blue investigation from red team operation..."
        echo "K8s namespace: {{.K8S_NAMESPACE}}"
        echo ""

        # Build operation context args
        OP_ARGS=""
        if [ "{{.LATEST}}" = "true" ]; then
          OP_ARGS="--latest"
        elif [ -n "{{.OPERATION_ID}}" ]; then
          OP_ARGS="{{.OPERATION_ID}}"
        fi

        kubectl exec -i -n {{.K8S_NAMESPACE}} deploy/ares-blue-orchestrator -- \
          env OPENAI_API_KEY="{{.OPENAI_API_KEY}}" \
          ANTHROPIC_API_KEY="{{.ANTHROPIC_API_KEY}}" \
          DREADNODE_API_KEY="{{.DREADNODE_API_KEY}}" \
          DREADNODE_SERVER_URL="{{.DREADNODE_SERVER_URL}}" \
          DREADNODE_ORGANIZATION="{{.DREADNODE_ORGANIZATION}}" \
          DREADNODE_WORKSPACE="{{.DREADNODE_WORKSPACE}}" \
          DREADNODE_PROJECT="{{.DREADNODE_PROJECT}}" \
          GRAFANA_SERVICE_ACCOUNT_TOKEN="{{.GRAFANA_SERVICE_ACCOUNT_TOKEN}}" \
          GRAFANA_URL="{{.GRAFANA_URL}}" \
          ARES_MODEL="{{.MODEL_ARG}}" \
          ARES_ORCHESTRATOR_MODEL="{{.MODEL_ARG}}" \
          /usr/bin/python3 -m ares.cli_blue_ops from-operation $OP_ARGS \
          --model "{{.MODEL_ARG}}" \
          --max-steps {{.MAX_STEPS_BLUE}} \
          --grafana-url "{{.GRAFANA_URL}}"

  multi:status:
    desc: "Check investigation status (usage: task blue:multi:status [INVESTIGATION_ID=inv-xxx] [LATEST=true])"
    silent: true
    vars:
      INVESTIGATION_ID: '{{.INVESTIGATION_ID | default ""}}'
      LATEST: '{{.LATEST | default ""}}'
    preconditions:
      - sh: test -n "{{.INVESTIGATION_ID}}" || test "{{.LATEST}}" = "true"
        msg: "Either INVESTIGATION_ID or LATEST=true is required"
    cmds:
      - |
        LATEST_FLAG=""
        if [ "{{.LATEST}}" = "true" ]; then
          LATEST_FLAG="--latest"
        fi
        INV_ID_ARG=""
        if [ -n "{{.INVESTIGATION_ID}}" ]; then
          INV_ID_ARG="{{.INVESTIGATION_ID}}"
        fi
        kubectl exec -i -n {{.K8S_NAMESPACE}} deploy/ares-blue-orchestrator -- python3 -m ares.cli_blue_ops status $INV_ID_ARG $LATEST_FLAG

  multi:list:
    desc: "List all investigations"
    silent: true
    cmds:
      - kubectl exec -i -n {{.K8S_NAMESPACE}} deploy/ares-blue-orchestrator -- python3 -m ares.cli_blue_ops list

  multi:evidence:
    desc: "Show evidence for an investigation (usage: task blue:multi:evidence [INVESTIGATION_ID=inv-xxx] [LATEST=true])"
    silent: true
    vars:
      INVESTIGATION_ID: '{{.INVESTIGATION_ID | default ""}}'
      LATEST: '{{.LATEST | default ""}}'
      JSON: '{{.JSON | default "false"}}'
    preconditions:
      - sh: test -n "{{.INVESTIGATION_ID}}" || test "{{.LATEST}}" = "true"
        msg: "Either INVESTIGATION_ID or LATEST=true is required"
    cmds:
      - |
        LATEST_FLAG=""
        if [ "{{.LATEST}}" = "true" ]; then
          LATEST_FLAG="--latest"
        fi
        INV_ID_ARG=""
        if [ -n "{{.INVESTIGATION_ID}}" ]; then
          INV_ID_ARG="{{.INVESTIGATION_ID}}"
        fi
        JSON_FLAG=""
        if [ "{{.JSON}}" = "true" ]; then
          JSON_FLAG="--json-output"
        fi
        kubectl exec -i -n {{.K8S_NAMESPACE}} deploy/ares-blue-orchestrator -- python3 -m ares.cli_blue_ops evidence $INV_ID_ARG $LATEST_FLAG $JSON_FLAG

  multi:techniques:
    desc: "Show MITRE techniques identified (usage: task blue:multi:techniques [INVESTIGATION_ID=inv-xxx] [LATEST=true])"
    silent: true
    vars:
      INVESTIGATION_ID: '{{.INVESTIGATION_ID | default ""}}'
      LATEST: '{{.LATEST | default ""}}'
    preconditions:
      - sh: test -n "{{.INVESTIGATION_ID}}" || test "{{.LATEST}}" = "true"
        msg: "Either INVESTIGATION_ID or LATEST=true is required"
    cmds:
      - |
        LATEST_FLAG=""
        if [ "{{.LATEST}}" = "true" ]; then
          LATEST_FLAG="--latest"
        fi
        INV_ID_ARG=""
        if [ -n "{{.INVESTIGATION_ID}}" ]; then
          INV_ID_ARG="{{.INVESTIGATION_ID}}"
        fi
        kubectl exec -i -n {{.K8S_NAMESPACE}} deploy/ares-blue-orchestrator -- python3 -m ares.cli_blue_ops techniques $INV_ID_ARG $LATEST_FLAG

  multi:runtime:
    desc: "Show runtime for an investigation (usage: task blue:multi:runtime [INVESTIGATION_ID=inv-xxx] [LATEST=true])"
    silent: true
    vars:
      INVESTIGATION_ID: '{{.INVESTIGATION_ID | default ""}}'
      LATEST: '{{.LATEST | default ""}}'
    preconditions:
      - sh: test -n "{{.INVESTIGATION_ID}}" || test "{{.LATEST}}" = "true"
        msg: "Either INVESTIGATION_ID or LATEST=true is required"
    cmds:
      - |
        LATEST_FLAG=""
        if [ "{{.LATEST}}" = "true" ]; then
          LATEST_FLAG="--latest"
        fi
        INV_ID_ARG=""
        if [ -n "{{.INVESTIGATION_ID}}" ]; then
          INV_ID_ARG="{{.INVESTIGATION_ID}}"
        fi
        kubectl exec -i -n {{.K8S_NAMESPACE}} deploy/ares-blue-orchestrator -- python3 -m ares.cli_blue_ops runtime $INV_ID_ARG $LATEST_FLAG

  multi:delete:
    desc: "Delete an investigation and all its data (usage: task blue:multi:delete INVESTIGATION_ID=inv-xxx)"
    silent: true
    vars:
      INVESTIGATION_ID: '{{.INVESTIGATION_ID | default ""}}'
    preconditions:
      - sh: test -n "{{.INVESTIGATION_ID}}"
        msg: "INVESTIGATION_ID variable is required"
    cmds:
      - kubectl exec -i -n {{.K8S_NAMESPACE}} deploy/ares-blue-orchestrator -- python3 -m ares.cli_blue_ops delete "{{.INVESTIGATION_ID}}" --force

  multi:cleanup:
    desc: "Clean up old investigations (usage: task blue:multi:cleanup [MAX_AGE_HOURS=24])"
    silent: true
    vars:
      MAX_AGE_HOURS: '{{.MAX_AGE_HOURS | default "24"}}'
    cmds:
      - kubectl exec -i -n {{.K8S_NAMESPACE}} deploy/ares-blue-orchestrator -- python3 -m ares.cli_blue_ops cleanup --max-age-hours {{.MAX_AGE_HOURS}}

  multi:logs:
    desc: "Follow blue orchestrator logs"
    silent: true
    cmds:
      - kubectl logs -f -n {{.K8S_NAMESPACE}} deploy/ares-blue-orchestrator
