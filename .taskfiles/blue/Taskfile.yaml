---
# Blue Team Tasks
version: "3"

vars:
  # Rust CLI binary path (passed from parent Taskfile)
  ARES_CLI: '{{.ARES_CLI | default "./target/release/ares-cli"}}'
  # AWS defaults for Grafana access
  PROFILE: '{{.PROFILE | default "infrastructure"}}'
  REGION: '{{.REGION | default "us-west-2"}}'

  # 1Password API keys (shared across tasks) - read from .env if exists, otherwise 1Password
  ANTHROPIC_API_KEY:
    sh: grep -E '^ANTHROPIC_API_KEY=' .env 2>/dev/null | cut -d= -f2- | tr -d '"' || op item get "Dreadnode Claude" --fields api-key --reveal 2>/dev/null || echo ""
  DREADNODE_API_KEY:
    sh: grep -E '^DREADNODE_API_KEY=' .env 2>/dev/null | cut -d= -f2- | tr -d '"' || op item get "Dreadnode Dev Platform" --fields api-key --reveal 2>/dev/null || echo ""
  GRAFANA_SERVICE_ACCOUNT_TOKEN:
    sh: grep -E '^GRAFANA_SERVICE_ACCOUNT_TOKEN=' .env 2>/dev/null | cut -d= -f2- | tr -d '"' || op item get "Ares Grafana MCP" --fields api-token --reveal 2>/dev/null || echo ""
  OPENAI_API_KEY:
    sh: grep -E '^OPENAI_API_KEY=' .env 2>/dev/null | cut -d= -f2- | tr -d '"' || op item get "Dreadnode Openai" --fields dreadnode-ares-api-key --reveal 2>/dev/null || echo ""

  # Model selection (MODEL is a simple override, config file is source of truth)
  MODEL_ARG: '{{.MODEL}}'

tasks:
  # ===========================================================================
  # Blue Team Agent Tasks
  # ===========================================================================

  poll:
    desc: "Submit blue investigation from latest operation, re-polling every POLL_INTERVAL seconds"
    silent: true
    cmds:
      - |
        export ANTHROPIC_API_KEY="{{.ANTHROPIC_API_KEY}}"
        export GRAFANA_SERVICE_ACCOUNT_TOKEN="{{.GRAFANA_SERVICE_ACCOUNT_TOKEN}}"
        export OPENAI_API_KEY="{{.OPENAI_API_KEY}}"

        mkdir -p {{.LOG_DIR}}
        LOGFILE="{{.LOG_DIR}}/blue-$(date +%Y%m%d-%H%M%S).log"
        echo "Logging to: $LOGFILE"
        echo "Poll interval: {{.POLL_INTERVAL}}s"
        echo "NOTE: Continuous polling is handled by the Rust orchestrator with ARES_BLUE_ENABLED=1."
        echo "      This task submits from-operation investigations on a timer as a local fallback."
        echo ""

        while true; do
          echo "[$(date)] Submitting blue investigation from latest operation..."
          MODEL_FLAG=""
          if [ -n "{{.MODEL_ARG}}" ]; then
            MODEL_FLAG="--model {{.MODEL_ARG}}"
          fi
          {{.ARES_CLI}} blue from-operation --latest \
            $MODEL_FLAG \
            --max-steps {{.MAX_STEPS_BLUE}} \
            --grafana-url {{.GRAFANA_URL}} \
            2>&1 | tee -a "$LOGFILE"
          echo "[$(date)] Sleeping {{.POLL_INTERVAL}}s..."
          sleep {{.POLL_INTERVAL}}
        done

  poll:local:
    desc: "Submit blue investigation from latest operation using .env file, re-polling every POLL_INTERVAL seconds"
    silent: true
    preconditions:
      - sh: test -f .env
        msg: ".env file not found"
    cmds:
      - |
        set -a
        . ./.env
        set +a

        mkdir -p {{.LOG_DIR}}
        LOGFILE="{{.LOG_DIR}}/blue-$(date +%Y%m%d-%H%M%S).log"
        echo "Logging to: $LOGFILE"
        echo "Poll interval: {{.POLL_INTERVAL}}s"
        echo ""

        while true; do
          echo "[$(date)] Submitting blue investigation from latest operation..."
          MODEL_FLAG=""
          if [ -n "{{.MODEL_ARG}}" ]; then
            MODEL_FLAG="--model {{.MODEL_ARG}}"
          fi
          {{.ARES_CLI}} blue from-operation --latest \
            $MODEL_FLAG \
            --max-steps {{.MAX_STEPS_BLUE}} \
            --grafana-url {{.GRAFANA_URL}} \
            2>&1 | tee -a "$LOGFILE"
          echo "[$(date)] Sleeping {{.POLL_INTERVAL}}s..."
          sleep {{.POLL_INTERVAL}}
        done

  once:
    desc: "Submit one blue investigation from a red team operation (usage: task blue:once [OPERATION_ID=op-xxx] [LATEST=true])"
    silent: true
    vars:
      OPERATION_ID: '{{.OPERATION_ID | default ""}}'
      LATEST: '{{.LATEST | default ""}}'
    cmds:
      - |
        export ANTHROPIC_API_KEY="{{.ANTHROPIC_API_KEY}}"
        export GRAFANA_SERVICE_ACCOUNT_TOKEN="{{.GRAFANA_SERVICE_ACCOUNT_TOKEN}}"
        export OPENAI_API_KEY="{{.OPENAI_API_KEY}}"

        mkdir -p {{.LOG_DIR}}
        LOGFILE="{{.LOG_DIR}}/blue-$(date +%Y%m%d-%H%M%S).log"
        echo "Logging to: $LOGFILE"

        # Build operation context args
        OP_ARGS=""
        if [ "{{.LATEST}}" = "true" ]; then
          OP_ARGS="--latest"
        elif [ -n "{{.OPERATION_ID}}" ]; then
          OP_ARGS="{{.OPERATION_ID}}"
        fi

        MODEL_FLAG=""
        if [ -n "{{.MODEL_ARG}}" ]; then
          MODEL_FLAG="--model {{.MODEL_ARG}}"
        fi

        {{.ARES_CLI}} blue from-operation $OP_ARGS \
          $MODEL_FLAG \
          --max-steps {{.MAX_STEPS_BLUE_ONCE}} \
          --grafana-url {{.GRAFANA_URL}} \
          2>&1 | tee -a "$LOGFILE"

  once:remote:
    desc: "Submit blue investigation on K8s cluster (usage: task blue:once:remote [OPERATION_ID=op-xxx] [LATEST=true])"
    silent: true
    vars:
      OPERATION_ID: '{{.OPERATION_ID | default ""}}'
      LATEST: '{{.LATEST | default ""}}'
    preconditions:
      - sh: test -n "{{.OPERATION_ID}}" || test "{{.LATEST}}" = "true"
        msg: "Either OPERATION_ID or LATEST=true is required. Usage: task blue:once:remote OPERATION_ID=op-xxx  OR  task blue:once:remote LATEST=true"
    cmds:
      - |
        echo "Submitting blue investigation on K8s cluster..."
        echo "K8s namespace: {{.K8S_NAMESPACE}}"
        echo ""

        # Build operation context args
        OP_ARGS=""
        if [ "{{.LATEST}}" = "true" ]; then
          OP_ARGS="--latest"
        elif [ -n "{{.OPERATION_ID}}" ]; then
          OP_ARGS="{{.OPERATION_ID}}"
        fi

        MODEL_FLAG=""
        if [ -n "{{.MODEL_ARG}}" ]; then
          MODEL_FLAG="--model {{.MODEL_ARG}}"
        fi

        kubectl exec -i -n {{.K8S_NAMESPACE}} deploy/ares-blue-orchestrator -- \
          env OPENAI_API_KEY="{{.OPENAI_API_KEY}}" \
          ANTHROPIC_API_KEY="{{.ANTHROPIC_API_KEY}}" \
          GRAFANA_SERVICE_ACCOUNT_TOKEN="{{.GRAFANA_SERVICE_ACCOUNT_TOKEN}}" \
          GRAFANA_URL="{{.GRAFANA_URL}}" \
          ares-cli blue from-operation $OP_ARGS \
          $MODEL_FLAG \
          --max-steps {{.MAX_STEPS_BLUE_ONCE}} \
          --grafana-url "{{.GRAFANA_URL}}"

  once:local:
    desc: "Submit one blue investigation using .env file (usage: task blue:once:local [OPERATION_ID=op-xxx] [LATEST=true])"
    silent: true
    vars:
      OPERATION_ID: '{{.OPERATION_ID | default ""}}'
      LATEST: '{{.LATEST | default ""}}'
    preconditions:
      - sh: test -f .env
        msg: ".env file not found"
    cmds:
      - |
        set -a
        . ./.env
        set +a

        mkdir -p {{.LOG_DIR}}
        LOGFILE="{{.LOG_DIR}}/blue-$(date +%Y%m%d-%H%M%S).log"
        echo "Logging to: $LOGFILE"

        # Build operation context args
        OP_ARGS=""
        if [ "{{.LATEST}}" = "true" ]; then
          OP_ARGS="--latest"
        elif [ -n "{{.OPERATION_ID}}" ]; then
          OP_ARGS="{{.OPERATION_ID}}"
        fi

        MODEL_FLAG=""
        if [ -n "{{.MODEL_ARG}}" ]; then
          MODEL_FLAG="--model {{.MODEL_ARG}}"
        fi

        {{.ARES_CLI}} blue from-operation $OP_ARGS \
          $MODEL_FLAG \
          --max-steps {{.MAX_STEPS_BLUE_ONCE}} \
          --grafana-url {{.GRAFANA_URL}} \
          2>&1 | tee -a "$LOGFILE"

  investigate:
    desc: "Submit a specific alert for investigation (usage: task blue:investigate ALERT=alert.json)"
    silent: true
    vars:
      ALERT: '{{.ALERT | default ""}}'
    preconditions:
      - sh: test -n "{{.ALERT}}"
        msg: "ALERT variable is required. Usage: task blue:investigate ALERT=alert.json"
      - sh: test -f "{{.ALERT}}"
        msg: "Alert file not found: {{.ALERT}}"
    cmds:
      - |
        export ANTHROPIC_API_KEY="{{.ANTHROPIC_API_KEY}}"
        export GRAFANA_SERVICE_ACCOUNT_TOKEN="{{.GRAFANA_SERVICE_ACCOUNT_TOKEN}}"
        export OPENAI_API_KEY="{{.OPENAI_API_KEY}}"

        MODEL_FLAG=""
        if [ -n "{{.MODEL_ARG}}" ]; then
          MODEL_FLAG="--model {{.MODEL_ARG}}"
        fi

        {{.ARES_CLI}} blue submit {{.ALERT}} \
          $MODEL_FLAG \
          --max-steps {{.MAX_STEPS_BLUE_ONCE}} \
          --grafana-url {{.GRAFANA_URL}}

  # ===========================================================================
  # Reports
  # ===========================================================================

  reports:list:
    desc: List all investigation reports
    silent: true
    cmds:
      - |
        echo "Investigation Reports:"
        echo "======================"
        if [ -d {{.REPORT_DIR}} ]; then
          ls -lht {{.REPORT_DIR}}/*.md 2>/dev/null || echo "No reports found"
        else
          echo "Report directory not found: {{.REPORT_DIR}}"
        fi

  reports:latest:
    desc: Show the latest investigation report
    silent: true
    cmds:
      - |
        LATEST=$(ls -t {{.REPORT_DIR}}/*.md 2>/dev/null | head -1)
        if [ -n "$LATEST" ]; then
          echo "Latest report: $LATEST"
          echo "===================="
          cat "$LATEST"
        else
          echo "No reports found in {{.REPORT_DIR}}"
        fi

  playbook:
    desc: "Export detection playbook from red team operation (usage: task blue:playbook [OPERATION_ID=op-xxx] [LATEST=true])"
    silent: true
    vars:
      OPERATION_ID: '{{.OPERATION_ID | default ""}}'
      LATEST: '{{.LATEST | default ""}}'
      OUTPUT_DIR: '{{.OUTPUT_DIR | default "./reports"}}'
      JSON: '{{.JSON | default "false"}}'
    preconditions:
      - sh: test -n "{{.OPERATION_ID}}" || test "{{.LATEST}}" = "true"
        msg: "Either OPERATION_ID or LATEST=true is required. Usage: task blue:playbook OPERATION_ID=op-xxx  OR  task blue:playbook LATEST=true"
    cmds:
      - cmd: mkdir -p "{{.OUTPUT_DIR}}"
        silent: true
      - |
        LATEST_FLAG=""
        if [ "{{.LATEST}}" = "true" ]; then
          LATEST_FLAG="--latest"
        fi
        OP_ID_ARG=""
        if [ -n "{{.OPERATION_ID}}" ]; then
          OP_ID_ARG="{{.OPERATION_ID}}"
        fi
        JSON_FLAG=""
        if [ "{{.JSON}}" = "true" ]; then
          JSON_FLAG="--json"
        fi
        kubectl exec -i -n {{.K8S_NAMESPACE}} deploy/ares-orchestrator -- ares-cli ops export-detection $OP_ID_ARG $LATEST_FLAG $JSON_FLAG --output-dir /tmp/reports

        # Get the operation ID if we used --latest
        if [ -n "$LATEST_FLAG" ]; then
          RESOLVED_OP_ID=$(kubectl exec -i -n {{.K8S_NAMESPACE}} deploy/ares-orchestrator -- ares-cli ops list --latest 2>/dev/null | tr -d '\n')
        else
          RESOLVED_OP_ID="{{.OPERATION_ID}}"
        fi

        # Copy playbook files from pod to local machine
        if [ -n "$RESOLVED_OP_ID" ]; then
          ORCH_POD=$(kubectl get pods -n {{.K8S_NAMESPACE}} -l app.kubernetes.io/name=ares-orchestrator -o jsonpath='{.items[0].metadata.name}')
          kubectl cp "{{.K8S_NAMESPACE}}/${ORCH_POD}:/tmp/reports/${RESOLVED_OP_ID}_detection_playbook.json" "{{.OUTPUT_DIR}}/${RESOLVED_OP_ID}_detection_playbook.json" 2>/dev/null || true
          kubectl cp "{{.K8S_NAMESPACE}}/${ORCH_POD}:/tmp/reports/${RESOLVED_OP_ID}_detection_playbook.md" "{{.OUTPUT_DIR}}/${RESOLVED_OP_ID}_detection_playbook.md" 2>/dev/null || true
          if [ -f "{{.OUTPUT_DIR}}/${RESOLVED_OP_ID}_detection_playbook.json" ]; then
            echo "Detection playbook saved to: {{.OUTPUT_DIR}}/${RESOLVED_OP_ID}_detection_playbook.json"
            echo "Detection playbook saved to: {{.OUTPUT_DIR}}/${RESOLVED_OP_ID}_detection_playbook.md"
          fi
        fi

  playbook:local:
    desc: "Export detection playbook locally using .env file (usage: task blue:playbook:local [OPERATION_ID=op-xxx] [LATEST=true])"
    silent: true
    vars:
      OPERATION_ID: '{{.OPERATION_ID | default ""}}'
      LATEST: '{{.LATEST | default ""}}'
      OUTPUT_DIR: '{{.OUTPUT_DIR | default "./reports"}}'
      JSON: '{{.JSON | default "false"}}'
    preconditions:
      - sh: test -f .env
        msg: ".env file not found"
      - sh: test -n "{{.OPERATION_ID}}" || test "{{.LATEST}}" = "true"
        msg: "Either OPERATION_ID or LATEST=true is required. Usage: task blue:playbook:local OPERATION_ID=op-xxx  OR  task blue:playbook:local LATEST=true"
    cmds:
      - cmd: mkdir -p "{{.OUTPUT_DIR}}"
        silent: true
      - |
        set -a
        . ./.env
        set +a

        LATEST_FLAG=""
        if [ "{{.LATEST}}" = "true" ]; then
          LATEST_FLAG="--latest"
        fi
        OP_ID_ARG=""
        if [ -n "{{.OPERATION_ID}}" ]; then
          OP_ID_ARG="{{.OPERATION_ID}}"
        fi
        JSON_FLAG=""
        if [ "{{.JSON}}" = "true" ]; then
          JSON_FLAG="--json"
        fi
        {{.ARES_CLI}} ops export-detection $OP_ID_ARG $LATEST_FLAG $JSON_FLAG --output-dir "{{.OUTPUT_DIR}}"

  reports:consolidate:
    desc: "Generate a consolidated report from Redis state (usage: task blue:reports:consolidate [OPERATION_ID=op-xxx] [LATEST=true])"
    silent: true
    vars:
      OPERATION_ID: '{{.OPERATION_ID | default ""}}'
      LATEST: '{{.LATEST | default ""}}'
      OUTPUT_DIR: '{{.OUTPUT_DIR | default "./reports"}}'
    preconditions:
      - sh: test -n "{{.OPERATION_ID}}" || test "{{.LATEST}}" = "true"
        msg: "Either OPERATION_ID or LATEST=true is required"
    cmds:
      - cmd: mkdir -p "{{.OUTPUT_DIR}}"
        silent: true
      - |
        LATEST_FLAG=""
        if [ "{{.LATEST}}" = "true" ]; then
          LATEST_FLAG="--latest"
        fi
        OP_ID_ARG=""
        if [ -n "{{.OPERATION_ID}}" ]; then
          OP_ID_ARG="--operation-id {{.OPERATION_ID}}"
        fi
        {{.ARES_CLI}} blue report $OP_ID_ARG $LATEST_FLAG --output-dir "{{.OUTPUT_DIR}}"

  reports:clean:
    desc: Remove all investigation reports
    silent: true
    cmds:
      - |
        read -p "Delete all reports in {{.REPORT_DIR}}? (y/N) " -n 1 -r
        echo
        if [[ $REPLY =~ ^[Yy]$ ]]; then
          rm -rf {{.REPORT_DIR}}/*.md
          echo "✅ Reports cleaned"
        fi

  # ===========================================================================
  # Development / Testing
  # ===========================================================================

  mitre:test:
    desc: Test MITRE ATT&CK data loading (requires Python ares module)
    silent: true
    cmds:
      - |
        if ! command -v uv &>/dev/null; then
          echo "uv not found. This task requires the Python ares module."
          exit 1
        fi
        uv run python -c "
        import asyncio
        from ares.integrations.mitre import MITREAttackClient

        async def test():
            client = MITREAttackClient()
            await client.load()
            print(f'Loaded {len(client._techniques)} techniques')
            print(f'Loaded {len(client._tactics)} tactics')

            # Show a sample technique
            sample = list(client._techniques.values())[0]
            print(f'\nSample technique:')
            print(f'  ID: {sample.id}')
            print(f'  Name: {sample.name}')
            print(f'  Tactic: {sample.tactic}')

        asyncio.run(test())
        "

  # ===========================================================================
  # Multi-Agent Blue Team Tasks (via K8s orchestrator service)
  # ===========================================================================

  multi:
    desc: "Submit investigation to blue orchestrator (usage: task blue:multi ALERT=alert.json [INVESTIGATION_ID=inv-xxx])"
    silent: true
    vars:
      ALERT: '{{.ALERT | default ""}}'
      INVESTIGATION_ID: '{{.INVESTIGATION_ID | default ""}}'
      MULTI_AGENT: '{{.MULTI_AGENT | default "false"}}'
      MODEL_ARG: '{{.MODEL}}'
    preconditions:
      - sh: test -n "{{.ALERT}}"
        msg: "ALERT variable is required. Usage: task blue:multi ALERT=alert.json"
      - sh: test -f "{{.ALERT}}"
        msg: "Alert file not found: {{.ALERT}}"
    cmds:
      - |
        echo "Submitting investigation to blue orchestrator service..."
        echo "Alert file: {{.ALERT}}"
        echo "K8s namespace: {{.K8S_NAMESPACE}}"
        echo ""

        INV_ID_ARG=""
        if [ -n "{{.INVESTIGATION_ID}}" ]; then
          INV_ID_ARG="--investigation-id {{.INVESTIGATION_ID}}"
        fi

        MULTI_AGENT_FLAG=""
        if [ "{{.MULTI_AGENT}}" = "true" ]; then
          MULTI_AGENT_FLAG="--multi-agent"
        fi

        MODEL_FLAG=""
        if [ -n "{{.MODEL_ARG}}" ]; then
          MODEL_FLAG="--model {{.MODEL_ARG}}"
        fi

        kubectl exec -i -n {{.K8S_NAMESPACE}} deploy/ares-blue-orchestrator -- \
          env OPENAI_API_KEY="{{.OPENAI_API_KEY}}" \
          ANTHROPIC_API_KEY="{{.ANTHROPIC_API_KEY}}" \
          GRAFANA_SERVICE_ACCOUNT_TOKEN="{{.GRAFANA_SERVICE_ACCOUNT_TOKEN}}" \
          GRAFANA_URL="{{.GRAFANA_URL}}" \
          ares-cli blue submit "$(cat {{.ALERT}})" \
          $INV_ID_ARG \
          $MODEL_FLAG \
          --max-steps {{.MAX_STEPS_BLUE}} \
          $MULTI_AGENT_FLAG

  multi:local:
    desc: "Submit investigation using .env file (usage: task blue:multi:local ALERT=alert.json)"
    silent: true
    vars:
      ALERT: '{{.ALERT | default ""}}'
      INVESTIGATION_ID: '{{.INVESTIGATION_ID | default ""}}'
      MULTI_AGENT: '{{.MULTI_AGENT | default "false"}}'
      MODEL_ARG: '{{.MODEL}}'
    preconditions:
      - sh: test -f .env
        msg: ".env file not found"
      - sh: test -n "{{.ALERT}}"
        msg: "ALERT variable is required. Usage: task blue:multi:local ALERT=alert.json"
      - sh: test -f "{{.ALERT}}"
        msg: "Alert file not found: {{.ALERT}}"
    cmds:
      - |
        set -a
        . ./.env
        set +a

        echo "Submitting investigation to blue orchestrator service..."
        echo "Alert file: {{.ALERT}}"
        echo ""

        INV_ID_ARG=""
        if [ -n "{{.INVESTIGATION_ID}}" ]; then
          INV_ID_ARG="--investigation-id {{.INVESTIGATION_ID}}"
        fi

        MULTI_AGENT_FLAG=""
        if [ "{{.MULTI_AGENT}}" = "true" ]; then
          MULTI_AGENT_FLAG="--multi-agent"
        fi

        MODEL_FLAG=""
        if [ -n "{{.MODEL_ARG}}" ]; then
          MODEL_FLAG="--model {{.MODEL_ARG}}"
        fi

        {{.ARES_CLI}} blue submit {{.ALERT}} \
          $INV_ID_ARG \
          $MODEL_FLAG \
          --max-steps {{.MAX_STEPS_BLUE}} \
          --grafana-url {{.GRAFANA_URL}} \
          $MULTI_AGENT_FLAG

  multi:remote:
    desc: "Submit multi-agent blue investigation from red team operation (usage: task blue:multi:remote [OPERATION_ID=op-xxx] [LATEST=true])"
    silent: true
    vars:
      OPERATION_ID: '{{.OPERATION_ID | default ""}}'
      LATEST: '{{.LATEST | default ""}}'
      MODEL_ARG: '{{.MODEL}}'
    preconditions:
      - sh: test -n "{{.OPERATION_ID}}" || test "{{.LATEST}}" = "true"
        msg: "Either OPERATION_ID or LATEST=true is required. Usage: task blue:multi:remote OPERATION_ID=op-xxx  OR  task blue:multi:remote LATEST=true"
    cmds:
      - |
        echo "Submitting multi-agent blue investigation from red team operation..."
        echo "K8s namespace: {{.K8S_NAMESPACE}}"
        echo ""

        # Build operation context args
        OP_ARGS=""
        if [ "{{.LATEST}}" = "true" ]; then
          OP_ARGS="--latest"
        elif [ -n "{{.OPERATION_ID}}" ]; then
          OP_ARGS="{{.OPERATION_ID}}"
        fi

        MODEL_FLAG=""
        if [ -n "{{.MODEL_ARG}}" ]; then
          MODEL_FLAG="--model {{.MODEL_ARG}}"
        fi

        kubectl exec -i -n {{.K8S_NAMESPACE}} deploy/ares-blue-orchestrator -- \
          env OPENAI_API_KEY="{{.OPENAI_API_KEY}}" \
          ANTHROPIC_API_KEY="{{.ANTHROPIC_API_KEY}}" \
          GRAFANA_SERVICE_ACCOUNT_TOKEN="{{.GRAFANA_SERVICE_ACCOUNT_TOKEN}}" \
          GRAFANA_URL="{{.GRAFANA_URL}}" \
          ares-cli blue from-operation $OP_ARGS \
          $MODEL_FLAG \
          --max-steps {{.MAX_STEPS_BLUE}} \
          --grafana-url "{{.GRAFANA_URL}}"

  multi:status:
    desc: "Check investigation status (usage: task blue:multi:status [INVESTIGATION_ID=inv-xxx] [LATEST=true])"
    silent: true
    vars:
      INVESTIGATION_ID: '{{.INVESTIGATION_ID | default ""}}'
      LATEST: '{{.LATEST | default ""}}'
    preconditions:
      - sh: test -n "{{.INVESTIGATION_ID}}" || test "{{.LATEST}}" = "true"
        msg: "Either INVESTIGATION_ID or LATEST=true is required"
    cmds:
      - |
        LATEST_FLAG=""
        if [ "{{.LATEST}}" = "true" ]; then
          LATEST_FLAG="--latest"
        fi
        INV_ID_ARG=""
        if [ -n "{{.INVESTIGATION_ID}}" ]; then
          INV_ID_ARG="{{.INVESTIGATION_ID}}"
        fi
        kubectl exec -i -n {{.K8S_NAMESPACE}} deploy/ares-blue-orchestrator -- ares-cli blue status $INV_ID_ARG $LATEST_FLAG

  multi:list:
    desc: "List all investigations"
    silent: true
    cmds:
      - kubectl exec -i -n {{.K8S_NAMESPACE}} deploy/ares-blue-orchestrator -- ares-cli blue list

  multi:evidence:
    desc: "Show evidence for an investigation (usage: task blue:multi:evidence [INVESTIGATION_ID=inv-xxx] [LATEST=true])"
    silent: true
    vars:
      INVESTIGATION_ID: '{{.INVESTIGATION_ID | default ""}}'
      LATEST: '{{.LATEST | default ""}}'
      JSON: '{{.JSON | default "false"}}'
    preconditions:
      - sh: test -n "{{.INVESTIGATION_ID}}" || test "{{.LATEST}}" = "true"
        msg: "Either INVESTIGATION_ID or LATEST=true is required"
    cmds:
      - |
        LATEST_FLAG=""
        if [ "{{.LATEST}}" = "true" ]; then
          LATEST_FLAG="--latest"
        fi
        INV_ID_ARG=""
        if [ -n "{{.INVESTIGATION_ID}}" ]; then
          INV_ID_ARG="{{.INVESTIGATION_ID}}"
        fi
        JSON_FLAG=""
        if [ "{{.JSON}}" = "true" ]; then
          JSON_FLAG="--json"
        fi
        kubectl exec -i -n {{.K8S_NAMESPACE}} deploy/ares-blue-orchestrator -- ares-cli blue evidence $INV_ID_ARG $LATEST_FLAG $JSON_FLAG

  multi:techniques:
