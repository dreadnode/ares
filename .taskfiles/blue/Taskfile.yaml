---
# Blue Team Tasks
version: "3"

vars:
  # AWS defaults for Grafana access
  PROFILE: '{{.PROFILE | default "infrastructure"}}'
  REGION: '{{.REGION | default "us-west-2"}}'

tasks:
  # ===========================================================================
  # Blue Team Agent Tasks
  # ===========================================================================

  poll:
    desc: "Run blue team agent in poll mode (uses 1Password for API keys)"
    silent: true
    vars:
      ANTHROPIC_API_KEY:
        sh: op item get "claude.ai" --fields dreadnode-api-key --reveal 2>/dev/null || echo ""
      DREADNODE_API_KEY:
        sh: op item get "Dreadnode Dev Platform" --fields api-key --reveal 2>/dev/null || echo ""
      GRAFANA_SERVICE_ACCOUNT_TOKEN:
        sh: op item get "Ares Grafana MCP" --fields grafana-token --reveal 2>/dev/null || echo ""
      OPENAI_API_KEY:
        sh: op item get "Openai" --fields dreadnode-api-key --reveal 2>/dev/null || echo ""
      MODEL_ARG:
        sh: |
          if [ -n "{{.MODEL_ALL}}" ]; then
            echo "{{.MODEL_ALL}}"
          else
            echo "{{.MODEL}}"
          fi
    cmds:
      - |
        # Verify AWS auth
        if ! aws sts get-caller-identity --profile "{{.PROFILE}}" --region "{{.REGION}}" >/dev/null 2>&1; then
            echo "AWS authentication failed for profile: {{.PROFILE}}"
            echo "Run: aws sso login --profile {{.PROFILE}}"
            exit 1
        fi

        export ANTHROPIC_API_KEY="{{.ANTHROPIC_API_KEY}}"
        export DREADNODE_API_KEY="{{.DREADNODE_API_KEY}}"
        export GRAFANA_SERVICE_ACCOUNT_TOKEN="{{.GRAFANA_SERVICE_ACCOUNT_TOKEN}}"
        export OPENAI_API_KEY="{{.OPENAI_API_KEY}}"

        mkdir -p {{.LOG_DIR}}
        LOGFILE="{{.LOG_DIR}}/blue-$(date +%Y%m%d-%H%M%S).log"
        echo "Logging to: $LOGFILE"

        uv run python -m ares \
          --args.model "{{.MODEL_ARG}}" \
          --args.grafana-url {{.GRAFANA_URL}} \
          --args.poll-interval {{.POLL_INTERVAL}} \
          --args.max-steps {{.MAX_STEPS_BLUE}} \
          --args.report-dir {{.REPORT_DIR}} \
          --dn-args.server {{.DREADNODE_SERVER_URL}} \
          --dn-args.token "$DREADNODE_API_KEY" \
          --dn-args.organization {{.DREADNODE_ORGANIZATION}} \
          --dn-args.workspace {{.DREADNODE_WORKSPACE}} \
          --dn-args.project {{.DREADNODE_PROJECT}} \
          2>&1 | tee -a "$LOGFILE"

  poll:local:
    desc: "Run blue team agent in poll mode using .env file"
    silent: true
    vars:
      MODEL_ARG:
        sh: |
          if [ -n "{{.MODEL_ALL}}" ]; then
            echo "{{.MODEL_ALL}}"
          else
            echo "{{.MODEL}}"
          fi
    preconditions:
      - sh: test -f .env
        msg: ".env file not found"
    cmds:
      - |
        # Verify AWS auth
        if ! aws sts get-caller-identity --profile "{{.PROFILE}}" --region "{{.REGION}}" >/dev/null 2>&1; then
            echo "AWS authentication failed for profile: {{.PROFILE}}"
            echo "Run: aws sso login --profile {{.PROFILE}}"
            exit 1
        fi

        set -a
        . ./.env
        set +a

        mkdir -p {{.LOG_DIR}}
        LOGFILE="{{.LOG_DIR}}/blue-$(date +%Y%m%d-%H%M%S).log"
        echo "Logging to: $LOGFILE"

        uv run python -m ares \
          --args.model "{{.MODEL_ARG}}" \
          --args.grafana-url {{.GRAFANA_URL}} \
          --args.poll-interval {{.POLL_INTERVAL}} \
          --args.max-steps {{.MAX_STEPS_BLUE}} \
          --args.report-dir {{.REPORT_DIR}} \
          --dn-args.server {{.DREADNODE_SERVER_URL}} \
          --dn-args.organization {{.DREADNODE_ORGANIZATION}} \
          --dn-args.workspace {{.DREADNODE_WORKSPACE}} \
          --dn-args.project {{.DREADNODE_PROJECT}} \
          2>&1 | tee -a "$LOGFILE"

  once:
    desc: "Run blue team agent once and exit (uses 1Password for API keys)"
    silent: true
    vars:
      ANTHROPIC_API_KEY:
        sh: op item get "claude.ai" --fields dreadnode-api-key --reveal 2>/dev/null || echo ""
      DREADNODE_API_KEY:
        sh: op item get "Dreadnode Dev Platform" --fields api-key --reveal 2>/dev/null || echo ""
      GRAFANA_SERVICE_ACCOUNT_TOKEN:
        sh: op item get "Ares Grafana MCP" --fields grafana-token --reveal 2>/dev/null || echo ""
      OPENAI_API_KEY:
        sh: op item get "Openai" --fields dreadnode-api-key --reveal 2>/dev/null || echo ""
      MODEL_ARG:
        sh: |
          if [ -n "{{.MODEL_ALL}}" ]; then
            echo "{{.MODEL_ALL}}"
          else
            echo "{{.MODEL}}"
          fi
    cmds:
      - |
        # Verify AWS auth
        if ! aws sts get-caller-identity --profile "{{.PROFILE}}" --region "{{.REGION}}" >/dev/null 2>&1; then
            echo "AWS authentication failed for profile: {{.PROFILE}}"
            echo "Run: aws sso login --profile {{.PROFILE}}"
            exit 1
        fi

        export ANTHROPIC_API_KEY="{{.ANTHROPIC_API_KEY}}"
        export DREADNODE_API_KEY="{{.DREADNODE_API_KEY}}"
        export GRAFANA_SERVICE_ACCOUNT_TOKEN="{{.GRAFANA_SERVICE_ACCOUNT_TOKEN}}"
        export OPENAI_API_KEY="{{.OPENAI_API_KEY}}"

        mkdir -p {{.LOG_DIR}}
        LOGFILE="{{.LOG_DIR}}/blue-$(date +%Y%m%d-%H%M%S).log"
        echo "Logging to: $LOGFILE"

        uv run python -m ares \
          --args.model "{{.MODEL_ARG}}" \
          --args.grafana-url {{.GRAFANA_URL}} \
          --args.poll-interval {{.POLL_INTERVAL}} \
          --args.max-steps {{.MAX_STEPS_BLUE_ONCE}} \
          --args.report-dir {{.REPORT_DIR}} \
          --args.once \
          --dn-args.server {{.DREADNODE_SERVER_URL}} \
          --dn-args.token "$DREADNODE_API_KEY" \
          --dn-args.organization {{.DREADNODE_ORGANIZATION}} \
          --dn-args.workspace {{.DREADNODE_WORKSPACE}} \
          --dn-args.project {{.DREADNODE_PROJECT}} \
          2>&1 | tee -a "$LOGFILE"

  once:local:
    desc: "Run blue team agent once and exit using .env file"
    silent: true
    vars:
      MODEL_ARG:
        sh: |
          if [ -n "{{.MODEL_ALL}}" ]; then
            echo "{{.MODEL_ALL}}"
          else
            echo "{{.MODEL}}"
          fi
    preconditions:
      - sh: test -f .env
        msg: ".env file not found"
    cmds:
      - |
        # Verify AWS auth
        if ! aws sts get-caller-identity --profile "{{.PROFILE}}" --region "{{.REGION}}" >/dev/null 2>&1; then
            echo "AWS authentication failed for profile: {{.PROFILE}}"
            echo "Run: aws sso login --profile {{.PROFILE}}"
            exit 1
        fi

        set -a
        . ./.env
        set +a

        mkdir -p {{.LOG_DIR}}
        LOGFILE="{{.LOG_DIR}}/blue-$(date +%Y%m%d-%H%M%S).log"
        echo "Logging to: $LOGFILE"

        uv run python -m ares \
          --args.model "{{.MODEL_ARG}}" \
          --args.grafana-url {{.GRAFANA_URL}} \
          --args.poll-interval {{.POLL_INTERVAL}} \
          --args.max-steps {{.MAX_STEPS_BLUE_ONCE}} \
          --args.report-dir {{.REPORT_DIR}} \
          --args.once \
          --dn-args.server {{.DREADNODE_SERVER_URL}} \
          --dn-args.organization {{.DREADNODE_ORGANIZATION}} \
          --dn-args.workspace {{.DREADNODE_WORKSPACE}} \
          --dn-args.project {{.DREADNODE_PROJECT}} \
          2>&1 | tee -a "$LOGFILE"
