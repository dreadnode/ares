      - sh: test -n "{{.OPERATION_ID}}"
        msg: "OPERATION_ID variable is required"
      - sh: test -n "{{.DOMAIN}}"
        msg: "DOMAIN variable is required"
      - sh: test -n "{{.TARGETS}}"
        msg: "TARGETS variable is required"
    cmds:
      - task: multi
        vars:
          OPERATION_ID: "{{.OPERATION_ID}}"
          DOMAIN: "{{.DOMAIN}}"
          TARGET: "{{.TARGETS}}"
          RESUME: "true"

  multi:resume:local:
    desc: "Resume a multi-agent operation using .env file (usage: task red:multi:resume:local OPERATION_ID=op-xxx DOMAIN=target.local TARGETS=192.168.56.10)"
    silent: true
    vars:
      OPERATION_ID: '{{.OPERATION_ID | default ""}}'
      DOMAIN: '{{.DOMAIN | default ""}}'
      TARGETS: '{{.TARGETS | default ""}}'
    preconditions:
      - sh: test -n "{{.OPERATION_ID}}"
        msg: "OPERATION_ID variable is required"
      - sh: test -n "{{.DOMAIN}}"
        msg: "DOMAIN variable is required"
      - sh: test -n "{{.TARGETS}}"
        msg: "TARGETS variable is required"
      - sh: test -f .env
        msg: ".env file not found"
    cmds:
      - task: multi:local
        vars:
          OPERATION_ID: "{{.OPERATION_ID}}"
          DOMAIN: "{{.DOMAIN}}"
          TARGET: "{{.TARGETS}}"
          RESUME: "true"

  multi:redis:clear:
    desc: "Clear multi-agent Redis operation cache (DANGEROUS: drops ops/locks/status)"
    silent: true
    cmds:
      - |
        set -euo pipefail
        echo "Clearing Redis operation cache in namespace {{.K8S_NAMESPACE}}"

        ORCH_DEPLOY=ares-orchestrator
        CURRENT_REPLICAS=$(kubectl get deploy -n {{.K8S_NAMESPACE}} $ORCH_DEPLOY -o jsonpath='{.spec.replicas}' 2>/dev/null || echo "1")
        # Ensure we restore to at least 1 replica (protects against previous failed runs leaving it at 0)
        if [ "$CURRENT_REPLICAS" -lt 1 ] 2>/dev/null; then
          CURRENT_REPLICAS=1
        fi
        echo "Scaling $ORCH_DEPLOY to 0 replicas (will restore to $CURRENT_REPLICAS)"
        kubectl scale -n {{.K8S_NAMESPACE}} deploy/$ORCH_DEPLOY --replicas=0
        kubectl rollout status -n {{.K8S_NAMESPACE}} deploy/$ORCH_DEPLOY || true

        REDIS_POD=$(kubectl get pods -n {{.K8S_NAMESPACE}} -l app=redis -o name 2>/dev/null | head -1)
        SENTINEL_POD=$(kubectl get pods -n {{.K8S_NAMESPACE}} -l app=redis-sentinel -o name 2>/dev/null | head -1)
        if [ -z "$REDIS_POD" ] && [ -z "$SENTINEL_POD" ]; then
          echo "No Redis pod found in namespace {{.K8S_NAMESPACE}}"
          exit 1
        fi

        REDIS_PASS=$(kubectl get secret redis-secret -n {{.K8S_NAMESPACE}} -o jsonpath='{.data.password}' 2>/dev/null | base64 -d || echo "")
        REDIS_ENV=()
        if [ -n "$REDIS_PASS" ]; then
          REDIS_ENV=(env REDISCLI_AUTH="$REDIS_PASS")
        fi
        # Always use Sentinel pod as client (it can reach master)
        REDIS_CLIENT_POD="${SENTINEL_POD:-$REDIS_POD}"
        REDIS_HOST=""
        REDIS_HOST_ARG=()
        CONTAINER_ARG=()

        if [ -n "$SENTINEL_POD" ]; then
          CONTAINER_ARG=(-c sentinel)
          # Get master IP from Sentinel (returns IP on first line, port on second)
          REDIS_HOST=$(kubectl exec -n {{.K8S_NAMESPACE}} "$SENTINEL_POD" "${CONTAINER_ARG[@]}" -- "${REDIS_ENV[@]}" redis-cli -p 26379 sentinel get-master-addr-by-name aresmaster 2>/dev/null | head -1 || true)
          if [ -z "$REDIS_HOST" ]; then
            echo "ERROR: Sentinel did not return master IP. Cannot proceed with clear."
            echo "Check Sentinel health: kubectl exec -n {{.K8S_NAMESPACE}} $SENTINEL_POD -c sentinel -- redis-cli -p 26379 info sentinel"
            exit 1
          fi
          echo "Using Redis master at $REDIS_HOST (via Sentinel)"
          REDIS_HOST_ARG=(-h "$REDIS_HOST" -p 6379)
        else
          echo "WARNING: No Sentinel found, using Redis pod directly (may hit replica)"
        fi

        # Helper function to run redis-cli commands
        redis_cmd() {
          kubectl exec -n {{.K8S_NAMESPACE}} "$REDIS_CLIENT_POD" "${CONTAINER_ARG[@]}" -- "${REDIS_ENV[@]}" redis-cli "${REDIS_HOST_ARG[@]}" "$@"
        }

        # Verify we can write to Redis before proceeding
        TEST_KEY="ares:clear:test:$$"
        if ! redis_cmd set "$TEST_KEY" "test" EX 5 >/dev/null 2>&1; then
          echo "ERROR: Cannot write to Redis. Are we connected to a read-only replica?"
          echo "Master host: ${REDIS_HOST:-direct}"
          exit 1
        fi
        redis_cmd del "$TEST_KEY" >/dev/null 2>&1 || true

        for pattern in "ares:operation:*:state" "ares:operation:*:checkpoint_time" "ares:operations:*:status" "ares:lock:*" "ares:tasks:*" "ares:results:*"; do
          keys=$(redis_cmd --scan --pattern "$pattern")
          count=0
          if [ -n "$keys" ]; then
            for key in $keys; do
              if ! redis_cmd del "$key" >/dev/null; then
                echo "ERROR: Failed to delete key: $key"
                exit 1
              fi
              count=$((count + 1))
            done
          fi
          echo "Cleared $pattern ($count keys)"
        done

        redis_cmd del ares:operations >/dev/null 2>&1 || true
        echo "Cleared ares:operations queue"

        redis_cmd del ares:operation:active >/dev/null 2>&1 || true
        echo "Cleared ares:operation:active pointer"

        echo "Scaling $ORCH_DEPLOY back to $CURRENT_REPLICAS replicas"
        kubectl scale -n {{.K8S_NAMESPACE}} deploy/$ORCH_DEPLOY --replicas="$CURRENT_REPLICAS"
        kubectl rollout status -n {{.K8S_NAMESPACE}} deploy/$ORCH_DEPLOY || true

  multi:redis:list:
    desc: "List multi-agent Redis operations, statuses, and locks"
    silent: true
    cmds:
      - |
        set -euo pipefail
        REDIS_POD=$(kubectl get pods -n {{.K8S_NAMESPACE}} -l app=redis -o name 2>/dev/null | head -1)
        if [ -z "$REDIS_POD" ]; then
          echo "No Redis pod found in namespace {{.K8S_NAMESPACE}}"
          exit 1
        fi

        REDIS_PASS=$(kubectl get secret redis-secret -n {{.K8S_NAMESPACE}} -o jsonpath='{.data.password}' 2>/dev/null | base64 -d || echo "")
        REDIS_ENV=()
        if [ -n "$REDIS_PASS" ]; then
          REDIS_ENV=(env REDISCLI_AUTH="$REDIS_PASS")
        fi

        echo "ares:operations queue (operation_ids):"
        queue=$(kubectl exec -n {{.K8S_NAMESPACE}} $REDIS_POD -- "${REDIS_ENV[@]}" redis-cli lrange ares:operations 0 -1)
        if [ -z "$queue" ]; then
          echo "  (empty)"
        else
          echo "$queue" | sed -n 's/.*"operation_id"[[:space:]]*:[[:space:]]*"\([^"]*\)".*/  \1/p'
        fi

        echo ""
        echo "operation status keys:"
        keys=$(kubectl exec -n {{.K8S_NAMESPACE}} $REDIS_POD -- "${REDIS_ENV[@]}" redis-cli --scan --pattern "ares:operations:*:status")
        if [ -z "$keys" ]; then
          echo "  (none)"
        else
          for key in $keys; do
            val=$(kubectl exec -n {{.K8S_NAMESPACE}} $REDIS_POD -- "${REDIS_ENV[@]}" redis-cli get "$key")
            echo "  $key -> $val"
          done
        fi

        echo ""
        echo "operation locks:"
        kubectl exec -n {{.K8S_NAMESPACE}} $REDIS_POD -- "${REDIS_ENV[@]}" redis-cli --scan --pattern "ares:lock:*" || true

  multi:sync:align:
    desc: "Sync code changes to PVCs, clear Redis cache, and align cluster pods (usage: task red:multi:sync:align [TEAM=red|blue|all])"
    vars:
      TEAM: '{{.TEAM | default "red"}}'
    cmds:
      - cmd: |
          # Kill any running red:multi:local processes to prevent them from
          # re-submitting operations after Redis is cleared
          LOCAL_PIDS=$(pgrep -f "red:multi:local" 2>/dev/null || true)
          if [ -n "$LOCAL_PIDS" ]; then
            echo "=== STOPPING LOCAL CLI SESSIONS ==="
            echo "Found running red:multi:local processes: $LOCAL_PIDS"
            for pid in $LOCAL_PIDS; do
              # Kill the process group to ensure child processes are also killed
              pkill -TERM -P "$pid" 2>/dev/null || true
              kill -TERM "$pid" 2>/dev/null || true
            done
            sleep 1
            # Force kill if still running
            for pid in $LOCAL_PIDS; do
              if kill -0 "$pid" 2>/dev/null; then
                echo "Force killing $pid"
                kill -9 "$pid" 2>/dev/null || true
              fi
            done
            echo "Local CLI sessions stopped"
          fi
      - cmd: echo "=== SYNCING CODE (team={{.TEAM}}) ==="
      - task: :remote:sync:full
        vars: { NAMESPACE: "{{.K8S_NAMESPACE}}", TEAM: "{{.TEAM}}" }
      - cmd: echo "=== SYNCING CONFIG ==="
      - task: multi:sync:config
      - cmd: echo "=== CLEARING REDIS CACHE ==="
      - task: multi:redis:clear
      - cmd: echo "=== ROLLING OUT (team={{.TEAM}}) ==="
      - task: :remote:rollout
        vars: { NAMESPACE: "{{.K8S_NAMESPACE}}", TEAM: "{{.TEAM}}" }

  multi:sync:config:
    desc: "Sync config/multi-agent-production.yaml to all pods"
    silent: true
    cmds:
      - |
        echo -e "{{.INFO}} Syncing config to pods in {{.K8S_NAMESPACE}}"

        # Get orchestrator pod
        ORCH_POD=$(kubectl get pods -n {{.K8S_NAMESPACE}} \
          -l app.kubernetes.io/name=ares-orchestrator \
          --field-selector=status.phase=Running \
          -o jsonpath='{.items[0].metadata.name}' 2>/dev/null || true)

        # Get worker pods
        PODS=$(kubectl get pods -n {{.K8S_NAMESPACE}} \
          -l ares.dreadnode.io/component=red-team \
          --field-selector=status.phase=Running \
          -o json | jq -r --arg orch "$ORCH_POD" '.items[] | select(.metadata.labels["ares.dreadnode.io/role"] != "atomic") | select(.metadata.name != $orch) | .metadata.name' | tr '\n' ' ')

        CONFIG_FILE="config/multi-agent-production.yaml"
        if [ ! -f "$CONFIG_FILE" ]; then
          echo -e "{{.WARN}} Config file not found: $CONFIG_FILE"
          exit 0
        fi

        # Sync to workers
        for pod in $PODS; do
          kubectl exec -n {{.K8S_NAMESPACE}} "$pod" -- mkdir -p /ares/config 2>/dev/null || true
          if kubectl cp "$CONFIG_FILE" "{{.K8S_NAMESPACE}}/$pod:/ares/config/multi-agent-production.yaml" 2>/dev/null; then
            echo -e "{{.SUCCESS}} Config synced to $pod"
          else
            echo -e "{{.WARN}} Failed to sync config to $pod"
          fi
        done

        # Sync to orchestrator
        if [ -n "$ORCH_POD" ]; then
          kubectl exec -n {{.K8S_NAMESPACE}} "$ORCH_POD" -c {{.ORCH_CONTAINER}} -- mkdir -p /ares/config 2>/dev/null || true
          if kubectl cp "$CONFIG_FILE" "{{.K8S_NAMESPACE}}/$ORCH_POD:/ares/config/multi-agent-production.yaml" -c {{.ORCH_CONTAINER}} 2>/dev/null; then
            echo -e "{{.SUCCESS}} Config synced to orchestrator"
          else
            echo -e "{{.WARN}} Failed to sync config to orchestrator"
          fi
        fi

        echo -e "{{.SUCCESS}} Config sync complete"

  # ===========================================================================
  # K8s Infrastructure Tasks
  # ===========================================================================

  # ===========================================================================
  # Replay Recording Tasks
  # ===========================================================================

  multi:replay:copy:
    desc: "Copy replay recordings from agent pods (usage: task red:multi:replay:copy [ROLE=recon] [OUTPUT_DIR=./recordings])"
    silent: true
    vars:
      ROLE: '{{.ROLE | default ""}}'
      OUTPUT_DIR: '{{.OUTPUT_DIR | default "./recordings"}}'
      AGENTS: "recon credential-access lateral-movement coercion acl cracker privesc"
    cmds:
      - |
        mkdir -p "{{.OUTPUT_DIR}}"

        if [ -n "{{.ROLE}}" ]; then
          # Copy from specific agent
          AGENT_NAME="{{.ROLE}}"
          # Normalize role name to pod name format (e.g., credential_access -> credential-access)
          POD_ROLE=$(echo "$AGENT_NAME" | tr '_' '-')
          POD="ares-${POD_ROLE}-agent-0"

          echo "Copying recording from $POD..."
          if kubectl cp "{{.K8S_NAMESPACE}}/${POD}:/ares/replay/recording.jsonl" "{{.OUTPUT_DIR}}/${POD_ROLE}-recording.jsonl" 2>/dev/null; then
            FILE_SIZE=$(ls -lh "{{.OUTPUT_DIR}}/${POD_ROLE}-recording.jsonl" 2>/dev/null | awk '{print $5}')
            echo "  ✓ Copied ${POD_ROLE}-recording.jsonl ($FILE_SIZE)"
          else
            echo "  ✗ No recording found for ${POD_ROLE}"
          fi
        else
          # Copy from all agents
          echo "Copying recordings from all agents to {{.OUTPUT_DIR}}/"
          echo ""

          for agent in {{.AGENTS}}; do
            POD="ares-${agent}-agent-0"
            if kubectl cp "{{.K8S_NAMESPACE}}/${POD}:/ares/replay/recording.jsonl" "{{.OUTPUT_DIR}}/${agent}-recording.jsonl" 2>/dev/null; then
              FILE_SIZE=$(ls -lh "{{.OUTPUT_DIR}}/${agent}-recording.jsonl" 2>/dev/null | awk '{print $5}')
              echo "  ✓ Copied ${agent}-recording.jsonl ($FILE_SIZE)"
            else
              echo "  ✗ No recording for ${agent}"
            fi
          done
        fi

        echo ""
        echo "Recordings saved to {{.OUTPUT_DIR}}/"

  multi:replay:cat:
    desc: "Stream replay recording contents from an agent pod (usage: task red:multi:replay:cat ROLE=recon)"
    silent: true
    vars:
      ROLE: '{{.ROLE | default "recon"}}'
    cmds:
      - |
        POD_ROLE=$(echo "{{.ROLE}}" | tr '_' '-')
        POD="ares-${POD_ROLE}-agent-0"

        echo "# Streaming recording from $POD..."
        echo "# ========================================"
        kubectl exec -n {{.K8S_NAMESPACE}} "$POD" -- cat /ares/replay/recording.jsonl 2>/dev/null || \
          echo "No recording found for ${POD_ROLE}"

  multi:replay:list:
    desc: "List replay recordings available on agent pods"
    silent: true
    vars:
      AGENTS: "recon credential-access lateral-movement coercion acl cracker privesc"
    cmds:
      - |
        echo "Replay recordings in {{.K8S_NAMESPACE}}:"
        echo "========================================"

        for agent in {{.AGENTS}}; do
          POD="ares-${agent}-agent-0"
          INFO=$(kubectl exec -n {{.K8S_NAMESPACE}} "$POD" -- ls -lh /ares/replay/recording.jsonl 2>/dev/null || true)
          if [ -n "$INFO" ]; then
            SIZE=$(echo "$INFO" | awk '{print $5}')
            DATE=$(echo "$INFO" | awk '{print $6, $7, $8}')
            echo "  ✓ ${agent}: $SIZE ($DATE)"
          else
            echo "  - ${agent}: (no recording)"
          fi
        done

  multi:replay:clear:
    desc: "Clear replay recordings from agent pods (usage: task red:multi:replay:clear [ROLE=recon] [CONFIRM=true])"
    silent: true
    vars:
      ROLE: '{{.ROLE | default ""}}'
      CONFIRM: '{{.CONFIRM | default "false"}}'
      AGENTS: "recon credential-access lateral-movement coercion acl cracker privesc"
    preconditions:
      - sh: test "{{.CONFIRM}}" = "true"
        msg: "This will delete replay recordings. Re-run with CONFIRM=true to proceed."
    cmds:
      - |
        if [ -n "{{.ROLE}}" ]; then
          POD_ROLE=$(echo "{{.ROLE}}" | tr '_' '-')
          POD="ares-${POD_ROLE}-agent-0"

          echo "Clearing recording from $POD..."
          if kubectl exec -n {{.K8S_NAMESPACE}} "$POD" -- rm -f /ares/replay/recording.jsonl 2>/dev/null; then
            echo "  ✓ Cleared ${POD_ROLE}"
          else
            echo "  ✗ Failed to clear ${POD_ROLE}"
          fi
        else
          echo "Clearing recordings from all agents..."

          for agent in {{.AGENTS}}; do
            POD="ares-${agent}-agent-0"
            if kubectl exec -n {{.K8S_NAMESPACE}} "$POD" -- rm -f /ares/replay/recording.jsonl 2>/dev/null; then
              echo "  ✓ Cleared ${agent}"
            else
              echo "  - ${agent}: (no recording or failed)"
            fi
          done
        fi

        echo ""
        echo "Done."
