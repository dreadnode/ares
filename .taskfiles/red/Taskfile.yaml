---
# Red Team Multi-Agent Tasks
# Extracted from main Taskfile to reduce duplication
version: "3"

vars:
  # Remote paths (local to this taskfile)
  REMOTE_REPORT_DIR: '{{.REMOTE_REPORT_DIR | default "/reports"}}'

tasks:
  # ===========================================================================
  # Internal: Common computed values
  # ===========================================================================
  _get-redis-url:
    internal: true
    silent: true
    cmds:
      - |
        REDIS_PASS=$(kubectl get secret redis-secret -n {{.K8S_NAMESPACE}} -o jsonpath='{.data.password}' 2>/dev/null | base64 -d || echo "")
        if [ -n "$REDIS_PASS" ]; then
          echo "redis://:${REDIS_PASS}@redis:6379"
        else
          echo "redis://redis:6379"
        fi

  _get-orch-pod:
    internal: true
    silent: true
    cmds:
      - kubectl get pods -n {{.K8S_NAMESPACE}} -l ares.dreadnode.io/role=orchestrator -o jsonpath='{.items[0].metadata.name}' 2>/dev/null

  # ===========================================================================
  # Multi-Agent Red Team Tasks
  # ===========================================================================

  multi:
    desc: "Run multi-agent red team operation (usage: task red:multi [TARGET=dreadgoad] [DOMAIN=sevenkingdoms.local])"
    silent: true
    vars:
      OPERATION_ID: '{{.OPERATION_ID | default ""}}'
      RESUME: '{{.RESUME | default "false"}}'
      # Computed vars
      ANTHROPIC_API_KEY:
        sh: op item get "Dreadnode Claude" --fields api-key --reveal 2>/dev/null || echo ""
      DREADNODE_API_KEY:
        sh: op item get "Dreadnode Dev Platform" --fields api-key --reveal 2>/dev/null || echo ""
      GRAFANA_SERVICE_ACCOUNT_TOKEN:
        sh: op item get "Ares Grafana MCP" --fields grafana-token --reveal 2>/dev/null || echo ""
      OPENAI_API_KEY:
        sh: op item get "Openai" --fields dreadnode-personal-api-key --reveal 2>/dev/null || echo ""
      ARES_MODEL:
        sh: |
          if [ -n "{{.MODEL_ALL}}" ]; then
            echo "{{.MODEL_ALL}}"
          else
            echo "{{.MODEL}}"
          fi
      MODEL_ARG:
        sh: |
          if [ -n "{{.MODEL_ORCHESTRATOR}}" ]; then
            echo "{{.MODEL_ORCHESTRATOR}}"
          elif [ -n "{{.MODEL_ALL}}" ]; then
            echo "{{.MODEL_ALL}}"
          else
            echo "{{.MODEL}}"
          fi
      RESOLVED_TARGETS:
        sh: |
          TARGET="{{.TARGET}}"
          if echo "$TARGET" | grep -qE '^[0-9]+\.[0-9]+\.[0-9]+\.[0-9]+'; then
            echo "$TARGET"
          else
            aws ec2 describe-instances \
              --profile "{{.TARGET_PROFILE}}" \
              --region "{{.TARGET_REGION}}" \
              --filters "Name=instance-state-name,Values=running" \
              --query "Reservations[*].Instances[?contains(Tags[?Key==\`Name\`].Value|[0], \`$TARGET\`)].PrivateIpAddress" \
              --output text | tr '\t\n' ',' | sed 's/,$//'
          fi
      OPERATION_ID_COMPUTED:
        sh: |
          if [ -n "{{.OPERATION_ID}}" ]; then
            echo "{{.OPERATION_ID}}"
          else
            echo "op-$(date +%Y%m%d-%H%M%S)"
          fi
      REDIS_URL:
        sh: |
          REDIS_PASS=$(kubectl get secret redis-secret -n {{.K8S_NAMESPACE}} -o jsonpath='{.data.password}' 2>/dev/null | base64 -d || echo "")
          if [ -n "$REDIS_PASS" ]; then
            echo "redis://:${REDIS_PASS}@redis:6379"
          else
            echo "redis://redis:6379"
          fi
      LOGFILE:
        sh: echo "{{.LOG_DIR}}/red-multi-{{.OPERATION_ID_COMPUTED}}-$(date +%Y%m%d-%H%M%S).log"
    preconditions:
      - sh: test -n "{{.TARGET}}"
        msg: "TARGET variable is required. Usage: task red:multi TARGET=dreadgoad"
      - sh: test -n "{{.RESOLVED_TARGETS}}"
        msg: "No running EC2 instances found matching Name tag filter: {{.TARGET}}"
    cmds:
      # Show target resolution status
      - cmd: |
          TARGET="{{.TARGET}}"
          if echo "$TARGET" | grep -qE '^[0-9]+\.[0-9]+\.[0-9]+\.[0-9]+'; then
            echo "Using direct IP(s): {{.RESOLVED_TARGETS}}"
          else
            echo "Resolved '{{.TARGET}}' via AWS EC2 ({{.TARGET_PROFILE}}/{{.TARGET_REGION}})"
            TARGET_COUNT=$(echo "{{.RESOLVED_TARGETS}}" | tr ',' '\n' | wc -l | xargs)
            echo "Found $TARGET_COUNT target(s): {{.RESOLVED_TARGETS}}"
          fi
        silent: false

      # Show operation details
      - cmd: |
          echo ""
          echo "Operation ID: {{.OPERATION_ID_COMPUTED}}"
          echo "Target domain: {{.DOMAIN}}"
          echo "Target IPs: {{.RESOLVED_TARGETS}}"
          echo "K8s namespace: {{.K8S_NAMESPACE}}"
          if [ "{{.RESUME}}" = "true" ]; then
            echo "Resuming from checkpoint"
          fi
          echo "Logging to: {{.LOGFILE}}"
          echo ""
        silent: false

      # Create log directory
      - cmd: mkdir -p {{.LOG_DIR}}
        silent: true

      # Pin workers to this operation ID
      - cmd: |
          set -euo pipefail
          echo "Setting active operation pointer in Redis..."
          REDIS_PASS=$(kubectl get secret redis-secret -n {{.K8S_NAMESPACE}} -o jsonpath='{.data.password}' 2>/dev/null | base64 -d || echo "")

          # Find the Redis master pod (replicas are read-only)
          REDIS_MASTER=""
          for pod in $(kubectl get pods -n {{.K8S_NAMESPACE}} -l app=redis -o name 2>/dev/null); do
            ROLE=$(kubectl exec -n {{.K8S_NAMESPACE}} $pod -c redis -- env REDISCLI_AUTH="$REDIS_PASS" redis-cli info replication 2>/dev/null | grep "^role:" | cut -d: -f2 | tr -d '\r')
            if [ "$ROLE" = "master" ]; then
              REDIS_MASTER=$pod
              break
            fi
          done

          if [ -z "$REDIS_MASTER" ]; then
            echo "No Redis master found in namespace {{.K8S_NAMESPACE}}"
            exit 1
          fi
          echo "Found Redis master: $REDIS_MASTER"

          kubectl exec -n {{.K8S_NAMESPACE}} $REDIS_MASTER -c redis -- env REDISCLI_AUTH="$REDIS_PASS" \
            redis-cli set ares:operation:active "{{.OPERATION_ID_COMPUTED}}" >/dev/null
          echo "Set ares:operation:active -> {{.OPERATION_ID_COMPUTED}}"
        silent: false

      # Submit operation
      - cmd: |
          echo "Submitting operation to orchestrator service..."

          RESOLVED_TARGETS_LIST=$(echo "{{.RESOLVED_TARGETS}}" | tr ',' ' ')
          IPS_ARGS=""
          for ip in $RESOLVED_TARGETS_LIST; do
            IPS_ARGS="$IPS_ARGS --ips $ip"
          done

          RESUME_FLAG=""
          if [ "{{.RESUME}}" = "true" ]; then
            RESUME_FLAG="--resume"
          fi

          kubectl exec -i -n {{.K8S_NAMESPACE}} deploy/ares-orchestrator -- \
            env OPENAI_API_KEY="{{.OPENAI_API_KEY}}" \
            ANTHROPIC_API_KEY="{{.ANTHROPIC_API_KEY}}" \
            DREADNODE_API_KEY="{{.DREADNODE_API_KEY}}" \
            DREADNODE_SERVER_URL="{{.DREADNODE_SERVER_URL}}" \
            DREADNODE_ORGANIZATION="{{.DREADNODE_ORGANIZATION}}" \
            DREADNODE_WORKSPACE="{{.DREADNODE_WORKSPACE}}" \
            DREADNODE_PROJECT="{{.DREADNODE_PROJECT}}" \
            GRAFANA_SERVICE_ACCOUNT_TOKEN="{{.GRAFANA_SERVICE_ACCOUNT_TOKEN}}" \
            ARES_MODEL="{{.ARES_MODEL}}" \
            ARES_ORCHESTRATOR_MODEL="{{.MODEL_ORCHESTRATOR}}" \
            ARES_WORKER_MODEL="{{.MODEL_WORKER}}" \
            ARES_AGENT_RECON_MODEL="{{.MODEL_RECON}}" \
            ARES_AGENT_CREDENTIAL_ACCESS_MODEL="{{.MODEL_CREDENTIAL_ACCESS}}" \
            ARES_AGENT_CRACKER_MODEL="{{.MODEL_CRACKER}}" \
            ARES_AGENT_ACL_MODEL="{{.MODEL_ACL}}" \
            ARES_AGENT_PRIVESC_MODEL="{{.MODEL_PRIVESC}}" \
            ARES_AGENT_LATERAL_MODEL="{{.MODEL_LATERAL}}" \
            ARES_AGENT_COERCION_MODEL="{{.MODEL_COERCION}}" \
            GRAFANA_URL="{{.GRAFANA_URL}}" \
            python -m ares.cli_ops submit "{{.TARGET}}" "{{.DOMAIN}}" \
            $IPS_ARGS \
            --operation-id "{{.OPERATION_ID_COMPUTED}}" \
            --model "{{.MODEL_ARG}}" \
            --max-steps {{.MAX_STEPS_RED}} \
            --redis-url "{{.REDIS_URL}}" \
            $RESUME_FLAG \
            2>&1 | tee -a "{{.LOGFILE}}"
        silent: false

      # Follow logs
      - cmd: |
          echo ""
          echo "Following orchestrator logs (Ctrl+C to stop)..."
          echo "Operation ID: {{.OPERATION_ID_COMPUTED}}"
          echo ""
          kubectl logs -f -n {{.K8S_NAMESPACE}} deploy/ares-orchestrator 2>&1 | tee -a "{{.LOGFILE}}"
        silent: false

  # ===========================================================================
  # Python CLI wrappers - these call the new cli_ops commands
  # ===========================================================================

  multi:loot:
    desc: "Dump users, credentials, and hosts from Redis state (usage: task red:multi:loot [OPERATION_ID=op-xxx] [LATEST=true] [WATCH=10] [DIFF=true])"
    silent: true
    vars:
      OPERATION_ID: '{{.OPERATION_ID | default ""}}'
      LATEST: '{{.LATEST | default ""}}'
      WATCH: '{{.WATCH | default "0"}}'
      DIFF: '{{.DIFF | default "false"}}'
    preconditions:
      - sh: test -n "{{.OPERATION_ID}}" || test "{{.LATEST}}" = "true"
        msg: "Either OPERATION_ID or LATEST=true is required. Usage: task red:multi:loot OPERATION_ID=op-xxx  OR  task red:multi:loot LATEST=true"
    cmds:
      - |
        LATEST_FLAG=""
        if [ "{{.LATEST}}" = "true" ]; then
          LATEST_FLAG="--latest"
        fi
        OP_ID_ARG=""
        if [ -n "{{.OPERATION_ID}}" ]; then
          OP_ID_ARG="{{.OPERATION_ID}}"
        fi
        kubectl exec -i -n {{.K8S_NAMESPACE}} deploy/ares-orchestrator -- python -m ares.cli_ops loot $OP_ID_ARG $LATEST_FLAG {{if ne .WATCH "0"}}--watch {{.WATCH}}{{end}} {{if eq .DIFF "true"}}--diff{{end}}

  multi:report:
    desc: "Generate comprehensive markdown report for an operation (usage: task red:multi:report [OPERATION_ID=op-xxx] [LATEST=true])"
    silent: true
    vars:
      OPERATION_ID: '{{.OPERATION_ID | default ""}}'
      LATEST: '{{.LATEST | default ""}}'
      OUTPUT_DIR: '{{.OUTPUT_DIR | default "./reports"}}'
    preconditions:
      - sh: test -n "{{.OPERATION_ID}}" || test "{{.LATEST}}" = "true"
        msg: "Either OPERATION_ID or LATEST=true is required. Usage: task red:multi:report OPERATION_ID=op-xxx  OR  task red:multi:report LATEST=true"
    cmds:
      - |
        # Ensure output directory exists
        mkdir -p "{{.OUTPUT_DIR}}"

        # Build args for the report command
        LATEST_FLAG=""
        if [ "{{.LATEST}}" = "true" ]; then
          LATEST_FLAG="--latest"
        fi
        OP_ID_ARG=""
        if [ -n "{{.OPERATION_ID}}" ]; then
          OP_ID_ARG="{{.OPERATION_ID}}"
        fi

        # Generate report in pod and capture it
        # The report command outputs the path and logs, so we use a temp approach
        REPORT_CONTENT=$(kubectl exec -i -n {{.K8S_NAMESPACE}} deploy/ares-orchestrator -- \
          python -c "
        import asyncio
        from ares.core.config import get_redis_url
        from ares.core.redis_client import create_redis_client
        from ares.core.models import SharedRedTeamState
        from ares.reports import generate_comprehensive_report

        async def main():
            redis_url = get_redis_url()
            client = await create_redis_client(redis_url, decode_responses=False)
            try:
                # Get operation ID
                op_id = '$OP_ID_ARG'
                if not op_id:
                    # Find latest
                    from ares.core.task_queue import RedisTaskQueue
                    lock_keys = await client.keys(f'{RedisTaskQueue.LOCK_PREFIX}:*')
                    running = set()
                    for k in lock_keys:
                        k_str = k.decode() if isinstance(k, bytes) else k
                        parts = k_str.split(':')
                        if len(parts) >= 3:
                            running.add(parts[2])
                    state_keys = await client.keys('ares:operation:*:state')
                    ops = []
                    for k in state_keys:
                        k_str = k.decode() if isinstance(k, bytes) else k
                        parts = k_str.split(':')
                        if len(parts) >= 3:
                            oid = parts[2]
                            checkpoint = await client.get(f'ares:operation:{oid}:checkpoint_time')
                            ops.append((checkpoint, oid, oid in running))
                    # Prefer running, then latest by checkpoint
                    running_ops = [(t, o) for t, o, r in ops if r]
                    if running_ops:
                        running_ops.sort(key=lambda x: x[0] or '', reverse=True)
                        op_id = running_ops[0][1]
                    else:
                        ops.sort(key=lambda x: x[0] or '', reverse=True)
                        op_id = ops[0][1] if ops else None

                if not op_id:
                    raise ValueError('No operations found')

                data = await client.get(f'ares:operation:{op_id}:state')
                if not data:
                    raise ValueError(f'No state for {op_id}')

                state = SharedRedTeamState.from_bytes(data)
                report = generate_comprehensive_report(state)
                # Output operation ID as first line for filename
                print(f'OPERATION_ID:{op_id}')
                print(report)
            finally:
                await client.aclose()

        asyncio.run(main())
        " 2>/dev/null)

        # Extract operation ID and report content
        REPORT_OP_ID=$(echo "$REPORT_CONTENT" | head -1 | sed 's/OPERATION_ID://')
        REPORT_BODY=$(echo "$REPORT_CONTENT" | tail -n +2)

        # Save report locally
        REPORT_FILE="{{.OUTPUT_DIR}}/${REPORT_OP_ID}_report.md"
        echo "$REPORT_BODY" > "$REPORT_FILE"
        echo "Report saved: $REPORT_FILE"

  multi:status:
    desc: "Check multi-agent operation status (usage: task red:multi:status OPERATION_ID=op-xxx)"
    silent: true
    vars:
      OPERATION_ID: '{{.OPERATION_ID | default ""}}'
    preconditions:
      - sh: test -n "{{.OPERATION_ID}}"
        msg: "OPERATION_ID variable is required. Usage: task red:multi:status OPERATION_ID=op-xxx"
    cmds:
      - kubectl exec -i -n {{.K8S_NAMESPACE}} deploy/ares-orchestrator -- python -m ares.cli_ops status "{{.OPERATION_ID}}"

  multi:tasks:running:
    desc: "List running tasks for an operation (usage: task red:multi:tasks:running OPERATION_ID=op-xxx [ROLE=lateral])"
    silent: true
    vars:
      OPERATION_ID: '{{.OPERATION_ID | default ""}}'
      ROLE: '{{.ROLE | default ""}}'
    preconditions:
      - sh: test -n "{{.OPERATION_ID}}"
        msg: "OPERATION_ID variable is required"
    cmds:
      - |
        ROLE_ARG=""
        if [ -n "{{.ROLE}}" ]; then
          ROLE_ARG="--role {{.ROLE}}"
        fi
        kubectl exec -i -n {{.K8S_NAMESPACE}} deploy/ares-orchestrator -- python -m ares.cli_ops tasks "{{.OPERATION_ID}}" --task-status running $ROLE_ARG

  multi:tasks:list:
    desc: "List tasks for an operation (usage: task red:multi:tasks:list OPERATION_ID=op-xxx [ROLE=lateral] [STATUS=pending|in_progress|running|completed|failed|all])"
    silent: true
    vars:
      OPERATION_ID: '{{.OPERATION_ID | default ""}}'
      ROLE: '{{.ROLE | default ""}}'
      STATUS: '{{.STATUS | default "running"}}'
      VALID_STATUSES: "pending in_progress running completed failed cancelled retrying all"
    preconditions:
      - sh: test -n "{{.OPERATION_ID}}"
        msg: "OPERATION_ID variable is required"
      - sh: echo "{{.VALID_STATUSES}}" | grep -qw "{{.STATUS}}"
        msg: "Invalid STATUS '{{.STATUS}}'. Valid values: pending, in_progress, running, completed, failed, cancelled, retrying, all"
    cmds:
      - |
        ROLE_ARG=""
        if [ -n "{{.ROLE}}" ]; then
          ROLE_ARG="--role {{.ROLE}}"
        fi
        kubectl exec -i -n {{.K8S_NAMESPACE}} deploy/ares-orchestrator -- python -m ares.cli_ops tasks "{{.OPERATION_ID}}" --task-status {{.STATUS}} $ROLE_ARG

  multi:list:
    desc: "List multi-agent operations (usage: task red:multi:list [LATEST=true])"
    silent: true
    vars:
      LATEST: '{{.LATEST | default ""}}'
    cmds:
      - |
        LATEST_FLAG=""
        if [ "{{.LATEST}}" = "true" ]; then
          LATEST_FLAG="--latest"
        fi
        kubectl exec -i -n {{.K8S_NAMESPACE}} deploy/ares-orchestrator -- python -m ares.cli_ops list $LATEST_FLAG

  multi:queue:
    desc: "List multi-agent operations and state from the Redis queue"
    silent: true
    cmds:
      - kubectl exec -i -n {{.K8S_NAMESPACE}} deploy/ares-orchestrator -- python -m ares.cli_ops queue

  multi:cleanup:
    desc: "Clean up old multi-agent operation checkpoints (usage: task red:multi:cleanup [MAX_AGE_HOURS=24])"
    silent: true
    vars:
      MAX_AGE_HOURS: '{{.MAX_AGE_HOURS | default "24"}}'
    cmds:
      - kubectl exec -i -n {{.K8S_NAMESPACE}} deploy/ares-orchestrator -- python -m ares.cli_ops cleanup --max-age-hours {{.MAX_AGE_HOURS}}

  multi:delete:
    desc: "Delete a specific operation and all its data (usage: task red:multi:delete OPERATION_ID=op-xxx)"
    silent: true
    vars:
      OPERATION_ID: '{{.OPERATION_ID | default ""}}'
    preconditions:
      - sh: test -n "{{.OPERATION_ID}}"
        msg: "OPERATION_ID variable is required"
    cmds:
      - kubectl exec -i -n {{.K8S_NAMESPACE}} deploy/ares-orchestrator -- python -m ares.cli_ops delete "{{.OPERATION_ID}}" --force

  multi:backfill-domains:
    desc: "Backfill domain list into Redis state (usage: task red:multi:backfill-domains OPERATION_ID=op-xxx)"
    silent: true
    vars:
      OPERATION_ID: '{{.OPERATION_ID | default ""}}'
    preconditions:
      - sh: test -n "{{.OPERATION_ID}}"
        msg: "OPERATION_ID variable is required"
    cmds:
      - kubectl exec -i -n {{.K8S_NAMESPACE}} deploy/ares-orchestrator -- python -m ares.cli_ops backfill-domains "{{.OPERATION_ID}}"

  multi:inject-credential:
    desc: "Inject a credential into operation shared state (usage: task red:multi:inject-credential OPERATION_ID=op-xxx USERNAME=jon.snow PASSWORD=secret [DOMAIN=contoso.local])"
    silent: true
    vars:
      OPERATION_ID: '{{.OPERATION_ID | default ""}}'
      USERNAME: '{{.USERNAME | default ""}}'
      PASSWORD: '{{.PASSWORD | default ""}}'
      DOMAIN: '{{.DOMAIN | default ""}}'
      SOURCE: '{{.SOURCE | default "manual-inject"}}'
      IS_ADMIN: '{{.IS_ADMIN | default "false"}}'
    preconditions:
      - sh: test -n "{{.OPERATION_ID}}"
        msg: "OPERATION_ID variable is required"
      - sh: test -n "{{.USERNAME}}"
        msg: "USERNAME variable is required"
      - sh: test -n "{{.PASSWORD}}"
        msg: "PASSWORD variable is required"
    cmds:
      - |
        DOMAIN_ARG=""
        if [ -n "{{.DOMAIN}}" ]; then
          DOMAIN_ARG="--domain {{.DOMAIN}}"
        fi
        ADMIN_ARG=""
        if [ "{{.IS_ADMIN}}" = "true" ]; then
          ADMIN_ARG="--is-admin"
        fi
        kubectl exec -i -n {{.K8S_NAMESPACE}} deploy/ares-orchestrator -- \
          python -m ares.cli_ops inject-credential "{{.OPERATION_ID}}" "{{.USERNAME}}" "{{.PASSWORD}}" \
          $DOMAIN_ARG --source "{{.SOURCE}}" $ADMIN_ARG

  multi:inject-vulnerability:
    desc: "Inject a vulnerability into operation shared state (usage: task red:multi:inject-vulnerability OPERATION_ID=op-xxx VULN_TYPE=constrained_delegation TARGET_IP=10.1.2.240 ...)"
    silent: true
    vars:
      OPERATION_ID: '{{.OPERATION_ID | default ""}}'
      VULN_TYPE: '{{.VULN_TYPE | default ""}}'
      TARGET_IP: '{{.TARGET_IP | default ""}}'
      TARGET_HOSTNAME: '{{.TARGET_HOSTNAME | default ""}}'
      TARGET_SPN: '{{.TARGET_SPN | default ""}}'
      ACCOUNT_NAME: '{{.ACCOUNT_NAME | default ""}}'
      DOMAIN: '{{.DOMAIN | default ""}}'
      DETAILS: '{{.DETAILS | default "{}"}}'
    preconditions:
      - sh: test -n "{{.OPERATION_ID}}"
        msg: "OPERATION_ID variable is required"
      - sh: test -n "{{.VULN_TYPE}}"
        msg: "VULN_TYPE variable is required (e.g., constrained_delegation, esc8, smb_signing_disabled)"
      - sh: test -n "{{.TARGET_IP}}"
        msg: "TARGET_IP variable is required"
    cmds:
      - |
        HOSTNAME_ARG=""
        if [ -n "{{.TARGET_HOSTNAME}}" ]; then
          HOSTNAME_ARG="--target-hostname {{.TARGET_HOSTNAME}}"
        fi
        SPN_ARG=""
        if [ -n "{{.TARGET_SPN}}" ]; then
          SPN_ARG="--target-spn {{.TARGET_SPN}}"
        fi
        ACCOUNT_ARG=""
        if [ -n "{{.ACCOUNT_NAME}}" ]; then
          ACCOUNT_ARG="--account-name {{.ACCOUNT_NAME}}"
        fi
        DOMAIN_ARG=""
        if [ -n "{{.DOMAIN}}" ]; then
          DOMAIN_ARG="--domain {{.DOMAIN}}"
        fi
        kubectl exec -i -n {{.K8S_NAMESPACE}} deploy/ares-orchestrator -- \
          python -m ares.cli_ops inject-vulnerability "{{.OPERATION_ID}}" "{{.VULN_TYPE}}" "{{.TARGET_IP}}" \
          $HOSTNAME_ARG $SPN_ARG $ACCOUNT_ARG $DOMAIN_ARG --details '{{.DETAILS}}'

  # ===========================================================================
  # Shell-based tasks (cannot be moved to Python)
  # ===========================================================================

  multi:local:
    desc: "Run multi-agent red team operation using .env file (usage: task red:multi:local [TARGET=dreadgoad] [DOMAIN=sevenkingdoms.local])"
    silent: true
    vars:
      OPERATION_ID: '{{.OPERATION_ID | default ""}}'
      RESUME: '{{.RESUME | default "false"}}'
      # Computed vars (no 1Password - uses .env)
      ARES_MODEL:
        sh: |
          if [ -n "{{.MODEL_ALL}}" ]; then
            echo "{{.MODEL_ALL}}"
          else
            echo "{{.MODEL}}"
          fi
      MODEL_ARG:
        sh: |
          if [ -n "{{.MODEL_ORCHESTRATOR}}" ]; then
            echo "{{.MODEL_ORCHESTRATOR}}"
          elif [ -n "{{.MODEL_ALL}}" ]; then
            echo "{{.MODEL_ALL}}"
          else
            echo "{{.MODEL}}"
          fi
      RESOLVED_TARGETS:
        sh: |
          TARGET="{{.TARGET}}"
          if echo "$TARGET" | grep -qE '^[0-9]+\.[0-9]+\.[0-9]+\.[0-9]+'; then
            echo "$TARGET"
          else
            aws ec2 describe-instances \
              --profile "{{.TARGET_PROFILE}}" \
              --region "{{.TARGET_REGION}}" \
              --filters "Name=instance-state-name,Values=running" \
              --query "Reservations[*].Instances[?contains(Tags[?Key==\`Name\`].Value|[0], \`$TARGET\`)].PrivateIpAddress" \
              --output text | tr '\t\n' ',' | sed 's/,$//'
          fi
      OPERATION_ID_COMPUTED:
        sh: |
          if [ -n "{{.OPERATION_ID}}" ]; then
            echo "{{.OPERATION_ID}}"
          else
            echo "op-$(date +%Y%m%d-%H%M%S)"
          fi
      REDIS_URL:
        sh: |
          REDIS_PASS=$(kubectl get secret redis-secret -n {{.K8S_NAMESPACE}} -o jsonpath='{.data.password}' 2>/dev/null | base64 -d || echo "")
          if [ -n "$REDIS_PASS" ]; then
            echo "redis://:${REDIS_PASS}@redis:6379"
          else
            echo "redis://redis:6379"
          fi
      LOGFILE:
        sh: echo "{{.LOG_DIR}}/red-multi-{{.OPERATION_ID_COMPUTED}}-$(date +%Y%m%d-%H%M%S).log"
    preconditions:
      - sh: test -n "{{.TARGET}}"
        msg: "TARGET variable is required. Usage: task red:multi:local TARGET=dreadgoad"
      - sh: test -n "{{.RESOLVED_TARGETS}}"
        msg: "No running EC2 instances found matching Name tag filter: {{.TARGET}}"
      - sh: test -f .env
        msg: ".env file not found"
    cmds:
      # Load .env
      - cmd: |
          set -a
          . ./.env
          set +a
        silent: true

      # Show target resolution status
      - cmd: |
          TARGET="{{.TARGET}}"
          if echo "$TARGET" | grep -qE '^[0-9]+\.[0-9]+\.[0-9]+\.[0-9]+'; then
            echo "Using direct IP(s): {{.RESOLVED_TARGETS}}"
          else
            echo "Resolved '{{.TARGET}}' via AWS EC2 ({{.TARGET_PROFILE}}/{{.TARGET_REGION}})"
            TARGET_COUNT=$(echo "{{.RESOLVED_TARGETS}}" | tr ',' '\n' | wc -l | xargs)
            echo "Found $TARGET_COUNT target(s): {{.RESOLVED_TARGETS}}"
          fi
        silent: false

      # Show operation details
      - cmd: |
          echo ""
          echo "Operation ID: {{.OPERATION_ID_COMPUTED}}"
          echo "Target domain: {{.DOMAIN}}"
          echo "Target IPs: {{.RESOLVED_TARGETS}}"
          echo "K8s namespace: {{.K8S_NAMESPACE}}"
          echo "Using .env for credentials"
          if [ "{{.RESUME}}" = "true" ]; then
            echo "Resuming from checkpoint"
          fi
          echo "Logging to: {{.LOGFILE}}"
          echo ""
        silent: false

      # Create log directory
      - cmd: mkdir -p {{.LOG_DIR}}
        silent: true

      # Pin workers to this operation ID
      - cmd: |
          set -euo pipefail
          echo "Setting active operation pointer in Redis..."
          REDIS_PASS=$(kubectl get secret redis-secret -n {{.K8S_NAMESPACE}} -o jsonpath='{.data.password}' 2>/dev/null | base64 -d || echo "")

          # Find the Redis master pod (replicas are read-only)
          REDIS_MASTER=""
          for pod in $(kubectl get pods -n {{.K8S_NAMESPACE}} -l app=redis -o name 2>/dev/null); do
            ROLE=$(kubectl exec -n {{.K8S_NAMESPACE}} $pod -c redis -- env REDISCLI_AUTH="$REDIS_PASS" redis-cli info replication 2>/dev/null | grep "^role:" | cut -d: -f2 | tr -d '\r')
            if [ "$ROLE" = "master" ]; then
              REDIS_MASTER=$pod
              break
            fi
          done

          if [ -z "$REDIS_MASTER" ]; then
            echo "No Redis master found in namespace {{.K8S_NAMESPACE}}"
            exit 1
          fi
          echo "Found Redis master: $REDIS_MASTER"

          kubectl exec -n {{.K8S_NAMESPACE}} $REDIS_MASTER -c redis -- env REDISCLI_AUTH="$REDIS_PASS" \
            redis-cli set ares:operation:active "{{.OPERATION_ID_COMPUTED}}" >/dev/null
          echo "Set ares:operation:active -> {{.OPERATION_ID_COMPUTED}}"
        silent: false

      # Submit operation (source .env for credentials)
      - cmd: |
          set -a
          . ./.env
          set +a

          echo "Submitting operation to orchestrator service..."

          RESOLVED_TARGETS_LIST=$(echo "{{.RESOLVED_TARGETS}}" | tr ',' ' ')
          IPS_ARGS=""
          for ip in $RESOLVED_TARGETS_LIST; do
            IPS_ARGS="$IPS_ARGS --ips $ip"
          done

          RESUME_FLAG=""
          if [ "{{.RESUME}}" = "true" ]; then
            RESUME_FLAG="--resume"
          fi

          kubectl exec -i -n {{.K8S_NAMESPACE}} deploy/ares-orchestrator -- \
            env OPENAI_API_KEY="${OPENAI_API_KEY:-}" \
            ANTHROPIC_API_KEY="${ANTHROPIC_API_KEY:-}" \
            DREADNODE_API_KEY="${DREADNODE_API_KEY:-}" \
            DREADNODE_SERVER_URL="{{.DREADNODE_SERVER_URL}}" \
            DREADNODE_ORGANIZATION="{{.DREADNODE_ORGANIZATION}}" \
            DREADNODE_WORKSPACE="{{.DREADNODE_WORKSPACE}}" \
            DREADNODE_PROJECT="{{.DREADNODE_PROJECT}}" \
            GRAFANA_SERVICE_ACCOUNT_TOKEN="${GRAFANA_SERVICE_ACCOUNT_TOKEN:-}" \
            ARES_MODEL="{{.ARES_MODEL}}" \
            ARES_ORCHESTRATOR_MODEL="{{.MODEL_ORCHESTRATOR}}" \
            ARES_WORKER_MODEL="{{.MODEL_WORKER}}" \
            ARES_AGENT_RECON_MODEL="{{.MODEL_RECON}}" \
            ARES_AGENT_CREDENTIAL_ACCESS_MODEL="{{.MODEL_CREDENTIAL_ACCESS}}" \
            ARES_AGENT_CRACKER_MODEL="{{.MODEL_CRACKER}}" \
            ARES_AGENT_ACL_MODEL="{{.MODEL_ACL}}" \
            ARES_AGENT_PRIVESC_MODEL="{{.MODEL_PRIVESC}}" \
            ARES_AGENT_LATERAL_MODEL="{{.MODEL_LATERAL}}" \
            ARES_AGENT_COERCION_MODEL="{{.MODEL_COERCION}}" \
            GRAFANA_URL="{{.GRAFANA_URL}}" \
            ARES_MAX_CONCURRENT_TASKS=1 \
            ARES_TASK_DISPATCH_DELAY=3.0 \
            ARES_RATE_LIMIT_BACKOFF=15.0 \
            ARES_RATE_LIMIT_THRESHOLD=2 \
            python -m ares.cli_ops submit "{{.TARGET}}" "{{.DOMAIN}}" \
            $IPS_ARGS \
            --operation-id "{{.OPERATION_ID_COMPUTED}}" \
            --model "{{.MODEL_ARG}}" \
            --max-steps {{.MAX_STEPS_RED}} \
            --redis-url "{{.REDIS_URL}}" \
            $RESUME_FLAG \
            2>&1 | tee -a "{{.LOGFILE}}"
        silent: false

      # Follow logs
      - cmd: |
          echo ""
          echo "Following orchestrator logs (Ctrl+C to stop)..."
          echo "Operation ID: {{.OPERATION_ID_COMPUTED}}"
          echo ""
          kubectl logs -f -n {{.K8S_NAMESPACE}} deploy/ares-orchestrator 2>&1 | tee -a "{{.LOGFILE}}"
        silent: false

  multi:resume:
    desc: "Resume a multi-agent operation from checkpoint (usage: task red:multi:resume OPERATION_ID=op-xxx DOMAIN=target.local TARGETS=192.168.56.10)"
    silent: true
    vars:
      OPERATION_ID: '{{.OPERATION_ID | default ""}}'
      DOMAIN: '{{.DOMAIN | default ""}}'
      TARGETS: '{{.TARGETS | default ""}}'
    preconditions:
      - sh: test -n "{{.OPERATION_ID}}"
        msg: "OPERATION_ID variable is required"
      - sh: test -n "{{.DOMAIN}}"
        msg: "DOMAIN variable is required"
      - sh: test -n "{{.TARGETS}}"
        msg: "TARGETS variable is required"
    cmds:
      - task: multi
        vars:
          OPERATION_ID: "{{.OPERATION_ID}}"
          DOMAIN: "{{.DOMAIN}}"
          TARGET: "{{.TARGETS}}"
          RESUME: "true"

  multi:resume:local:
    desc: "Resume a multi-agent operation using .env file (usage: task red:multi:resume:local OPERATION_ID=op-xxx DOMAIN=target.local TARGETS=192.168.56.10)"
    silent: true
    vars:
      OPERATION_ID: '{{.OPERATION_ID | default ""}}'
      DOMAIN: '{{.DOMAIN | default ""}}'
      TARGETS: '{{.TARGETS | default ""}}'
    preconditions:
      - sh: test -n "{{.OPERATION_ID}}"
        msg: "OPERATION_ID variable is required"
      - sh: test -n "{{.DOMAIN}}"
        msg: "DOMAIN variable is required"
      - sh: test -n "{{.TARGETS}}"
        msg: "TARGETS variable is required"
      - sh: test -f .env
        msg: ".env file not found"
    cmds:
      - task: multi:local
        vars:
          OPERATION_ID: "{{.OPERATION_ID}}"
          DOMAIN: "{{.DOMAIN}}"
          TARGET: "{{.TARGETS}}"
          RESUME: "true"

  multi:redis:clear:
    desc: "Clear multi-agent Redis operation cache (DANGEROUS: drops ops/locks/status)"
    silent: true
    cmds:
      - |
        set -euo pipefail
        echo "Clearing Redis operation cache in namespace {{.K8S_NAMESPACE}}"

        ORCH_DEPLOY=ares-orchestrator
        CURRENT_REPLICAS=$(kubectl get deploy -n {{.K8S_NAMESPACE}} $ORCH_DEPLOY -o jsonpath='{.spec.replicas}' 2>/dev/null || echo "1")
        echo "Scaling $ORCH_DEPLOY to 0 replicas (was $CURRENT_REPLICAS)"
        kubectl scale -n {{.K8S_NAMESPACE}} deploy/$ORCH_DEPLOY --replicas=0
        kubectl rollout status -n {{.K8S_NAMESPACE}} deploy/$ORCH_DEPLOY || true

        REDIS_POD=$(kubectl get pods -n {{.K8S_NAMESPACE}} -l app=redis -o name 2>/dev/null | head -1)
        SENTINEL_POD=$(kubectl get pods -n {{.K8S_NAMESPACE}} -l app=redis-sentinel -o name 2>/dev/null | head -1)
        if [ -z "$REDIS_POD" ] && [ -z "$SENTINEL_POD" ]; then
          echo "No Redis pod found in namespace {{.K8S_NAMESPACE}}"
          exit 1
        fi

        REDIS_PASS=$(kubectl get secret redis-secret -n {{.K8S_NAMESPACE}} -o jsonpath='{.data.password}' 2>/dev/null | base64 -d || echo "")
        REDIS_ENV=()
        if [ -n "$REDIS_PASS" ]; then
          REDIS_ENV=(env REDISCLI_AUTH="$REDIS_PASS")
        fi
        REDIS_CLIENT_POD="$REDIS_POD"
        REDIS_HOST=""
        if [ -n "$SENTINEL_POD" ]; then
          REDIS_CLIENT_POD="$SENTINEL_POD"
          REDIS_HOST=$(kubectl exec -n {{.K8S_NAMESPACE}} "$SENTINEL_POD" -- "${REDIS_ENV[@]}" redis-cli -p 26379 sentinel get-master-addr-by-name aresmaster 2>/dev/null | head -1 || true)
          if [ -z "$REDIS_HOST" ]; then
            echo "Sentinel did not return master, falling back to redis pod"
            REDIS_CLIENT_POD="$REDIS_POD"
          fi
        fi
        REDIS_HOST_ARG=()
        if [ -n "$REDIS_HOST" ]; then
          REDIS_HOST_ARG=(-h "$REDIS_HOST" -p 6379)
        fi

        for pattern in "ares:operation:*:state" "ares:operation:*:checkpoint_time" "ares:operations:*:status" "ares:lock:*" "ares:tasks:*" "ares:results:*"; do
          keys=$(kubectl exec -n {{.K8S_NAMESPACE}} "$REDIS_CLIENT_POD" -- "${REDIS_ENV[@]}" redis-cli "${REDIS_HOST_ARG[@]}" --scan --pattern "$pattern")
          if [ -n "$keys" ]; then
            for key in $keys; do
              kubectl exec -n {{.K8S_NAMESPACE}} "$REDIS_CLIENT_POD" -- "${REDIS_ENV[@]}" redis-cli "${REDIS_HOST_ARG[@]}" del "$key" >/dev/null
            done
          fi
          echo "Cleared $pattern"
        done

        kubectl exec -n {{.K8S_NAMESPACE}} "$REDIS_CLIENT_POD" -- "${REDIS_ENV[@]}" redis-cli "${REDIS_HOST_ARG[@]}" del ares:operations >/dev/null
        echo "Cleared ares:operations queue"

        kubectl exec -n {{.K8S_NAMESPACE}} "$REDIS_CLIENT_POD" -- "${REDIS_ENV[@]}" redis-cli "${REDIS_HOST_ARG[@]}" del ares:operation:active >/dev/null
        echo "Cleared ares:operation:active pointer"

        echo "Scaling $ORCH_DEPLOY back to $CURRENT_REPLICAS replicas"
        kubectl scale -n {{.K8S_NAMESPACE}} deploy/$ORCH_DEPLOY --replicas="$CURRENT_REPLICAS"
        kubectl rollout status -n {{.K8S_NAMESPACE}} deploy/$ORCH_DEPLOY || true

  multi:redis:list:
    desc: "List multi-agent Redis operations, statuses, and locks"
    silent: true
    cmds:
      - |
        set -euo pipefail
        REDIS_POD=$(kubectl get pods -n {{.K8S_NAMESPACE}} -l app=redis -o name 2>/dev/null | head -1)
        if [ -z "$REDIS_POD" ]; then
          echo "No Redis pod found in namespace {{.K8S_NAMESPACE}}"
          exit 1
        fi

        REDIS_PASS=$(kubectl get secret redis-secret -n {{.K8S_NAMESPACE}} -o jsonpath='{.data.password}' 2>/dev/null | base64 -d || echo "")
        REDIS_ENV=()
        if [ -n "$REDIS_PASS" ]; then
          REDIS_ENV=(env REDISCLI_AUTH="$REDIS_PASS")
        fi

        echo "ares:operations queue (operation_ids):"
        queue=$(kubectl exec -n {{.K8S_NAMESPACE}} $REDIS_POD -- "${REDIS_ENV[@]}" redis-cli lrange ares:operations 0 -1)
        if [ -z "$queue" ]; then
          echo "  (empty)"
        else
          echo "$queue" | sed -n 's/.*"operation_id"[[:space:]]*:[[:space:]]*"\([^"]*\)".*/  \1/p'
        fi

        echo ""
        echo "operation status keys:"
        keys=$(kubectl exec -n {{.K8S_NAMESPACE}} $REDIS_POD -- "${REDIS_ENV[@]}" redis-cli --scan --pattern "ares:operations:*:status")
        if [ -z "$keys" ]; then
          echo "  (none)"
        else
          for key in $keys; do
            val=$(kubectl exec -n {{.K8S_NAMESPACE}} $REDIS_POD -- "${REDIS_ENV[@]}" redis-cli get "$key")
            echo "  $key -> $val"
          done
        fi

        echo ""
        echo "operation locks:"
        kubectl exec -n {{.K8S_NAMESPACE}} $REDIS_POD -- "${REDIS_ENV[@]}" redis-cli --scan --pattern "ares:lock:*" || true

  multi:sync:align:
    desc: "Sync code changes to PVCs, clear Redis cache, and align cluster pods"
    cmds:
      - cmd: |
          # Kill any running red:multi:local processes to prevent them from
          # re-submitting operations after Redis is cleared
          LOCAL_PIDS=$(pgrep -f "red:multi:local" 2>/dev/null || true)
          if [ -n "$LOCAL_PIDS" ]; then
            echo "=== STOPPING LOCAL CLI SESSIONS ==="
            echo "Found running red:multi:local processes: $LOCAL_PIDS"
            for pid in $LOCAL_PIDS; do
              # Kill the process group to ensure child processes are also killed
              pkill -TERM -P "$pid" 2>/dev/null || true
              kill -TERM "$pid" 2>/dev/null || true
            done
            sleep 1
            # Force kill if still running
            for pid in $LOCAL_PIDS; do
              if kill -0 "$pid" 2>/dev/null; then
                echo "Force killing $pid"
                kill -9 "$pid" 2>/dev/null || true
              fi
            done
            echo "Local CLI sessions stopped"
          fi
      - cmd: echo "=== SYNCING CODE ==="
      - task: :remote:sync:full
        vars: { NAMESPACE: "{{.K8S_NAMESPACE}}" }
      - cmd: echo "=== SYNCING CONFIG ==="
      - task: multi:sync:config
      - cmd: echo "=== CLEARING REDIS CACHE ==="
      - task: multi:redis:clear
      - cmd: echo "=== ROLLING OUT ==="
      - task: :remote:rollout
        vars: { NAMESPACE: "{{.K8S_NAMESPACE}}" }

  multi:sync:config:
    desc: "Sync config/multi-agent-production.yaml to all pods"
    silent: true
    cmds:
      - |
        echo -e "{{.INFO}} Syncing config to pods in {{.K8S_NAMESPACE}}"

        # Get orchestrator pod
        ORCH_POD=$(kubectl get pods -n {{.K8S_NAMESPACE}} \
          -l app.kubernetes.io/name=ares-orchestrator \
          --field-selector=status.phase=Running \
          -o jsonpath='{.items[0].metadata.name}' 2>/dev/null || true)

        # Get worker pods
        PODS=$(kubectl get pods -n {{.K8S_NAMESPACE}} \
          -l ares.dreadnode.io/component=red-team \
          --field-selector=status.phase=Running \
          -o json | jq -r --arg orch "$ORCH_POD" '.items[] | select(.metadata.labels["ares.dreadnode.io/role"] != "atomic") | select(.metadata.name != $orch) | .metadata.name' | tr '\n' ' ')

        CONFIG_FILE="config/multi-agent-production.yaml"
        if [ ! -f "$CONFIG_FILE" ]; then
          echo -e "{{.WARN}} Config file not found: $CONFIG_FILE"
          exit 0
        fi

        # Sync to workers
        for pod in $PODS; do
          kubectl exec -n {{.K8S_NAMESPACE}} "$pod" -- mkdir -p /ares/config 2>/dev/null || true
          if kubectl cp "$CONFIG_FILE" "{{.K8S_NAMESPACE}}/$pod:/ares/config/multi-agent-production.yaml" 2>/dev/null; then
            echo -e "{{.SUCCESS}} Config synced to $pod"
          else
            echo -e "{{.WARN}} Failed to sync config to $pod"
          fi
        done

        # Sync to orchestrator
        if [ -n "$ORCH_POD" ]; then
          kubectl exec -n {{.K8S_NAMESPACE}} "$ORCH_POD" -c {{.ORCH_CONTAINER}} -- mkdir -p /ares/config 2>/dev/null || true
          if kubectl cp "$CONFIG_FILE" "{{.K8S_NAMESPACE}}/$ORCH_POD:/ares/config/multi-agent-production.yaml" -c {{.ORCH_CONTAINER}} 2>/dev/null; then
            echo -e "{{.SUCCESS}} Config synced to orchestrator"
          else
            echo -e "{{.WARN}} Failed to sync config to orchestrator"
          fi
        fi

        echo -e "{{.SUCCESS}} Config sync complete"

  # ===========================================================================
  # K8s Infrastructure Tasks
  # ===========================================================================

  k8s:check:
    desc: "Check Kubernetes infrastructure for multi-agent operations"
    silent: true
    cmds:
      - |
        echo "Checking Kubernetes infrastructure for multi-agent operations"
        echo "=================================================================="
        echo ""

        # Check namespace
        echo "Namespace: {{.K8S_NAMESPACE}}"
        if kubectl get namespace {{.K8S_NAMESPACE}} >/dev/null 2>&1; then
          echo "  Namespace exists"
        else
          echo "  Namespace not found"
        fi
        echo ""

        # Check Redis
        echo "Redis:"
        REDIS_POD=$(kubectl get pods -n {{.K8S_NAMESPACE}} -l app=redis -o name 2>/dev/null | head -1)
        if [ -n "$REDIS_POD" ]; then
          echo "  Redis pod found: $REDIS_POD"
          kubectl exec -n {{.K8S_NAMESPACE}} $REDIS_POD -- redis-cli ping 2>/dev/null && echo "  Redis responding" || echo "  Redis not responding"
        else
          echo "  No Redis pods found"
        fi
        echo ""

        # Check agent pods
        echo "Agent Pods:"
        for role in recon cracker acl privesc lateral coercion; do
          POD_COUNT=$(kubectl get pods -n {{.K8S_NAMESPACE}} -l ares.dreadnode.io/role=$role -o name 2>/dev/null | wc -l | xargs)
          if [ "$POD_COUNT" -gt 0 ]; then
            STATUS=$(kubectl get pods -n {{.K8S_NAMESPACE}} -l ares.dreadnode.io/role=$role -o jsonpath='{.items[0].status.phase}' 2>/dev/null)
            echo "  $role: $POD_COUNT pod(s) - $STATUS"
          else
            echo "  $role: No pods found"
          fi
        done
        echo ""

        echo "All pods in {{.K8S_NAMESPACE}}:"
        kubectl get pods -n {{.K8S_NAMESPACE}} -o wide 2>/dev/null || echo "  Unable to list pods"

  redeploy:
    desc: "Restart all red team deployments in the cluster"
    silent: true
    cmds:
      - |
        echo "Restarting red team workloads in namespace: {{.K8S_NAMESPACE}}"
        kubectl rollout restart deployment -n {{.K8S_NAMESPACE}} -l ares.dreadnode.io/component=red-team
        kubectl rollout restart statefulset -n {{.K8S_NAMESPACE}} -l ares.dreadnode.io/component=red-team
        echo "Red team workloads restarted"

  # ===========================================================================
  # Single-Agent Red Team Tasks (local execution)
  # ===========================================================================

  single:
    desc: "Run single-agent red team against a target (usage: task red:single TARGET=dreadgoad)"
    silent: true
    vars:
      TARGET: '{{.TARGET | default ""}}'
      PROFILE: '{{.PROFILE | default "lab"}}'
      REGION: '{{.REGION | default "us-west-1"}}'
      ANTHROPIC_API_KEY:
        sh: op item get "Dreadnode Claude" --fields api-key --reveal 2>/dev/null || echo ""
      DREADNODE_API_KEY:
        sh: op item get "Dreadnode Dev Platform" --fields api-key --reveal 2>/dev/null || echo ""
      GRAFANA_SERVICE_ACCOUNT_TOKEN:
        sh: op item get "Ares Grafana MCP" --fields grafana-token --reveal 2>/dev/null || echo ""
      OPENAI_API_KEY:
        sh: op item get "Openai" --fields dreadnode-personal-api-key --reveal 2>/dev/null || echo ""
      MODEL_ARG:
        sh: |
          if [ -n "{{.MODEL_ALL}}" ]; then
            echo "{{.MODEL_ALL}}"
          else
            echo "{{.MODEL}}"
          fi
    preconditions:
      - sh: test -n "{{.TARGET}}"
        msg: "TARGET variable is required. Usage: task red:single TARGET=dreadgoad"
    cmds:
      - |
        export ANTHROPIC_API_KEY="{{.ANTHROPIC_API_KEY}}"
        export DREADNODE_API_KEY="{{.DREADNODE_API_KEY}}"
        export GRAFANA_SERVICE_ACCOUNT_TOKEN="{{.GRAFANA_SERVICE_ACCOUNT_TOKEN}}"
        export OPENAI_API_KEY="{{.OPENAI_API_KEY}}"

        TARGET="{{.TARGET}}"

        # Check if TARGET is an IP address
        if echo "$TARGET" | grep -qE '^[0-9]+\.[0-9]+\.[0-9]+\.[0-9]+$'; then
            echo "Using direct IP: $TARGET"
            RESOLVED_TARGET="$TARGET"
        else
            # Resolve TARGET via AWS EC2 Name tag filter
            echo "Resolving '$TARGET' via AWS EC2 Name tag filter..."

            RESOLVED_TARGET=$(aws ec2 describe-instances \
                --profile "{{.PROFILE}}" \
                --region "{{.REGION}}" \
                --filters "Name=instance-state-name,Values=running" \
                --query "Reservations[*].Instances[?contains(Tags[?Key==\`Name\`].Value|[0], \`$TARGET\`)].PrivateIpAddress" \
                --output text | tr '\t\n' ' ' | xargs)

            if [ -z "$RESOLVED_TARGET" ]; then
                echo "No running EC2 instances found matching Name tag filter: $TARGET"
                exit 1
            fi

            TARGET_COUNT=$(echo "$RESOLVED_TARGET" | wc -w | xargs)
            echo "Resolved $TARGET_COUNT target(s): $RESOLVED_TARGET"
        fi

        mkdir -p {{.LOG_DIR}}
        LOGFILE="{{.LOG_DIR}}/red-$(date +%Y%m%d-%H%M%S).log"
        echo "Logging to: $LOGFILE"

        uv run python -m ares red-team "$RESOLVED_TARGET" \
          --args.model "{{.MODEL_ARG}}" \
          --args.max-steps {{.MAX_STEPS_RED}} \
          --args.report-dir {{.REPORT_DIR}} \
          --dn-args.server {{.DREADNODE_SERVER_URL}} \
          --dn-args.token "$DREADNODE_API_KEY" \
          --dn-args.organization {{.DREADNODE_ORGANIZATION}} \
          --dn-args.workspace {{.DREADNODE_WORKSPACE}} \
          --dn-args.project {{.REDTEAM_PROJECT}} \
          2>&1 | tee -a "$LOGFILE"

  single:local:
    desc: "Run single-agent red team using .env file (usage: task red:single:local TARGET=192.168.56.100)"
    silent: true
    vars:
      TARGET: '{{.TARGET | default ""}}'
      MODEL_ARG:
        sh: |
          if [ -n "{{.MODEL_ALL}}" ]; then
            echo "{{.MODEL_ALL}}"
          else
            echo "{{.MODEL}}"
          fi
    preconditions:
      - sh: test -n "{{.TARGET}}"
        msg: "TARGET variable is required. Usage: task red:single:local TARGET=192.168.56.100"
      - sh: test -f .env
        msg: ".env file not found"
    cmds:
      - |
        set -a
        . ./.env
        set +a

        mkdir -p {{.LOG_DIR}}
        LOGFILE="{{.LOG_DIR}}/red-$(date +%Y%m%d-%H%M%S).log"
        echo "Logging to: $LOGFILE"

        uv run python -m ares red-team {{.TARGET}} \
          --args.model "{{.MODEL_ARG}}" \
          --args.max-steps {{.MAX_STEPS_RED}} \
          --args.report-dir {{.REPORT_DIR}} \
          --dn-args.server {{.DREADNODE_SERVER_URL}} \
          --dn-args.organization {{.DREADNODE_ORGANIZATION}} \
          --dn-args.workspace {{.DREADNODE_WORKSPACE}} \
          --dn-args.project {{.REDTEAM_PROJECT}} \
          2>&1 | tee -a "$LOGFILE"

  logs:ssm:
    desc: "Tail red team agent logs from Kali via SSM (usage: task red:logs:ssm [KALI=instance-name] [LINES=100] [FOLLOW=true])"
    silent: true
    vars:
      KALI: '{{.KALI | default "staging-alpha-operator-range-kali"}}'
      LINES: '{{.LINES | default "100"}}'
      FOLLOW: '{{.FOLLOW | default "false"}}'
      PROFILE: '{{.PROFILE | default "lab"}}'
      REGION: '{{.REGION | default "us-west-1"}}'
    cmds:
      - |
        # Verify AWS auth first
        if ! aws sts get-caller-identity --profile "{{.PROFILE}}" --region "{{.REGION}}" >/dev/null 2>&1; then
            echo "AWS authentication failed for profile: {{.PROFILE}}"
            echo "Run: aws sso login --profile {{.PROFILE}}"
            exit 1
        fi

        SSM_INSTANCE_ID=$(aws ec2 describe-instances \
            --profile "{{.PROFILE}}" \
            --region "{{.REGION}}" \
            --filters "Name=tag:Name,Values={{.KALI}}" "Name=instance-state-name,Values=running" \
            --query 'Reservations[0].Instances[0].InstanceId' \
            --output text)

        if [ "$SSM_INSTANCE_ID" == "None" ] || [ -z "$SSM_INSTANCE_ID" ]; then
            echo "Kali instance not found or not running: {{.KALI}}"
            exit 1
        fi

        if [ "{{.FOLLOW}}" = "true" ]; then
            echo "Following logs from {{.KALI}} (Press Ctrl+C to stop)"
            echo "======================================================================"
            echo ""

            while true; do
                clear
                echo "$(date) - Refreshing..."
                echo "======================================================================"

                COMMAND_ID=$(aws ssm send-command \
                    --profile "{{.PROFILE}}" \
                    --region "{{.REGION}}" \
                    --instance-ids "$SSM_INSTANCE_ID" \
                    --document-name "AWS-RunShellScript" \
                    --parameters 'commands=["tail -n 100 /tmp/ares-redteam-output.log 2>/dev/null || echo \"Log file not yet created\""]' \
                    --query 'Command.CommandId' \
                    --output text)

                sleep 2

                aws ssm get-command-invocation \
                    --profile "{{.PROFILE}}" \
                    --region "{{.REGION}}" \
                    --command-id "$COMMAND_ID" \
                    --instance-id "$SSM_INSTANCE_ID" \
                    --query 'StandardOutputContent' \
                    --output text

                sleep 3
            done
        else
            echo "Fetching last {{.LINES}} lines from {{.KALI}}..."
            echo "======================================================================"
            echo ""

            COMMAND_ID=$(aws ssm send-command \
                --profile "{{.PROFILE}}" \
                --region "{{.REGION}}" \
                --instance-ids "$SSM_INSTANCE_ID" \
                --document-name "AWS-RunShellScript" \
                --parameters "commands=[\"tail -n {{.LINES}} /tmp/ares-redteam-output.log 2>/dev/null || echo 'Log file not yet created'\"]" \
                --query 'Command.CommandId' \
                --output text)

            sleep 2

            aws ssm get-command-invocation \
                --profile "{{.PROFILE}}" \
                --region "{{.REGION}}" \
                --command-id "$COMMAND_ID" \
                --instance-id "$SSM_INSTANCE_ID" \
                --query 'StandardOutputContent' \
                --output text
        fi
