---
# Red Team Multi-Agent Tasks
# Extracted from main Taskfile to reduce duplication
version: "3"

# Enable proper shell behavior for pipelines
set: [errexit, pipefail]
shopt: [globstar]

vars:
  # Remote paths (local to this taskfile)
  REMOTE_REPORT_DIR: '{{.REMOTE_REPORT_DIR | default "/reports"}}'

tasks:
  # ===========================================================================
  # Multi-Agent Red Team Tasks
  # ===========================================================================

  multi:
    desc: "Run multi-agent red team operation (usage: task red:multi [TARGET=dreadgoad] [DOMAIN=contoso.local] [TARGET_ENV=staging])"
    silent: true
    vars:
      OPERATION_ID: '{{.OPERATION_ID | default ""}}'
      RESUME: '{{.RESUME | default "false"}}'
      TARGET_ENV: '{{.TARGET_ENV | default "staging"}}'
      # Computed vars (skip 1Password if .env exists - use multi:local instead)
      ANTHROPIC_API_KEY:
        sh: test -f .env && echo "" || op item get "Dreadnode Claude" --fields api-key --reveal 2>/dev/null || echo ""
      DREADNODE_API_KEY:
        sh: test -f .env && echo "" || op item get "Dreadnode Dev Platform" --fields api-key --reveal 2>/dev/null || echo ""
      GRAFANA_SERVICE_ACCOUNT_TOKEN:
        sh: test -f .env && echo "" || op item get "Ares Grafana MCP" --fields grafana-token --reveal 2>/dev/null || echo ""
      OPENAI_API_KEY:
        sh: test -f .env && echo "" || op item get "Dreadnode Openai" --fields dreadnode-ares-api-key --reveal 2>/dev/null || echo ""
      ARES_MODEL:
        sh: |
          if [ -n "{{.MODEL_ALL}}" ]; then
            echo "{{.MODEL_ALL}}"
          else
            echo "{{.MODEL}}"
          fi
      MODEL_ARG:
        sh: |
          if [ -n "{{.MODEL_ORCHESTRATOR}}" ]; then
            echo "{{.MODEL_ORCHESTRATOR}}"
          elif [ -n "{{.MODEL_ALL}}" ]; then
            echo "{{.MODEL_ALL}}"
          else
            echo "{{.MODEL}}"
          fi
      RESOLVED_TARGETS:
        sh: |
          TARGET="{{.TARGET}}"
          if echo "$TARGET" | grep -qE '^[0-9]+\.[0-9]+\.[0-9]+\.[0-9]+'; then
            echo "$TARGET"
          else
            aws ec2 describe-instances \
              --profile "{{.TARGET_PROFILE}}" \
              --region "{{.TARGET_REGION}}" \
              --filters "Name=instance-state-name,Values=running" \
              --query "Reservations[*].Instances[?contains(Tags[?Key==\`Name\`].Value|[0], \`$TARGET\`)].PrivateIpAddress" \
              --output text | tr '\t\n' ',' | sed 's/,$//'
          fi
      OPERATION_ID_COMPUTED:
        sh: |
          if [ -n "{{.OPERATION_ID}}" ]; then
            echo "{{.OPERATION_ID}}"
          else
            echo "op-$(date +%Y%m%d-%H%M%S)"
          fi
      REDIS_URL:
        sh: |
          REDIS_PASS=$(kubectl get secret redis-secret -n {{.K8S_NAMESPACE}} -o jsonpath='{.data.password}' 2>/dev/null | base64 -d || echo "")
          if [ -n "$REDIS_PASS" ]; then
            echo "redis://:${REDIS_PASS}@redis:6379"
          else
            echo "redis://redis:6379"
          fi
      LOGFILE:
        sh: echo "{{.LOG_DIR}}/red-multi-{{.OPERATION_ID_COMPUTED}}-$(date +%Y%m%d-%H%M%S).log"
    preconditions:
      - sh: test -n "{{.TARGET}}"
        msg: "TARGET variable is required. Usage: task red:multi TARGET=dreadgoad"
      - sh: test -n "{{.RESOLVED_TARGETS}}"
        msg: "No running EC2 instances found matching Name tag filter: {{.TARGET}}"
    cmds:
      # Show target resolution status
      - cmd: |
          TARGET="{{.TARGET}}"
          if echo "$TARGET" | grep -qE '^[0-9]+\.[0-9]+\.[0-9]+\.[0-9]+'; then
            echo "Using direct IP(s): {{.RESOLVED_TARGETS}}"
          else
            echo "Resolved '{{.TARGET}}' via AWS EC2 ({{.TARGET_PROFILE}}/{{.TARGET_REGION}})"
            TARGET_COUNT=$(echo "{{.RESOLVED_TARGETS}}" | tr ',' '\n' | wc -l | xargs)
            echo "Found $TARGET_COUNT target(s): {{.RESOLVED_TARGETS}}"
          fi
        silent: false

      # Show operation details
      - cmd: |
          echo ""
          echo "Operation ID: {{.OPERATION_ID_COMPUTED}}"
          echo "Target domain: {{.DOMAIN}}"
          echo "Target IPs: {{.RESOLVED_TARGETS}}"
          echo "K8s namespace: {{.K8S_NAMESPACE}}"
          if [ "{{.RESUME}}" = "true" ]; then
            echo "Resuming from checkpoint"
          fi
          echo "Logging to: {{.LOGFILE}}"
          echo ""
        silent: false

      # Create log directory
      - cmd: mkdir -p {{.LOG_DIR}}
        silent: true

      # Pin workers to this operation ID
      - cmd: |
          set -euo pipefail
          echo "Setting active operation pointer in Redis..."
          REDIS_PASS=$(kubectl get secret redis-secret -n {{.K8S_NAMESPACE}} -o jsonpath='{.data.password}' 2>/dev/null | base64 -d || echo "")

          # Find the Redis master pod (replicas are read-only)
          REDIS_MASTER=""
          for pod in $(kubectl get pods -n {{.K8S_NAMESPACE}} -l app=redis -o name 2>/dev/null); do
            ROLE=$(kubectl exec -n {{.K8S_NAMESPACE}} $pod -c redis -- env REDISCLI_AUTH="$REDIS_PASS" redis-cli info replication 2>/dev/null | grep "^role:" | cut -d: -f2 | tr -d '\r')
            if [ "$ROLE" = "master" ]; then
              REDIS_MASTER=$pod
              break
            fi
          done

          if [ -z "$REDIS_MASTER" ]; then
            echo "No Redis master found in namespace {{.K8S_NAMESPACE}}"
            exit 1
          fi
          echo "Found Redis master: $REDIS_MASTER"

          kubectl exec -n {{.K8S_NAMESPACE}} $REDIS_MASTER -c redis -- env REDISCLI_AUTH="$REDIS_PASS" \
            redis-cli set ares:operation:active "{{.OPERATION_ID_COMPUTED}}" >/dev/null
          echo "Set ares:operation:active -> {{.OPERATION_ID_COMPUTED}}"
        silent: false

      # Submit operation
      - cmd: |
          echo "Submitting operation to orchestrator service..."

          RESOLVED_TARGETS_LIST=$(echo "{{.RESOLVED_TARGETS}}" | tr ',' ' ')
          IPS_ARGS=""
          for ip in $RESOLVED_TARGETS_LIST; do
            IPS_ARGS="$IPS_ARGS --ips $ip"
          done

          RESUME_FLAG=""
          if [ "{{.RESUME}}" = "true" ]; then
            RESUME_FLAG="--resume"
          fi

          kubectl exec -i -n {{.K8S_NAMESPACE}} deploy/ares-orchestrator -- \
            env OPENAI_API_KEY="{{.OPENAI_API_KEY}}" \
            ANTHROPIC_API_KEY="{{.ANTHROPIC_API_KEY}}" \
            DREADNODE_API_KEY="{{.DREADNODE_API_KEY}}" \
            DREADNODE_SERVER_URL="{{.DREADNODE_SERVER_URL}}" \
            DREADNODE_ORGANIZATION="{{.DREADNODE_ORGANIZATION}}" \
            DREADNODE_WORKSPACE="{{.DREADNODE_WORKSPACE}}" \
            DREADNODE_PROJECT="{{.DREADNODE_PROJECT}}" \
            GRAFANA_SERVICE_ACCOUNT_TOKEN="{{.GRAFANA_SERVICE_ACCOUNT_TOKEN}}" \
            ARES_MODEL="{{.ARES_MODEL}}" \
            ARES_ORCHESTRATOR_MODEL="{{.MODEL_ORCHESTRATOR}}" \
            ARES_WORKER_MODEL="{{.MODEL_WORKER}}" \
            ARES_AGENT_RECON_MODEL="{{.MODEL_RECON}}" \
            ARES_AGENT_CREDENTIAL_ACCESS_MODEL="{{.MODEL_CREDENTIAL_ACCESS}}" \
            ARES_AGENT_CRACKER_MODEL="{{.MODEL_CRACKER}}" \
            ARES_AGENT_ACL_MODEL="{{.MODEL_ACL}}" \
            ARES_AGENT_PRIVESC_MODEL="{{.MODEL_PRIVESC}}" \
            ARES_AGENT_LATERAL_MODEL="{{.MODEL_LATERAL}}" \
            ARES_AGENT_COERCION_MODEL="{{.MODEL_COERCION}}" \
            GRAFANA_URL="{{.GRAFANA_URL}}" \
            python -m ares.cli_ops submit "{{.TARGET}}" "{{.DOMAIN}}" \
            $IPS_ARGS \
            --operation-id "{{.OPERATION_ID_COMPUTED}}" \
            --model "{{.MODEL_ARG}}" \
            --max-steps {{.MAX_STEPS_RED}} \
            --redis-url "{{.REDIS_URL}}" \
            --env "{{.TARGET_ENV}}" \
            $RESUME_FLAG \
            2>&1 | tee -a "{{.LOGFILE}}"
        silent: false

      # Follow logs filtered to this operation only (auto-exits on completion)
      - cmd: |
          echo ""
          echo "Following orchestrator logs (auto-exits on completion, Ctrl+C to stop early)..."
          echo "Operation ID: {{.OPERATION_ID_COMPUTED}}"
          echo ""

          # Wait briefly for operation to start being processed
          sleep 2

          DONE_MARKER="/tmp/ares_done_$$"
          rm -f "$DONE_MARKER"

          # Stream logs using process substitution so break exits immediately
          # (pipes run while loop in subshell, making break wait for pipeline)
          while IFS= read -r line; do
            echo "$line" | tee -a "{{.LOGFILE}}"
            if echo "$line" | grep -q "completed successfully"; then
              echo ""
              echo "✓ Operation completed - fetching report..."
              touch "$DONE_MARKER"
              # Kill kubectl logs before breaking to ensure clean exit
              pkill -f "kubectl logs -f.*{{.K8S_NAMESPACE}}.*ares-orchestrator" 2>/dev/null || true
              break
            fi
          done < <(timeout 1800 stdbuf -oL kubectl logs -f --since=10s -n {{.K8S_NAMESPACE}} deploy/ares-orchestrator 2>&1 | \
            stdbuf -oL grep --line-buffered "{{.OPERATION_ID_COMPUTED}}" || true)

          # Cleanup any orphaned kubectl processes
          pkill -f "kubectl logs -f.*{{.K8S_NAMESPACE}}.*ares-orchestrator" 2>/dev/null || true

          # If operation didn't complete, create a marker to skip report fetch
          if [ ! -f "$DONE_MARKER" ]; then
            echo ""
            echo "Operation {{.OPERATION_ID_COMPUTED}} is queued/running but not yet complete."
            echo "Monitor: task red:multi:loot LATEST=true WATCH=5"
            echo "Report:  task red:multi:report OPERATION_ID={{.OPERATION_ID_COMPUTED}}"
            touch "/tmp/ares_skip_report_$$"
          fi
          rm -f "$DONE_MARKER"
        silent: false

      # Auto-fetch report from Redis when operation completes
      - cmd: |
          # Skip if operation didn't complete
          SKIP_MARKER="/tmp/ares_skip_report_$$"
          if [ -f "$SKIP_MARKER" ]; then
            rm -f "$SKIP_MARKER"
            exit 0
          fi

          mkdir -p ./reports

          echo "Fetching report from Redis..."

          # Port-forward to Redis (use 16379 locally to avoid conflicts with local Redis)
          # Kill any stale port-forward first
          lsof -ti:16379 | xargs kill 2>/dev/null || true
          sleep 1

          kubectl port-forward -n {{.K8S_NAMESPACE}} svc/redis 16379:6379 2>/dev/null &
          PF_PID=$!

          # Wait for port to be connectable (up to 15 seconds)
          i=0
          while [ $i -lt 15 ]; do
            if nc -z localhost 16379 2>/dev/null; then
              break
            fi
            sleep 1
            i=$((i + 1))
          done

          # Final check: is port actually open?
          if ! nc -z localhost 16379 2>/dev/null; then
            echo ""
            echo "ERROR: kubectl port-forward failed (port not connectable after 15s)"
            echo "Fetch manually: task red:multi:report OPERATION_ID={{.OPERATION_ID_COMPUTED}}"
            kill $PF_PID 2>/dev/null || true
            exit 0
          fi

          trap "kill $PF_PID 2>/dev/null || true" EXIT

          # Build Redis URL
          REDIS_PASS=$(kubectl get secret redis-secret -n {{.K8S_NAMESPACE}} -o jsonpath='{.data.password}' 2>/dev/null | base64 -d || echo "")
          if [ -z "$REDIS_PASS" ]; then
            echo "WARNING: Could not get Redis password, trying without auth"
          fi
          if [ -n "$REDIS_PASS" ]; then
            export ARES_REDIS_URL="redis://:${REDIS_PASS}@localhost:16379"
          else
            export ARES_REDIS_URL="redis://localhost:16379"
          fi

          # Fetch report
          if python -m ares.cli_ops report "{{.OPERATION_ID_COMPUTED}}" --output-dir ./reports 2>&1; then
            echo ""
            echo "✓ Report saved: ./reports/{{.OPERATION_ID_COMPUTED}}_report.md"
          else
            echo ""
            echo "ERROR: Report fetch failed"
            echo "Fetch manually: task red:multi:report OPERATION_ID={{.OPERATION_ID_COMPUTED}}"
          fi

          kill $PF_PID 2>/dev/null || true
        silent: false
        ignore_error: true

  # ===========================================================================
  # Python CLI wrappers - these call the new cli_ops commands
  # ===========================================================================

  multi:loot:
    desc: "Dump users, credentials, and hosts from Redis state (usage: task red:multi:loot [OPERATION_ID=op-xxx] [LATEST=true] [WATCH=10] [DIFF=true])"
    silent: true
    vars:
      OPERATION_ID: '{{.OPERATION_ID | default ""}}'
      LATEST: '{{.LATEST | default ""}}'
      WATCH: '{{.WATCH | default "0"}}'
      DIFF: '{{.DIFF | default "false"}}'
    preconditions:
      - sh: test -n "{{.OPERATION_ID}}" || test "{{.LATEST}}" = "true"
        msg: "Either OPERATION_ID or LATEST=true is required. Usage: task red:multi:loot OPERATION_ID=op-xxx  OR  task red:multi:loot LATEST=true"
    cmds:
      - |
        LATEST_FLAG=""
        if [ "{{.LATEST}}" = "true" ]; then
          LATEST_FLAG="--latest"
        fi
        OP_ID_ARG=""
        if [ -n "{{.OPERATION_ID}}" ]; then
          OP_ID_ARG="{{.OPERATION_ID}}"
        fi
        kubectl exec -i -n {{.K8S_NAMESPACE}} deploy/ares-orchestrator -- python -m ares.cli_ops loot $OP_ID_ARG $LATEST_FLAG {{if ne .WATCH "0"}}--watch {{.WATCH}}{{end}} {{if eq .DIFF "true"}}--diff{{end}}

  multi:status:
    desc: "Check multi-agent operation status (usage: task red:multi:status [OPERATION_ID=op-xxx] [LATEST=true])"
    silent: true
    vars:
      OPERATION_ID: '{{.OPERATION_ID | default ""}}'
      LATEST: '{{.LATEST | default ""}}'
    preconditions:
      - sh: test -n "{{.OPERATION_ID}}" || test "{{.LATEST}}" = "true"
        msg: "Either OPERATION_ID or LATEST=true is required"
    cmds:
      - |
        LATEST_FLAG=""
        if [ "{{.LATEST}}" = "true" ]; then
          LATEST_FLAG="--latest"
        fi
        OP_ID_ARG=""
        if [ -n "{{.OPERATION_ID}}" ]; then
          OP_ID_ARG="{{.OPERATION_ID}}"
        fi
        kubectl exec -i -n {{.K8S_NAMESPACE}} deploy/ares-orchestrator -- python -m ares.cli_ops status $OP_ID_ARG $LATEST_FLAG

  multi:tasks:list:
    desc: "List tasks for an operation (usage: task red:multi:tasks:list [OPERATION_ID=op-xxx] [LATEST=true] [ROLE=lateral] [STATUS=pending|in_progress|running|completed|failed|all])"
    silent: true
    vars:
      OPERATION_ID: '{{.OPERATION_ID | default ""}}'
      LATEST: '{{.LATEST | default ""}}'
      ROLE: '{{.ROLE | default ""}}'
      STATUS: '{{.STATUS | default "running"}}'
      VALID_STATUSES: "pending in_progress running completed failed cancelled retrying all"
    preconditions:
      - sh: test -n "{{.OPERATION_ID}}" || test "{{.LATEST}}" = "true"
        msg: "Either OPERATION_ID or LATEST=true is required"
      - sh: echo "{{.VALID_STATUSES}}" | grep -qw "{{.STATUS}}"
        msg: "Invalid STATUS '{{.STATUS}}'. Valid values: pending, in_progress, running, completed, failed, cancelled, retrying, all"
    cmds:
      - |
        LATEST_FLAG=""
        if [ "{{.LATEST}}" = "true" ]; then
          LATEST_FLAG="--latest"
        fi
        OP_ID_ARG=""
        if [ -n "{{.OPERATION_ID}}" ]; then
          OP_ID_ARG="{{.OPERATION_ID}}"
        fi
        ROLE_ARG=""
        if [ -n "{{.ROLE}}" ]; then
          ROLE_ARG="--role {{.ROLE}}"
        fi
        kubectl exec -i -n {{.K8S_NAMESPACE}} deploy/ares-orchestrator -- python -m ares.cli_ops tasks $OP_ID_ARG $LATEST_FLAG --task-status {{.STATUS}} $ROLE_ARG

  multi:runtime:
    desc: "Show runtime for an operation (usage: task red:multi:runtime [OPERATION_ID=op-xxx] [LATEST=true])"
    silent: true
    vars:
      OPERATION_ID: '{{.OPERATION_ID | default ""}}'
      LATEST: '{{.LATEST | default ""}}'
    preconditions:
      - sh: test -n "{{.OPERATION_ID}}" || test "{{.LATEST}}" = "true"
        msg: "Either OPERATION_ID or LATEST=true is required"
    cmds:
      - |
        LATEST_FLAG=""
        if [ "{{.LATEST}}" = "true" ]; then
          LATEST_FLAG="--latest"
        fi
        OP_ID_ARG=""
        if [ -n "{{.OPERATION_ID}}" ]; then
          OP_ID_ARG="{{.OPERATION_ID}}"
        fi
        kubectl exec -i -n {{.K8S_NAMESPACE}} deploy/ares-orchestrator -- python -m ares.cli_ops runtime $OP_ID_ARG $LATEST_FLAG

  multi:report:
    desc: "Generate markdown report for an operation (usage: task red:multi:report [OPERATION_ID=op-xxx] [LATEST=true] [REGENERATE=true])"
    silent: true
    vars:
      OPERATION_ID: '{{.OPERATION_ID | default ""}}'
      LATEST: '{{.LATEST | default ""}}'
      REGENERATE: '{{.REGENERATE | default "false"}}'
      OUTPUT_DIR: '{{.OUTPUT_DIR | default "./reports"}}'
    preconditions:
      - sh: test -n "{{.OPERATION_ID}}" || test "{{.LATEST}}" = "true"
        msg: "Either OPERATION_ID or LATEST=true is required. Usage: task red:multi:report OPERATION_ID=op-xxx  OR  task red:multi:report LATEST=true"
    cmds:
      - cmd: mkdir -p "{{.OUTPUT_DIR}}"
        silent: true
      - |
        LATEST_FLAG=""
        if [ "{{.LATEST}}" = "true" ]; then
          LATEST_FLAG="--latest"
        fi
        OP_ID_ARG=""
        if [ -n "{{.OPERATION_ID}}" ]; then
          OP_ID_ARG="{{.OPERATION_ID}}"
        fi
        REGEN_FLAG=""
        if [ "{{.REGENERATE}}" = "true" ]; then
          REGEN_FLAG="--regenerate"
        fi
        # Generate report via CLI (outputs to pod's /tmp, we retrieve from Redis)
        kubectl exec -i -n {{.K8S_NAMESPACE}} deploy/ares-orchestrator -- python -m ares.cli_ops report $OP_ID_ARG $LATEST_FLAG $REGEN_FLAG --output-dir /tmp/reports

        # Get the operation ID if we used --latest
        if [ -n "$LATEST_FLAG" ]; then
          RESOLVED_OP_ID=$(kubectl exec -i -n {{.K8S_NAMESPACE}} deploy/ares-orchestrator -- python -m ares.cli_ops list --latest 2>/dev/null | tr -d '\n')
        else
          RESOLVED_OP_ID="{{.OPERATION_ID}}"
        fi

        # Copy report from pod to local machine
        if [ -n "$RESOLVED_OP_ID" ]; then
          kubectl cp "{{.K8S_NAMESPACE}}/$(kubectl get pods -n {{.K8S_NAMESPACE}} -l app.kubernetes.io/name=ares-orchestrator -o jsonpath='{.items[0].metadata.name}'):/tmp/reports/${RESOLVED_OP_ID}_report.md" "{{.OUTPUT_DIR}}/${RESOLVED_OP_ID}_report.md" 2>/dev/null || true
          if [ -f "{{.OUTPUT_DIR}}/${RESOLVED_OP_ID}_report.md" ]; then
            echo "Report saved to: {{.OUTPUT_DIR}}/${RESOLVED_OP_ID}_report.md"
          fi
        fi

  reports:list:
    desc: List saved red team reports
    silent: true
    vars:
      OUTPUT_DIR: '{{.OUTPUT_DIR | default "./reports"}}'
    cmds:
      - |
        echo "Red Team Reports:"
        echo "================="
        if [ -d {{.OUTPUT_DIR}} ]; then
          ls -lht {{.OUTPUT_DIR}}/*_report.md 2>/dev/null || echo "No reports found"
        else
          echo "Report directory not found: {{.OUTPUT_DIR}}"
        fi

  reports:latest:
    desc: Show the latest red team report
    silent: true
    vars:
      OUTPUT_DIR: '{{.OUTPUT_DIR | default "./reports"}}'
    cmds:
      - |
        LATEST=$(ls -t {{.OUTPUT_DIR}}/*_report.md 2>/dev/null | head -1)
        if [ -n "$LATEST" ]; then
          echo "Latest report: $LATEST"
          echo "===================="
          cat "$LATEST"
        else
          echo "No reports found in {{.OUTPUT_DIR}}"
        fi

  multi:watch:
    desc: "Watch for completed operations and auto-fetch reports (usage: task red:multi:watch [POLL_INTERVAL=30] [ONCE=true])"
    silent: true
    vars:
      POLL_INTERVAL: '{{.POLL_INTERVAL | default "30"}}'
      OUTPUT_DIR: '{{.OUTPUT_DIR | default "./reports"}}'
      ONCE: '{{.ONCE | default "false"}}'
      REDIS_PASSWORD:
        sh: kubectl get secret redis-secret -n {{.K8S_NAMESPACE}} -o jsonpath='{.data.password}' 2>/dev/null | base64 -d || echo ""
    cmds:
      - cmd: mkdir -p "{{.OUTPUT_DIR}}"
        silent: true
      - |
        # Start port-forward in background (use 16379 locally to avoid conflicts with local Redis)
        # Kill any stale port-forward first
        lsof -ti:16379 | xargs kill 2>/dev/null || true
        sleep 1

        kubectl port-forward -n {{.K8S_NAMESPACE}} svc/redis 16379:6379 2>/dev/null &
        PF_PID=$!

        cleanup() {
          kill $PF_PID 2>/dev/null || true
          exit 0
        }
        trap cleanup INT TERM EXIT

        # Wait for port to be connectable (up to 15 seconds)
        i=0
        while [ $i -lt 15 ]; do
          if nc -z localhost 16379 2>/dev/null; then
            break
          fi
          sleep 1
          i=$((i + 1))
        done

        if ! nc -z localhost 16379 2>/dev/null; then
          echo "ERROR: kubectl port-forward failed (port not connectable after 15s)"
          exit 1
        fi

        # Build Redis URL with password if available
        if [ -n "{{.REDIS_PASSWORD}}" ]; then
          export ARES_REDIS_URL="redis://:{{.REDIS_PASSWORD}}@localhost:16379"
        else
          export ARES_REDIS_URL="redis://localhost:16379"
        fi

        ONCE_FLAG=""
        if [ "{{.ONCE}}" = "true" ]; then
          ONCE_FLAG="--once"
        fi

        # Run watch locally - fetches reports from Redis to local ./reports
        python -m ares.cli_ops watch --poll-interval {{.POLL_INTERVAL}} --output-dir "{{.OUTPUT_DIR}}" $ONCE_FLAG

  multi:list:
    desc: "List multi-agent operations and their state"
    silent: true
    cmds:
      - kubectl exec -i -n {{.K8S_NAMESPACE}} deploy/ares-orchestrator -- python -m ares.cli_ops queue

  multi:cleanup:
    desc: "Clean up old multi-agent operation checkpoints (usage: task red:multi:cleanup [MAX_AGE_HOURS=24])"
    silent: true
    vars:
      MAX_AGE_HOURS: '{{.MAX_AGE_HOURS | default "24"}}'
    cmds:
      - kubectl exec -i -n {{.K8S_NAMESPACE}} deploy/ares-orchestrator -- python -m ares.cli_ops cleanup --max-age-hours {{.MAX_AGE_HOURS}}

  multi:delete:
    desc: "Delete a specific operation and all its data (usage: task red:multi:delete OPERATION_ID=op-xxx)"
    silent: true
    vars:
      OPERATION_ID: '{{.OPERATION_ID | default ""}}'
    preconditions:
      - sh: test -n "{{.OPERATION_ID}}"
        msg: "OPERATION_ID variable is required"
    cmds:
      - kubectl exec -i -n {{.K8S_NAMESPACE}} deploy/ares-orchestrator -- python -m ares.cli_ops delete "{{.OPERATION_ID}}" --force

  multi:kill:
    desc: "Kill running operations except the latest (usage: task red:multi:kill [OPERATION_ID=op-xxx] [KEEP_LATEST=true])"
    silent: true
    vars:
      OPERATION_ID: '{{.OPERATION_ID | default ""}}'
      KEEP_LATEST: '{{.KEEP_LATEST | default "true"}}'
    cmds:
      - |
        set -euo pipefail
        if [ -n "{{.OPERATION_ID}}" ]; then
          # Kill specific operation
          echo "Killing operation: {{.OPERATION_ID}}"
          kubectl exec -i -n {{.K8S_NAMESPACE}} deploy/ares-orchestrator -- python -m ares.cli_ops delete "{{.OPERATION_ID}}" --force
        else
          # Get all running operations
          RUNNING_OPS=$(kubectl exec -i -n {{.K8S_NAMESPACE}} deploy/ares-orchestrator -- python -m ares.cli_ops queue 2>/dev/null | grep '\[running\]' | awk '{print $1}' || true)
          if [ -z "$RUNNING_OPS" ]; then
            echo "No running operations found"
            exit 0
          fi

          # Count running ops
          NUM_RUNNING=$(echo "$RUNNING_OPS" | wc -l | tr -d ' ')
          echo "Found $NUM_RUNNING running operation(s)"

          if [ "{{.KEEP_LATEST}}" = "true" ] && [ "$NUM_RUNNING" -gt 1 ]; then
            # Kill all except the latest (last one, since they're sorted by time)
            LATEST=$(echo "$RUNNING_OPS" | tail -1)
            TO_KILL=$(echo "$RUNNING_OPS" | head -n -1)
            echo "Keeping latest: $LATEST"
            for op in $TO_KILL; do
              echo "Killing: $op"
              kubectl exec -i -n {{.K8S_NAMESPACE}} deploy/ares-orchestrator -- python -m ares.cli_ops delete "$op" --force
            done
          elif [ "{{.KEEP_LATEST}}" = "false" ]; then
            # Kill all running
            for op in $RUNNING_OPS; do
              echo "Killing: $op"
              kubectl exec -i -n {{.K8S_NAMESPACE}} deploy/ares-orchestrator -- python -m ares.cli_ops delete "$op" --force
            done
          else
            echo "Only 1 running operation - use KEEP_LATEST=false to kill it"
          fi
        fi

  multi:backfill-domains:
